<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>closeupfarout</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@100&family=Space+Mono:ital@0;1&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink: #1a1008;
      --paper: #ffffff;
      --accent: #1a1008;
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--paper);
    }

    /* ── NAV ── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2rem;
      height: 80px;
      background: var(--paper);
    }

    .nav-wordmark {
      font-family: 'Josefin Sans', sans-serif;
      font-weight: 100;
      font-size: 1.4rem;
      letter-spacing: 0.15em;
      text-transform: lowercase;
      color: var(--ink);
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      list-style: none;
      gap: 2rem;
    }

    .nav-links a {
      font-family: 'Space Mono', monospace;
      font-size: 0.85rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent);
      text-decoration: none;
      opacity: 0.6;
      transition: opacity 0.2s;
    }

    .nav-links a:hover { opacity: 1; }

    /* ── STAGE ── */
    #stage {
      position: fixed;
      top: 80px; left: 0; right: 0; bottom: 0;
      overflow: hidden;
      background: var(--paper);
    }

    /* ── SPHERE SCENE ── */
    .scene {
      position: absolute;
      left: 28%;
      top: 50%;
      transform: translate(-50%, -50%);
      perspective: 900px;
    }

    .sphere {
      position: relative;
      width: 0; height: 0;
      transform-style: preserve-3d;
      animation: rotateSphere 32s linear infinite;
    }

    @keyframes rotateSphere {
      from { transform: rotateY(0deg) rotateX(12deg); }
      to   { transform: rotateY(360deg) rotateX(12deg); }
    }

    .tile {
      position: absolute;
      background-size: cover;
      background-position: center;
      backface-visibility: visible;
      border: 2px solid rgba(255,255,255,0.6);
    }

    /* ── COVER IMAGE ── */
    .cover {
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: auto;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 16vw;
    }

    .cover img {
      height: 90%;
      width: auto;
      object-fit: contain;
      display: block;
    }

    /* ── GRAIN ── */
    .grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 50;
      opacity: 0.04;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      background-size: 200px 200px;
    }
  </style>
</head>
<body>

  <nav>
    <a class="nav-wordmark" href="/">closeupfarout</a>
    <ul class="nav-links">
      <li><a href="/weekly/">Weekly</a></li>
      <li><a href="/quarterly/">Quarterly</a></li>
      <li><a href="/audio/">Audio</a></li>
    </ul>
  </nav>

  <div id="stage">
    <div class="scene">
      <div class="sphere" id="sphere"></div>
    </div>
    <div class="cover">
      <img src="images/issue-01-placeholder.png" alt="Issue 01 — Summer 2026" />
    </div>
  </div>

  <div class="grain"></div>

  <script>
    // Local images (used on Vercel / localhost:8080)
    // const IMAGES = [
    //   'images/67-laughing-gas.jpg',
    //   'images/Screen-Shot-2020-07-29-at-10.00.32-PM.png',
    //   'images/Screen-Shot-2020-11-20-at-4.06.40-PM.png',
    //   'images/Screen-Shot-2021-02-18-at-1.43.33-AM.png',
    //   'images/Screen-Shot-2021-08-11-at-3.12.55-AM.png',
    //   'images/b.h.-fish-pic-copy.JPG',
    //   'images/ballet-holo.png',
    //   'images/bern.png',
    //   'images/canvalley.png',
    //   'images/femarmharm.png',
    //   'images/leaflute.png',
    //   'images/live-coney.png',
    //   'images/showman-shadow.png',
    //   'images/skomorokh.png',
    //   'images/splitlip.png',
    // ];

    const IMAGES = [
      'images/sphere-img-01.jpg',
      'images/sphere-img-02.jpg',
      'images/sphere-img-03.jpg',
      'images/sphere-img-04.jpg',
      'images/sphere-img-05.jpg',
    ];

    const TILE_COUNT = 48;  // number of image tiles on the sphere
    const RADIUS     = 260; // sphere radius in px
    const TILE_SIZE  = 90;  // each tile is a square

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function buildSphere() {
      const sphere = document.getElementById('sphere');
      const pool   = shuffle(IMAGES);
      const golden = Math.PI * (3 - Math.sqrt(5)); // golden angle

      for (let i = 0; i < TILE_COUNT; i++) {
        // Fibonacci sphere distribution — evenly spaces points on a sphere
        const y     = 1 - (i / (TILE_COUNT - 1)) * 2;       // -1 to 1
        const r     = Math.sqrt(1 - y * y);
        const theta = golden * i;

        const lat = Math.asin(y)     * (180 / Math.PI); // latitude  -90..90
        const lon = (theta * 180 / Math.PI) % 360;      // longitude 0..360

        const tile = document.createElement('div');
        tile.className = 'tile';
        tile.style.width           = TILE_SIZE + 'px';
        tile.style.height          = TILE_SIZE + 'px';
        tile.style.marginLeft      = -TILE_SIZE / 2 + 'px';
        tile.style.marginTop       = -TILE_SIZE / 2 + 'px';
        tile.style.backgroundImage = `url('${pool[i % pool.length]}')`;
        // Place tile on sphere surface: rotate to longitude, tilt to latitude, push out
        tile.style.transform = `rotateY(${lon}deg) rotateX(${-lat}deg) translateZ(${RADIUS}px)`;
        sphere.appendChild(tile);
      }
    }

    buildSphere();
  </script>

</body>
</html>
