<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>closeupfarout</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@100&family=Space+Mono:ital@0;1&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Spectral:ital,wght@1,400&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink: #1a1008;
      --paper: #ffffff;
      --accent: #1a1008;
      --rule: rgba(26, 16, 8, 0.10);
      --dim: rgba(26, 16, 8, 0.45);
      --nav-h: 80px;
      --foot-h: 132px;
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--paper);
      color: var(--ink);
    }

    /* ── NAV ── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2rem;
      height: var(--nav-h);
      background: var(--paper);
    }

    .nav-wordmark {
      font-family: 'Josefin Sans', sans-serif;
      font-weight: 100;
      font-size: 1.4rem;
      letter-spacing: 0.15em;
      text-transform: lowercase;
      color: var(--ink);
      text-decoration: none;
    }

    .nav-links { display: flex; list-style: none; gap: 2rem; }

    .nav-links a {
      font-family: 'Space Mono', monospace;
      font-size: 0.85rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent);
      text-decoration: none;
      opacity: 0.6;
      transition: opacity 0.2s;
    }
    .nav-links a:hover { opacity: 1; }

    /* ── MAIN: weave left, cover right ── */
    main {
      position: fixed;
      top: var(--nav-h);
      left: 0; right: 0;
      bottom: var(--foot-h);
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    /* ── Left: hover veil with the cube from the old stage ── */
    #weave-link {
      position: relative;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      color: inherit;
      text-decoration: none;
    }

    #cento-overlay {
      position: absolute;
      inset: 0;
      z-index: 3;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      background: rgba(243, 242, 240, 0.90);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    /* Touch devices have no hover, so the veil never shows — the tap just
       follows the link, and the cube's video is never fetched. */
    @media (hover: hover) {
      #weave-link:hover #cento-overlay { opacity: 1; }
    }

    #cento-logo {
      font-family: 'Spectral', serif;
      font-style: italic;
      font-size: clamp(1.5rem, 2.2vw, 2.2rem);
      letter-spacing: 0.2em;
      text-indent: 0.2em; /* offset the trailing letter-space so it reads centred */
      white-space: nowrap;
    }

    /* Same four voice hues Cento uses, in the same order as its own wordmark */
    #cento-logo span:nth-child(1) { color: #c07a2b; }
    #cento-logo span:nth-child(2) { color: #8b3d6b; }
    #cento-logo span:nth-child(3) { color: #2b6e8b; }
    #cento-logo span:nth-child(4) { color: #4a7a46; }
    #cento-logo span:nth-child(5) { color: #c07a2b; }

    #cube-scene {
      position: relative;
      width: clamp(210px, 24vw, 300px);
      height: clamp(210px, 24vw, 300px);
      perspective: 900px;
    }

    #cube {
      position: absolute;
      left: 50%; top: 50%;
      width: 0; height: 0;
      transform-style: preserve-3d;
      animation: cubeSpin 32s linear infinite,
                 cubeBreathe 8s ease-in-out infinite;
    }

    @keyframes cubeSpin {
      from { transform: rotateY(0deg) rotateX(12deg); }
      to   { transform: rotateY(360deg) rotateX(12deg); }
    }

    /* Sized here rather than with a transform — cubeSpin owns `transform`,
       so the breathe animation drives the standalone `scale` property. */
    @keyframes cubeBreathe {
      0%, 100% { scale: 0.60; }
      50%      { scale: 0.53; }
    }

    #cube .tile {
      position: absolute;
      backface-visibility: visible;
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.03);
      will-change: transform;
      overflow: hidden;
    }

    #cube .tile-video {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      pointer-events: none;
      background: transparent;
    }

    /* ── Left: the woven text ── */
    #weave-pane {
      display: flex;
      flex-direction: column;
      min-height: 0;
      padding: 0 2rem 0 2rem;
      border-right: 1px solid var(--rule);
    }

    #weave {
      flex: 1;
      min-height: 0;
      /* Deliberately clipped, not scrollable — the weave runs past the bottom
         edge mid-sentence so the page reads as an excerpt of something larger. */
      overflow: hidden;
      padding: 1.6rem 0 1.2rem;
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.02rem, 1.15vw, 1.24rem);
      line-height: 1.85;
    }

    #weave.loading {
      display: flex;
      align-items: center;
      font-family: 'Space Mono', monospace;
      font-size: 0.78rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--dim);
    }

    @keyframes pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 0.75; } }
    #weave.loading p { animation: pulse 2s ease-in-out infinite; }

    /* ── Left: attributions ── */
    #sources {
      flex-shrink: 0;
      border-top: 1px solid var(--rule);
      padding: 0.9rem 0 1.1rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.3rem 1.5rem;
    }

    /* Plain text, not links — the whole preview block is one link to Cento. */
    #sources span {
      font-family: 'EB Garamond', serif;
      font-size: 0.83rem;
      line-height: 1.4;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      opacity: 0.9;
    }

    /* ── Right: Issue-01 cover ── */
    #cover-pane {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      min-height: 0;
    }

    #cover-pane a {
      display: block;
      max-height: 100%;
      line-height: 0;
      transition: transform 0.4s ease;
    }
    #cover-pane a:hover { transform: translateY(-4px); }

    #cover-pane img {
      display: block;
      max-width: 100%;
      max-height: 100%;
      width: auto; height: auto;
      object-fit: contain;
    }

    /* ── Footer / audio player ── */
    footer {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      height: var(--foot-h);
      border-top: 1px solid var(--rule);
      background: var(--paper);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2rem;
      gap: 2rem;
    }

    #player-slot {
      flex: 1;
      min-width: 0;
      height: 100%;
      display: flex;
      align-items: center;
    }

    .foot-meta {
      font-family: 'Space Mono', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--dim);
      white-space: nowrap;
    }

    /* ── MOBILE: stack weave over cover ── */
    @media (max-width: 768px) {
      :root { --nav-h: 110px; --foot-h: 104px; }

      nav {
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.6rem;
      }
      .nav-links { gap: 1.4rem; justify-content: center; }
      .nav-links a { font-size: 0.75rem; }

      main { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }

      #weave-pane { border-right: none; padding: 0 1.4rem; }
      #weave { font-size: 1.02rem; }

      #sources { grid-template-columns: 1fr; }
      #sources span { font-size: 0.78rem; }

      /* The cover would crowd the weave on a phone; the nav still reaches it. */
      #cover-pane { display: none; }

      footer { padding: 0 1.4rem; }
      .foot-meta { display: none; }
    }

    /* ── GRAIN ── */
    .grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 50;
      opacity: 0.04;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      background-size: 200px 200px;
    }
  </style>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
</head>
<body>

  <nav>
    <a class="nav-wordmark" href="/">closeupfarout</a>
    <ul class="nav-links">
      <li><a href="/cento/">Cento</a></li>
      <li><a href="/periodical/">Issue-01</a></li>
    </ul>
  </nav>

  <main>
    <div id="weave-pane">
      <a id="weave-link" href="/cento/" aria-label="Open Cento">
        <div id="weave" class="loading"><p>gathering voices</p></div>
        <div id="sources"></div>
        <div id="cento-overlay" aria-hidden="true">
          <div id="cento-logo"><span>C</span><span>E</span><span>N</span><span>T</span><span>O</span></div>
          <div id="cube-scene"><div id="cube"></div></div>
        </div>
      </a>
    </div>

    <div id="cover-pane">
      <a href="/periodical/">
        <img src="/images/issue-01-placeholder.png" alt="Issue 01 — Summer 2026" />
      </a>
    </div>
  </main>

  <footer>
    <div id="player-slot"><!-- audio player --></div>
    <div class="foot-meta">Close Up Far Out</div>
  </footer>

  <div class="grain"></div>

  <script>
  (function () {
    'use strict';

    // A small, read-only Cento: one fresh weave per page load. No corners, no
    // controls — just the aggregate text and who it came from. The full
    // instrument lives at /cento/.
    const VOICE_COLORS = ['#c07a2b', '#8b3d6b', '#2b6e8b', '#4a7a46'];
    // Deliberately more than any screen shows. The pane clips rather than
    // scrolls, so this just has to guarantee the text runs past the bottom
    // edge on a tall display instead of stopping short with dead space.
    const SENTENCES = 44;

    // Only a few dozen sentences are needed here, so ask the API for a small
    // slice of each book rather than the whole text.
    const PARAGRAPH_WINDOW = 12;

    // ── Sentence splitting (mirrors /cento) ──────────────────
    const ABBR_PERIOD = '\uE000';
    const ABBR_WORDS = /\b(Mr|Mrs|Ms|Mmes|Messrs|Mme|Mlle|Dr|Drs|Prof|Profs|Sr|Jr|Sra|Srta|St|Ste|Ss|Rev|Revd|Fr|Bro|Br|Msgr|Mgr|Ven|Bp|Abp|Card|Rt|Hon|Gen|Col|Lt|Lieut|Maj|Capt|Cpl|Sgt|Cmdr|Cdr|Cmdre|Adm|Brig|Pvt|Pfc|Ens|Sfc|Gov|Sen|Rep|Pres|Supt|Det|Insp|Amb|Mt|Ft|No|Nos|Vol|Vols|pp|Ch|Fig|Figs|Ed|Eds|Inc|Ltd|Co|Corp|Bros|Ave|Rd|Blvd|etc|vs|viz|cf|al|ibid|op|esp|ca|fl|Jan|Feb|Mar|Apr|Jun|Jul|Aug|Sep|Sept|Oct|Nov|Dec)\./g;

    function protectAbbrev(text) {
      return text
        .replace(/\b(?:[A-Za-z]\.){2,}/g, m => m.replace(/\./g, ABBR_PERIOD))
        .replace(/\b[A-Za-z]\.(?:\s+[A-Za-z]\.)+/g, m => m.replace(/\./g, ABBR_PERIOD))
        .replace(/\b[IVXLCDM]{2,}\./g, m => m.replace(/\./g, ABBR_PERIOD))
        .replace(ABBR_WORDS, (m, w) => w + ABBR_PERIOD);
    }

    function splitSentences(text) {
      const re = /[\s\S]+?[.!?…]+["”'’)\]]*(?=\s+["“'‘(]*[A-Z0-9]|\s*$)|[\s\S]+$/g;
      const matches = protectAbbrev(text).match(re);
      if (!matches) return [];
      return matches
        .map(s => s.split(ABBR_PERIOD).join('.').trim())
        .filter(s =>
          s.split(/\s+/).length >= 3 &&
          !/\S+@\S+\.\S+/.test(s) &&
          !/^[IVXLCDM]+\.?\s*—/.test(s)
        );
    }

    function esc(str) {
      return String(str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // ── Weave: round-robin one sentence per voice ────────────
    function weave(voices) {
      const live = voices.filter(v => v.sentences.length);
      if (!live.length) return '';
      const perVoice = Math.ceil(SENTENCES / live.length);
      const rows = live.map(v => v.sentences.slice(0, perVoice));
      const maxLen = Math.max(...rows.map(r => r.length));

      const spans = [];
      for (let i = 0; i < maxLen && spans.length < SENTENCES; i++) {
        for (let j = 0; j < live.length && spans.length < SENTENCES; j++) {
          if (i < rows[j].length) {
            spans.push(
              '<span style="color:' + live[j].color + '">' + esc(rows[j][i]) + '</span>'
            );
          }
        }
      }
      return '<p>' + spans.join(' ') + '</p>';
    }

    function renderSources(voices) {
      document.getElementById('sources').innerHTML = voices
        .filter(v => v.sentences.length && v.title)
        .map(v =>
          '<span style="color:' + v.color + '" title="' +
          esc(v.title) + (v.author ? ' — ' + esc(v.author) : '') + '">' +
          esc(v.title) + '</span>'
        )
        .join('');
    }

    async function load() {
      const weaveEl = document.getElementById('weave');
      try {
        const res = await fetch('/api/instrument-01?window=' + PARAGRAPH_WINDOW);
        if (!res.ok) throw new Error('API ' + res.status);
        const data = await res.json();

        const voices = (data.voices || []).map((v, i) => ({
          title: v.title,
          author: v.author,
          color: VOICE_COLORS[i],
          sentences: splitSentences((v.paragraphs || []).join(' ')),
        }));

        const html = weave(voices);
        if (!html) throw new Error('no text');

        weaveEl.classList.remove('loading');
        weaveEl.innerHTML = html;
        renderSources(voices);
      } catch (err) {
        weaveEl.innerHTML = '<p>voices unavailable</p>';
        console.error('Cento weave:', err);
      }
    }

    load();

    // ── Hover cube (carried over from the old stage design) ──
    // Built on first hover rather than at load, so the landing page stays light
    // until someone actually reaches for it. Uses the -mobile encodes on every
    // device: the tiles render at 88px, where the full-size files are wasted.
    const CUBE_VIDEOS = [
      '/videos/cube/cube-vid-01-mobile.webm',
      '/videos/cube/cube-vid-02-mobile.webm',
      '/videos/cube/cube-vid-03-mobile.webm',
      '/videos/cube/cube-vid-04-mobile.webm',
    ];
    const RADIUS = 260;
    const TILE_SIZE = 88;

    function tf(rY, rX, tZ, tX, tY) {
      return 'rotateY(' + rY + 'deg) rotateX(' + rX + 'deg) translateZ(' + tZ +
             'px) translateX(' + tX + 'px) translateY(' + tY + 'px)';
    }

    // 6 faces x a 3x3 grid = 54 tiles.
    function cubePositions() {
      const S = RADIUS * 0.46; // face half-extent — ~8px gap between tiles
      const FACES = [
        [0, 0], [-90, 0], [180, 0], [90, 0], [0, -90], [0, 90],
      ];
      const out = [];
      FACES.forEach(([rY, rX]) => {
        for (let r = 0; r < 3; r++) {
          for (let c = 0; c < 3; c++) {
            out.push({
              rY, rX,
              tZ: S + TILE_SIZE / 2 + 18,
              tX: S * (-1 + c),
              tY: S * (-1 + r) - 20,
            });
          }
        }
      });
      return out;
    }

    let cubeTiles = null;

    function buildCube() {
      if (cubeTiles) return;
      const cube = document.getElementById('cube');
      const frag = document.createDocumentFragment();

      cubePositions().forEach((p, i) => {
        const tile = document.createElement('div');
        tile.className = 'tile';
        tile.style.width = TILE_SIZE + 'px';
        tile.style.height = TILE_SIZE + 'px';
        tile.style.marginLeft = (-TILE_SIZE / 2) + 'px';
        tile.style.marginTop = (-TILE_SIZE / 2) + 'px';
        tile.style.transform = tf(p.rY, p.rX, p.tZ, p.tX, p.tY);

        const vid = document.createElement('video');
        vid.className = 'tile-video';
        vid.muted = true;
        vid.loop = true;
        vid.playsInline = true;
        vid.preload = 'auto';
        vid.src = CUBE_VIDEOS[i % CUBE_VIDEOS.length];
        tile.appendChild(vid);

        frag.appendChild(tile);
      });

      cube.appendChild(frag);
      cubeTiles = cube.querySelectorAll('video');
    }

    if (window.matchMedia('(hover: hover)').matches) {
      const link = document.getElementById('weave-link');

      link.addEventListener('pointerenter', () => {
        buildCube();
        // Only decode while the veil is actually up — 54 tiles is a lot to
        // leave running behind an invisible overlay.
        cubeTiles.forEach(v => { const p = v.play(); if (p) p.catch(() => {}); });
      });

      link.addEventListener('pointerleave', () => {
        if (cubeTiles) cubeTiles.forEach(v => v.pause());
      });
    }
  })();
  </script>

</body>
</html>
