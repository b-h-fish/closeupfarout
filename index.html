        // Only at the width where the two actually sit side by side; the
        // mobile stylesheet owns the rows below that and must not be fought.
        if (!window.matchMedia('(min-width: 769px)').matches) {
          mainEl.style.removeProperty('--lit-top');
          return;
        }
        const y = sources.getBoundingClientRect().top - mainEl.getBoundingClientRect().top;
        if (y > 0) mainEl.style.setProperty('--lit-top', Math.round(y) + 'px');
      };
      // The block moves when its own height changes, when the pane resizes,
      // and when the webfont lands and the weave re-trims under it.
      const ro = new ResizeObserver(align);
      ro.observe(sources);
      ro.observe(mainEl);
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(align);
      align();
    }

    /* Builds the spread. The columns do the pagination; this only has to
       count how many of them there are and slide the flow by one spread at a
       time. Everything is measured rather than assumed, so the same code
       holds at any window size and re-paginates on resize. */
    function book(w) {
      const el = document.createElement('div');
      el.className = 'book';
      el.innerHTML =
        '<div class="leaves">' +
          '<div class="flow"></div>' +
          '<div class="spine"></div>' +
        '</div>' +
        '<div class="folio">' +
          '<button type="button" class="prev" aria-label="Previous page">\u2039</button>' +
          '<span class="n"></span>' +
          '<button type="button" class="next" aria-label="Next page">\u203a</button>' +
        '</div>';

      const leaves = el.querySelector('.leaves');
      const flow = el.querySelector('.flow');
      const prev = el.querySelector('.prev');
      const next = el.querySelector('.next');
      const num  = el.querySelector('.n');

      const h = document.createElement('h1'); h.textContent = w.title;
      const m = document.createElement('div'); m.className = 'meta';
      m.textContent = w.author + ' \u00b7 closeupfarout';
      flow.append(h, m);
      w.text.forEach(function (para) {
        const pEl = document.createElement('p'); pEl.textContent = para; flow.appendChild(pEl);
      });
      const end = document.createElement('div'); end.className = 'end';
      end.textContent = 'closeupfarout';
      flow.appendChild(end);

      let spread = 0, spreads = 1, step = 0;

      function measure() {
        const W = leaves.clientWidth;
        const gap = parseFloat(getComputedStyle(flow).columnGap) || 0;
        step = W + gap;
        // Measured with the flow back at zero: scrollWidth is relative to the
        // scroll box, so reading it mid-slide reports the wrong extent.
        const t = flow.style.transform;
        flow.style.transition = 'none';
        flow.style.transform = 'translateX(0)';
        const extent = leaves.scrollWidth;
        spreads = Math.max(1, Math.round((extent + gap) / step));
        flow.style.transform = t;
        // One frame of no transition, so restoring it does not animate.
        requestAnimationFrame(function () { flow.style.transition = ''; });
        if (spread >= spreads) spread = spreads - 1;
        paint();
      }

      function paint() {
        flow.style.transform = 'translateX(' + (-spread * step) + 'px)';
        prev.disabled = spread === 0;
        next.disabled = spread >= spreads - 1;
        num.textContent = spreads === 1 ? '1 of 1'
          : (spread * 2 + 1) + '\u2013' + (spread * 2 + 2) + ' of ' + (spreads * 2);
      }

      function go(d) {
        const n = spread + d;
        if (n < 0 || n >= spreads) return;
        spread = n; paint();
      }

      prev.addEventListener('click', function () { go(-1); });
      next.addEventListener('click', function () { go(1); });

      // A book turns when you click a page. Only when nothing is selected,
      // or finishing a drag over a sentence would flip it away.
      leaves.addEventListener('click', function (e) {
        const sel = window.getSelection();
        if (sel && !sel.isCollapsed) return;
        const r = leaves.getBoundingClientRect();
        go(e.clientX - r.left < r.width / 2 ? -1 : 1);
      });

      el.addEventListener('keydown', function (e) {
        if (e.key === 'ArrowLeft') { e.preventDefault(); go(-1); }
        else if (e.key === 'ArrowRight') { e.preventDefault(); go(1); }
      });

      // Fonts land after the first layout and change where every column
      // breaks, so the count has to be taken again once they have.
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(measure);
      const ro = new ResizeObserver(function () {
        if (!el.isConnected) { ro.disconnect(); return; }
        measure();
      });
      ro.observe(leaves);

      return el;
    }

    WORKS.forEach(function (w) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'work';
      // The cover carries its own type, so the button has no text of its
      // own — the label is what a screen reader gets instead of the drawing.
      b.innerHTML = w.art;
      b.setAttribute('aria-label', w.title + ', ' + w.author);
      b.addEventListener('click', function () {
        window.CUFO.expand.open(book(w), w.title, b);
      });
      rail.appendChild(b);
    });
  })();
  </script>

</body>
</html>
