<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>closeupfarout</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@100&family=Space+Mono:ital@0;1&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink: #1a1008;
      --paper: #ffffff;
      --accent: #1a1008;
      --gap: 3px;
    }

    html, body {
      width: 100%; height: 100%;
      max-height: 100%;
      overflow: hidden;
      background: var(--paper);
    }

    /* ── NAV ── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2rem;
      height: 52px;
      background: var(--paper);
    }

    .nav-wordmark {
      font-family: 'Josefin Sans', sans-serif;
      font-weight: 100;
      font-size: 1.1rem;
      letter-spacing: 0.15em;
      text-transform: lowercase;
      color: var(--ink);
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      list-style: none;
    }

    .nav-links a {
      font-family: 'Space Mono', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent);
      text-decoration: none;
      opacity: 0.6;
      transition: opacity 0.2s;
    }

    .nav-links a:hover { opacity: 1; }

    /* ── STAGE ── */
    #stage {
      position: fixed;
      top: 52px; left: 0; right: 0; bottom: 0;
      overflow: hidden;
      background: var(--paper);
    }

    /* ── CELLS ── */
    .cell {
      position: absolute;
      background-size: cover;
      background-position: center;
      opacity: 0;
      transition-property: opacity;
      transition-timing-function: ease-in-out;
    }

    /* ── GRAIN ── */
    .grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 50;
      opacity: 0.04;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      background-size: 200px 200px;
    }
  </style>
</head>
<body>

  <nav>
    <a class="nav-wordmark" href="/">closeupfarout</a>
    <ul class="nav-links">
      <li><a href="/issue-01/">Issue 01 — Spring 2026</a></li>
    </ul>
  </nav>

  <div id="stage"></div>

  <div class="grain"></div>

  <script>
    const IMAGES = [
      'images/67-laughing-gas.jpg',
      'images/Screen-Shot-2020-07-29-at-10.00.32-PM.png',
      'images/Screen-Shot-2020-11-20-at-4.06.40-PM.png',
      'images/Screen-Shot-2021-02-18-at-1.43.33-AM.png',
      'images/Screen-Shot-2021-08-11-at-3.12.55-AM.png',
      'images/b.h.-fish-pic-copy.JPG',
      'images/ballet-holo.png',
      'images/bern.png',
      'images/canvalley.png',
      'images/femarmharm.png',
      'images/leaflute.png',
      'images/live-coney.png',
      'images/showman-shadow.png',
      'images/skomorokh.png',
      'images/splitlip.png',
    ];

    // Base grid columns. All cell sizes are multiples of one base unit.
    // Allowed cell sizes in base units: 1×1, 2×2, 4×4
    const BASE_COLS    = 8;
    const SIZES        = [4, 2, 1]; // tried largest-first per cell
    const GAP          = 3;
    const HOLD_MS      = 3500;
    const STAGGER_MS   = 1400;
    const MIN_FADE_MS  = 300;
    const MAX_FADE_MS  = 2200;
    const OVERLAP_MS   = 700;

    const stage = document.getElementById('stage');

    function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
    function randFade() { return MIN_FADE_MS + Math.random() * (MAX_FADE_MS - MIN_FADE_MS); }
    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function buildMosaic() {
      const W = stage.clientWidth;
      const H = stage.clientHeight;
      const unit = (W - GAP * (BASE_COLS - 1)) / BASE_COLS; // one base unit in px
      const BASE_ROWS = Math.ceil((H + GAP) / (unit + GAP));

      // Occupancy grid — tracks which base cells are taken
      const taken = Array.from({ length: BASE_ROWS + 4 }, () => new Uint8Array(BASE_COLS));

      function fits(r, c, s) {
        if (c + s > BASE_COLS) return false;
        for (let dr = 0; dr < s; dr++)
          for (let dc = 0; dc < s; dc++)
            if (taken[r + dr]?.[c + dc]) return false;
        return true;
      }

      function occupy(r, c, s) {
        for (let dr = 0; dr < s; dr++)
          for (let dc = 0; dc < s; dc++)
            if (taken[r + dr]) taken[r + dr][c + dc] = 1;
      }

      const pool = shuffle(IMAGES);
      const cells = [];
      let imgIdx = 0;

      for (let r = 0; r < BASE_ROWS; r++) {
        for (let c = 0; c < BASE_COLS; c++) {
          if (taken[r][c]) continue;

          // Weighted random size pick: bias toward 1×1 but allow larger
          const roll = Math.random();
          const preferred = roll < 0.12 ? [4, 2, 1]
                          : roll < 0.42 ? [2, 1, 4]
                          :               [1, 2, 4];

          let chosen = 1;
          for (const s of preferred) {
            if (fits(r, c, s)) { chosen = s; break; }
          }

          occupy(r, c, chosen);

          // Pixel size: span chosen units + interior gaps
          const px = chosen * unit + (chosen - 1) * GAP;
          const x  = c * (unit + GAP);
          const y  = r * (unit + GAP);
          const src = pool[imgIdx++ % pool.length];

          const el = document.createElement('div');
          el.className = 'cell';
          el.style.left   = `${x}px`;
          el.style.top    = `${y}px`;
          el.style.width  = `${px}px`;
          el.style.height = `${px}px`;
          el.style.backgroundImage = `url('${src}')`;
          stage.appendChild(el);
          cells.push(el);
        }
      }
      return cells;
    }

    async function fadeIn(cells) {
      await sleep(40);
      cells.forEach(cell => {
        cell.style.transitionDuration = `${randFade()}ms`;
        cell.style.transitionDelay    = `${Math.random() * STAGGER_MS}ms`;
        cell.style.opacity = '1';
      });
      await sleep(STAGGER_MS + MAX_FADE_MS);
      cells.forEach(cell => { cell.style.transitionDelay = '0ms'; });
    }

    function fadeOut(cells) {
      cells.forEach(cell => {
        cell.style.transitionDuration = `${randFade()}ms`;
        cell.style.transitionDelay    = `${Math.random() * STAGGER_MS}ms`;
        cell.style.opacity = '0';
      });
      setTimeout(() => cells.forEach(c => c.remove()), STAGGER_MS + MAX_FADE_MS);
    }

    async function run() {
      let current = buildMosaic();
      await fadeIn(current);
      while (true) {
        await sleep(HOLD_MS);
        fadeOut(current);
        await sleep(OVERLAP_MS);
        current = buildMosaic();
        await fadeIn(current);
      }
    }

    run();
  </script>

</body>
</html>
