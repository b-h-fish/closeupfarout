<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>closeupfarout</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@100;200;400&family=Space+Mono:ital@0;1&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Spectral:ital,wght@1,400&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink: #1a1008;
      --paper: #ffffff;
      --accent: #1a1008;
      --rule: rgba(26, 16, 8, 0.10);
      --dim: rgba(26, 16, 8, 0.45);
      /* Slim bar across the top. A shade off the #090909 page so it separates
         without becoming a band of colour. */
      --logo-w: 90px; /* the logo strip down the left edge */
      /* One black for the whole page, so the logo strip is not a separate
         surface that has to be kept matching. */
      --page: #090909;
      /* How long one set of books takes to melt into the next. The script reads
         this back, so the timing is defined only here. */
      --melt: 1.6s;
      /* E-ink: a Kindle screen, which is a flat light grey with no warmth in
         it at all — not paper, not cream, and nowhere near #fff. The ink is a
         soft near-black, because the particles never reach true black either.
         Both live here rather than in either place that uses them: the covers
         on the front page are literally small pieces of the screen they open
         into, so they must not be allowed to drift apart. */
      --eink-bg: #d9d9d7;
      --eink-ink: #2b2b2b;
      --eink-dim: #6e6e6c;
      --eink-rule: rgba(43, 43, 43, 0.26);
      --eink-page: #dedede;
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--page);
      color: var(--ink);
    }


    /* ── HEADER ── */
    /* The wordmark runs down the far left rather than across the top, so there
       is no header band any more and the teasers start at the very top of the
       page. */
    body > header {
      position: fixed;
      top: 0; bottom: 0; left: 0;
      z-index: 100;
      width: var(--logo-w);
      /* No background of its own — the page black shows through. */
    }

    /* The wordmark is stretched to the full width of the bar — every letter
       widened by the same factor, so the proportions between them survive and
       it still reads as a word.

       SVG does this natively: textLength forces the run to an exact width and
       lengthAdjust="spacingAndGlyphs" gets there by scaling the glyphs as well
       as the gaps. So there is no measuring script and no resize listener, and
       it reflows for free at any window width. preserveAspectRatio="none" maps
       the viewBox onto the element, which is what lets the height stay fixed
       while the width follows the bar. */
    /* Upright capitals stacked down the strip. textLength cannot do this — it
       stretches along the run, which once the letters stand up is the wrong
       axis — so each letter gets its own row and its own vertical scale.

       13 equal rows, 4vh clear at each end so the C and the T stay off the
       edges. The left padding is what nudges the column toward Split rather
       than sitting on the page margin. */
    #brand {
      height: 100%;
      display: grid;
      grid-template-rows: repeat(13, 1fr);
      place-items: center;
      padding: 4vh 0 4vh 14px;
    }

    #brand .ltr {
      display: block;
      font-family: 'Josefin Sans', sans-serif;
      font-weight: 400;
      /* Glyph height is font-size x scaleY in fixed px, while the rows divide
         the viewport — so a short window would have the letters running into
         each other. Capping the size against vh keeps the ratio safe at any
         height; 18px is the ceiling on a tall screen. */
      font-size: min(18px, 2.05vh);
      line-height: 1;
      color: rgba(245, 242, 236, 0.85);
      /* Wide as well as tall — the horizontal scale is what makes it read as
         a logo rather than letters sitting in a margin. */
      transform: scale(4.0, 4.6);
    }


    #brand text {
      font-family: 'Josefin Sans', sans-serif;
      font-weight: 200; /* 100 goes wispy once the strokes are stretched thin */
      font-size: 36px;
      fill: rgba(245, 242, 236, 0.85);
    }



    /* ── MAIN: Cento teaser left, Split teaser lower right ── */
    main {
      position: fixed;
      top: 0; bottom: 0;
      left: var(--logo-w);
      right: 0;
      display: grid;
      /* Split Stack beside the logo strip, the record library on the outside.
         The columns are unchanged — 60/40 — only what sits in them: Cento has
         moved into the quarter the library used to hold, and the library has
         taken Cento's column. */
      grid-template-columns: 3fr 2fr;
      /* The right column carries two things: the record library, and a shelf
         of writing under it. The shelf starts on Cento's rule — the line
         above its attributions, not the bottom of its pane — so the two
         columns share a horizontal.

         That line cannot be expressed as a track, because where it falls
         depends on how tall the attribution block is, which depends on how
         many lines the titles take. So it is measured and fed back as
         --lit-top. The fallback is what the layout does before the script
         runs, and on mobile, where the rule is overridden outright. */
      grid-template-rows: var(--lit-top, minmax(444px, 1fr)) 1fr;
      background: var(--page);
    }

    /* ── Left: hover veil over the preview block ── */
    #weave-link {
      position: relative;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      color: inherit;
      text-decoration: none;
    }

    #cento-overlay {
      position: absolute;
      inset: 0;
      z-index: 3;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      background: rgba(9, 9, 9, 0.88);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    /* Touch devices have no hover, so the veil never shows — the tap just
       follows the link through to Cento. */
    @media (hover: hover) {
      #weave-link:hover #cento-overlay { opacity: 1; }
    }

    #cento-logo {
      font-family: 'Spectral', serif;
      font-style: italic;
      font-size: clamp(2.1rem, 3.2vw, 3.2rem);
      letter-spacing: 0.2em;
      text-indent: 0.2em; /* offset the trailing letter-space so it reads centred */
      white-space: nowrap;
    }

    /* Same four voice hues Cento uses, in the same order as its own wordmark */
    #cento-logo span:nth-child(1) { color: #c07a2b; }
    #cento-logo span:nth-child(2) { color: #8b3d6b; }
    #cento-logo span:nth-child(3) { color: #2b6e8b; }
    #cento-logo span:nth-child(4) { color: #4a7a46; }
    #cento-logo span:nth-child(5) { color: #c07a2b; }

    /* ── Left: the woven text ── */
    #weave-pane {
      display: flex;
      flex-direction: column;
      min-height: 0;
      grid-column: 2;
      grid-row: 1;
      position: relative;
      z-index: 1;
      /* A quarter now, not a column: it clips, and the margins are even
         because neither side is the page edge any more.

         The weave's own type, rule and rhythm are deliberately untouched at
         this width. The one thing that does not survive the narrower cell is
         the attributions: `.sources` is two columns of nowrap text, so a
         Gutenberg-length title ellipses at about half its length. Kept at the
         user's choice — the 2x2 arrangement was worth more than the full
         titles. One column fits them whole if that trade is ever revisited. */
      overflow: hidden;
      padding: 0 1rem;

      /* Cento's own dark colourway, kept to this block so the rest of the page
         stays on paper. The voice hues need no adjustment — they were chosen
         against this background in the first place. */
      --teaser-bg: #090909;
      --teaser-fg: #f5f2ec;
      --teaser-rule: rgba(245, 242, 236, 0.14);
      --teaser-dim: rgba(245, 242, 236, 0.42);
      background: var(--teaser-bg);
      color: var(--teaser-fg);
    }

    .weave {
      flex: 1;
      min-height: 0;
      /* Deliberately clipped, not scrollable — the weave runs past the bottom
         edge mid-sentence so the page reads as an excerpt of something larger.
         The script trims this to a whole number of lines so the cut always
         falls cleanly between them, never through one. */
      overflow: hidden;
      padding: 1.6rem 0 1.2rem;
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.02rem, 1.15vw, 1.24rem);
      /* Single source of truth: the script reads this back to size a line. */
      --line-ratio: 1.85;
      line-height: var(--line-ratio);
    }

    /* Loading is silent — the pane simply stays empty until the weave lands.
       This is only for the failure case, kept quiet so it doesn't shout. */
    .weave-msg {
      font-style: italic;
      color: var(--teaser-dim);
    }

    /* One colour per borrowed voice, held. The pane used to settle the four
       into a single hand every nine seconds and separate again; the four
       voices are the point, so they stay. Colour comes from a class rather
       than an inline style because the weave is built as a string. */
    #weave-pane .v0 { color: #c07a2b; }
    #weave-pane .v1 { color: #8b3d6b; }
    #weave-pane .v2 { color: #2b6e8b; }
    #weave-pane .v3 { color: #4a7a46; }

    /* Melting into a new set of books. The outgoing text is cloned into #ghost,
       stacked over the live pane, and the two cross in opposite directions at
       once — so the old text is still dissolving as the new one surfaces,
       rather than the pane emptying between them.

       Opacity is independent of the colour cycle above, so a melt and a colour
       crossing can overlap without either disturbing the other. The ghost sits
       under #cento-overlay (z-index 3) so hovering still works mid-melt. */
    #ghost {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: flex;
      flex-direction: column;
      pointer-events: none;
    }

    .weave, .sources, #ghost { transition: opacity var(--melt) ease-in-out; }

    /* Indefinite colour cycling is exactly what this preference is for. */
    @media (prefers-reduced-motion: reduce) {
      .weave span { transition: none; }
    }

    /* ── Left: attributions ── */
    .sources {
      flex-shrink: 0;
      /* The weave above is trimmed to whole lines, so it no longer fills the
         pane. Hold this at the bottom and let the slack sit above the rule. */
      margin-top: auto;
      border-top: 1px solid var(--teaser-rule);
      padding: 0.9rem 0 1.1rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.3rem 1.5rem;
    }

    /* Plain text, not links — the whole preview block is one link to Cento. */
    .sources span {
      font-family: 'EB Garamond', serif;
      font-size: 0.83rem;
      line-height: 1.4;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      opacity: 0.9;
    }

    /* ── MOBILE: one column ── */
    @media (max-width: 768px) {
      main { grid-template-columns: 1fr; }
      #weave-pane { padding: 0 1.4rem; }
      .weave { font-size: 1.02rem; }
      .sources { grid-template-columns: 1fr; }
      .sources span { font-size: 0.78rem; }
    }

    /* ── GRAIN ── */
    .grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 50;
      opacity: 0.04;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      background-size: 200px 200px;
    }

    /* ── Split teaser ──
       Built on the same idea as the Cento block beside it: the page shows the
       actual thing rather than a picture of it. The game plays itself here
       through its own rules engine, renderer and palettes, so a card on the
       front page is the card you get when you follow the link. */
    /* The pane read as one square quartered: Split Stack in the upper left,
       the upper right empty for now, Waver across both lower cells.

       The top row carries a minimum. The teaser only draws at whole-number
       scales, and a 2x2 board needs 336x436 to reach scale 2 — at an even split
       of an 813px viewport each row is 406, thirty short, and the cards halve.
       minmax keeps the rows equal wherever there is room for both to clear the
       floor (a viewport of ~888 and up) and holds it below that. The floor is
       444 rather than 436 so the comparison is not decided by sub-pixel
       rounding: at exactly 436 a fraction either way silently halves the card
       and nothing reports it. */
    #hilo-pane {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: minmax(444px, 1fr) 1fr;
      /* No gap: the two teasers meet. */
      min-height: 0;
      position: relative;
      z-index: 1;
      grid-column: 1;
      grid-row: 1 / -1;
      background: #090909;
      color: #f5f2ec;
      /* Mirror of the weave's margins: half facing Cento, full against the
         logo strip. */
      padding: 0 1rem 0 2rem;
    }

    #hilo-link {
      grid-column: 1;
      grid-row: 1;
      position: relative;
      min-height: 0;
      display: flex;
      flex-direction: column;
      color: inherit;
      text-decoration: none;
    }

    /* The art fills the pane. It is not stretched to do it: the board is
       always drawn at the card's own size and the whole canvas is scaled by a
       whole number, so what changes with the pane is how much setting sits
       around the board — never the size of a card. */
    #hilo-stage {
      position: relative;
      flex: 1;
      min-height: 0;
      /* Margin, not padding: the stage box is what the canvas measures itself
         against, so it should already be the drawable area. No vertical margin
         — the stage is the whole cell, so the two teasers touch. */
    }


    /* ── Music: a contained window with a screen in it ────────
       A box rather than covers loose on the page. Light, but not Apple's
       light — no gradients, no inset LCD, no pill tabs, no view bar. A flat
       bar, three controls, and a screen.

       The screen is the part that matters later: each song gets a video, and
       it expands through the same CUFO.expand the reader uses. It is sized
       16:9 off the bar's height, so it stays a small screen rather than
       growing into a player. */
    #music {
      grid-column: 2;
      grid-row: 1;
      min-height: 0;
      /* No height: 100% — a stretched grid item already fills its track, and
         forcing the height makes the margins add on top of it, so the window
         hung 27px past the row and over Cento's rule. */
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      overflow: hidden;
      margin: 0.85rem;
      border: 1px solid #8e8e8e;
      background: #f1f1ef;
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.5);
      font: 12px -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, sans-serif;
      color: #222;
    }

    #mu-bar {
      display: flex; align-items: center; gap: 0.7rem;
      padding: 0.5rem 0.6rem; height: 68px;
      border-bottom: 1px solid #c9c9c9;
    }
    /* Excludes the screen: `#mu-bar button` outranks `#mu-tv` on
       specificity, so a blanket reset here paints the screen light grey. */
    #mu-bar button:not(#mu-tv) {
      flex: none; border: 0; background: none; padding: 3px; cursor: pointer;
      color: #2a2a2a; display: grid; place-items: center;
    }
    #mu-bar button:not(#mu-tv):hover { color: #000; }
    #mu-bar button:not(#mu-tv):disabled { opacity: 0.25; cursor: default; }
    #mu-bar svg { display: block; }

    #mu-vol {
      flex: none; width: 58px; height: 2px; appearance: none;
      background: #bcbcba; border-radius: 1px; cursor: pointer;
    }
    #mu-vol::-webkit-slider-thumb {
      appearance: none; width: 9px; height: 9px; border-radius: 50%;
      background: #2a2a2a; border: 0;
    }
    #mu-vol::-moz-range-thumb { width: 9px; height: 9px; border-radius: 50%; background: #2a2a2a; border: 0; }

    #mu-now {
      flex: 1; min-width: 0; line-height: 1.25;
    }
    #mu-now .t { font-size: 10.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #mu-now .a { font-size: 9.5px; color: #6f6f6d; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* The screen. Dark and slightly curved in tone, with scan lines — off,
       but recognisably a thing that shows pictures. */
    #mu-tv {
      flex: none; height: 100%; aspect-ratio: 16 / 9; padding: 0; cursor: pointer;
      position: relative; overflow: hidden;
      background: #15171a;
      border: 1px solid #0c0d0f;
      box-shadow: inset 0 0 18px rgba(0, 0, 0, 0.8);
    }
    #mu-tv::after {
      content: ''; position: absolute; inset: 0; pointer-events: none;
      background: repeating-linear-gradient(
        to bottom, rgba(255,255,255,.035) 0 1px, transparent 1px 3px);
    }
    #mu-tv .dot {
      position: absolute; left: 50%; top: 50%; width: 4px; height: 4px;
      margin: -2px 0 0 -2px; border-radius: 50%;
      background: #4b5a4e; box-shadow: 0 0 6px #4b5a4e;
    }
    #mu-tv[data-live="true"] .dot { background: #7ad18c; box-shadow: 0 0 8px #7ad18c; }

    #mu-lib {
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: none;
      background: #fff;
    }
    #mu-lib::-webkit-scrollbar { width: 0; }

    #mu-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1.05rem 0.9rem;
      padding: 0.85rem 0.8rem 1rem;
    }

    .mu-tile {
      min-width: 0; display: block; width: 100%;
      padding: 0; border: 0; background: none; text-align: left;
      font: inherit; color: inherit; cursor: pointer;
    }
    .mu-tile img {
      width: 100%; aspect-ratio: 1; object-fit: cover; display: block;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25), 0 3px 8px rgba(0, 0, 0, 0.18);
      outline: 2px solid transparent; outline-offset: 2px;
      transition: outline-color 0.2s;
    }
    .mu-tile[aria-expanded="true"] img { outline-color: #4a8af4; }
    .mu-tile b {
      display: block; font-size: 0.64rem; font-weight: 600; margin-top: 0.4rem;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .mu-tile i {
      display: block; font-size: 0.64rem; font-style: normal; color: #808080;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* The screen again, filling the stage. Same object, bigger. */
    .tv-big {
      width: min(92%, 1100px); aspect-ratio: 16 / 9;
      position: relative; overflow: hidden;
      background: #15171a; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
    }
    .tv-big::after {
      content: ''; position: absolute; inset: 0; pointer-events: none;
      background: repeating-linear-gradient(
        to bottom, rgba(255,255,255,.03) 0 1px, transparent 1px 4px);
    }
    .tv-big .cap {
      position: absolute; left: 0; right: 0; bottom: 8%;
      text-align: center; color: #cfd6d0;
      font-family: 'Space Mono', monospace; font-size: 0.68rem;
      letter-spacing: 0.2em; text-transform: uppercase;
    }

    /* The panel breaks out of the grid's padding to the full width of the
       window, the way Canon's spans its own. */
    #mu-pan {
      grid-column: 1 / -1;
      margin: -0.45rem -0.8rem 0;
      position: relative;
    }
    #mu-pan[hidden] { display: none; }

    #mu-notch {
      position: absolute; top: 0; width: 0; height: 0; margin-left: -9px;
      border: 9px solid transparent; border-top: 0; border-bottom-color: var(--mu-bg);
      transition: left 0.3s cubic-bezier(0.2, 0.75, 0.25, 1), border-bottom-color 0.3s;
    }

    #mu-body {
      margin-top: 9px; position: relative; overflow: hidden;
      background: var(--mu-bg);
      transition: background-color 0.3s;
    }
    #mu-body::after {
      content: ''; position: absolute; inset: 0; pointer-events: none;
      box-shadow: inset 0 6px 8px -6px rgba(0, 0, 0, 0.45),
                  inset 0 -6px 8px -6px rgba(0, 0, 0, 0.45);
    }

    #mu-art {
      position: absolute; top: 0; right: 0; height: 100%; width: 48%;
      object-fit: cover; display: block;
    }
    #mu-fade {
      position: absolute; top: 0; right: 0; height: 100%; width: 48%;
      background: linear-gradient(90deg, var(--mu-bg) 0%, transparent 72%);
      transition: background 0.3s;
    }

    #mu-tx { position: relative; padding: 1rem 1rem 1rem 1.05rem; }
    #mu-title {
      font-size: 1rem; font-weight: 600; letter-spacing: -0.2px; color: var(--mu-p);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      transition: color 0.3s;
    }
    #mu-sub { font-size: 0.64rem; color: var(--mu-s); margin-top: 0.12rem; transition: color 0.3s; }

    #mu-tracks { list-style: none; margin-top: 0.75rem; max-width: 56%; }
    #mu-tracks button {
      display: flex; gap: 0.55rem; width: 100%;
      padding: 0.13rem 0.3rem; margin: 0 -0.3rem; border: 0; border-radius: 3px;
      background: none; font: inherit; font-size: 0.69rem; color: var(--mu-p);
      cursor: pointer; transition: color 0.3s;
    }
    #mu-tracks button:hover { background: color-mix(in srgb, var(--mu-p) 12%, transparent); }
    #mu-tracks button[aria-current="true"] { background: color-mix(in srgb, var(--mu-p) 18%, transparent); }
    #mu-tracks .n {
      width: 0.8rem; flex: none; text-align: right; color: var(--mu-d);
      font-variant-numeric: tabular-nums; transition: color 0.3s;
    }
    #mu-tracks .t { flex: 1; min-width: 0; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #mu-tracks .du { flex: none; color: var(--mu-d); font-variant-numeric: tabular-nums; transition: color 0.3s; }
    #mu-foot { font-size: 0.59rem; color: var(--mu-s); margin-top: 0.7rem; transition: color 0.3s; }

    #music :focus-visible { outline: 2px solid #4a8af4; outline-offset: 2px; }

    /* ── Literature, under the library ────────────────────────
       A shelf rather than a grid: two works stand in view and the rest are a
       scroll to the right, so the section announces that there are more
       without spending the height to prove it.

       The cards are paper-toned while everything around them is black, which
       is the whole trick — a card is a small piece of the page it opens into,
       so the expansion reads as the same object getting bigger. */
    #lit {
      grid-column: 2;
      grid-row: 2;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: #090909;
      overflow: hidden;
    }

    #lit-rail {
      flex: 1;
      min-height: 0;
      display: flex;
      gap: 0.85rem;
      padding: 0 0.85rem;
      align-items: stretch;
      overflow-x: auto;
      overscroll-behavior-x: contain;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
    }
    #lit-rail::-webkit-scrollbar { height: 0; }

    /* Two in view: the flex basis is half the rail less half the gap, so the
       second card lands exactly on the right edge and the third is visibly
       cut — the cut is the thing that says "scroll". */
    .work {
      /* Width is set, height fills the shelf. Three things cannot all hold
         at once here: exactly two covers in view, a true 2:3, and reaching
         both the rule above and the floor below. The ratio is the one that
         gives — a cover runs from Cento's line to the bottom of the window
         and comes out around 1:2, taller than a book and the better for it
         at this size. */
      flex: 0 0 calc(50% - 0.425rem);
      height: 100%;
      scroll-snap-align: start;
      display: block;
      padding: 0;
      border: 0;
      cursor: pointer;
      background: var(--eink-page);
      font: inherit;
      transition: box-shadow 0.25s ease;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.5), 0 3px 10px rgba(0, 0, 0, 0.4);
    }
    /* No lift: the cover meets the rule above and the floor below, so there
       is nowhere to lift to that would not be clipped. The shadow does it. */
    @media (hover: hover) {
      .work:hover { box-shadow: 0 0 0 1px rgba(43,43,43,.25), 0 6px 20px rgba(0,0,0,.55); }
    }

    /* The cover is one drawing with its type set into it rather than art
       with a caption bolted under it — which is most of the difference
       between a book cover and a thumbnail.

       Built from CSS and HTML rather than as one SVG, because the card's
       shape moves a long way with the window: measured between 0.37 and 0.56
       wide-to-tall. A single viewBox cannot survive that. `slice` crops the
       long edge, and on a tall window that is the left and right margins —
       at 1440x1200 it took 22 units off each side and cut the title off every
       cover. `meet` letterboxes instead, which breaks the full-bleed shapes.
       `none` stretches, which turns the discs into eggs.

       So: type is HTML, which cannot be cropped or distorted and scales with
       the card through container units. Shapes that care about their
       proportions are CSS boxes. SVG is left to do only what stretches
       harmlessly — a curve, and a field of horizontal rules. */
    .work { position: relative; overflow: hidden; container-type: size; }
    .work > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .work .ink { fill: var(--eink-ink); }
    .work .dim { fill: var(--eink-dim); }
    .work .out { fill: none; stroke: var(--eink-ink); }

    .cv-t, .cv-a { position: absolute; display: block; white-space: nowrap; }
    .cv-t {
      font-family: 'Josefin Sans', sans-serif;
      font-weight: 400;
      font-size: 13cqw;
      line-height: 1.08;
      letter-spacing: 0.03em;
      color: var(--eink-ink);
    }
    .cv-a {
      font-family: 'Space Mono', monospace;
      font-size: 3.1cqw;
      letter-spacing: 0.17em;
      text-transform: uppercase;
      color: var(--eink-dim);
    }

    /* 2fer — a solid disc and an outlined one, overlapping. Boxes rather
       than circles in the SVG so they stay round whatever the card does. */
    .cv-disc { position: absolute; width: 45%; aspect-ratio: 1; border-radius: 50%; }
    .cv-disc.solid { background: var(--eink-ink); left: 13%; }
    .cv-disc.ring { border: 1.5px solid var(--eink-ink); left: 42%; }

    /* Flips — opposite quadrants, and the title mirrored into the second. */
    .cv-q { position: absolute; width: 50%; height: 50%; background: var(--eink-ink); }
    .cv-q.tl { left: 0; top: 0; }
    .cv-q.br { left: 50%; top: 50%; }
    .cv-t.knock { color: var(--eink-page); }
    .cv-t.flip { transform: rotate(180deg); transform-origin: 50% 50%; }

    /* ── The expansion ────────────────────────────────────────
       Deliberately general. Literature is its first tenant, but Cento, Split
       Stack and Waver are all meant to open this way eventually, so nothing
       here knows what it is showing — `CUFO.expand.open(node)` takes any
       element and this frames it.

       It stops at the logo strip rather than covering the window, because the
       strip is the way back. That is the whole navigation model: one thing is
       always on screen and it always means "out". */
    #expand {
      position: fixed;
      top: 0; bottom: 0; right: 0;
      left: var(--logo-w);
      z-index: 200;
      background: var(--eink-bg);
      color: var(--eink-ink);
      /* The surround is the tenant's call: paper behind a book, near-black
         behind a screen. One attribute rather than a second stage. */
      transition: background-color 0.32s ease;
      /* A stage, not a scroller: what goes in sizes itself to the window and
         handles its own paging. Cento, Split Stack and Waver will all want a
         stage rather than a page that scrolls. */
      display: grid;
      /* The row must be pinned to the stage, and `1fr` is not enough: it means
         `minmax(auto, 1fr)`, and that automatic minimum is the item's
         min-content height. The reader's columns report ~1605px, so the row
         refuses to shrink below it, the book's `height: min(88%, …)` resolves
         against 1605 rather than the window, and it centres in a row twice
         the height of the screen and hangs off the bottom. `minmax(0, 1fr)`
         drops the minimum and the row is the stage. */
      grid-template-rows: minmax(0, 1fr);
      place-items: center;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.32s ease;
    }
    #expand[data-open="true"] { opacity: 1; pointer-events: auto; }
    #expand[data-tone="dark"] { background: #0b0c0d; }
    /* Focused by script to move the reading order, never by tab, so the ring
       on the container itself says nothing. Anything inside it keeps its own. */
    #expand:focus { outline: none; }

    /* While it is open the strip is a control, so it says so: full strength
       instead of the 85% it rests at, and a pointer. */
    body[data-expanded="true"] > header { cursor: pointer; }
    body[data-expanded="true"] #brand .ltr { color: rgba(245, 242, 236, 1); }

    /* ── The reader: two pages, then a flip ───────────────────
       CSS columns do the pagination. The flow is given exactly two columns
       and a fixed height with `column-fill: auto`, so text that does not fit
       keeps making columns off to the right instead of being balanced into
       the two. Those extra columns are clipped by .leaves, and turning a page
       is translating the flow left by one spread. No measuring of words, no
       splitting of paragraphs, and it re-paginates for free when the window
       changes. */
    .book {
      width: min(92%, 1040px);
      height: min(88%, 780px);
      display: flex;
      flex-direction: column;
      position: relative;
      background: var(--eink-page);
      padding: 3.2rem 3.4rem 1rem;
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.5) inset,
                  0 18px 40px rgba(0, 0, 0, 0.18);
    }

    /* The page's own grain. The site's .grain sits at z-index 50 and the
       stage is at 200, so the reader would otherwise be the only perfectly
       smooth surface on the site — which is the opposite of what an e-ink
       screen looks like up close. Very low: it should register as texture,
       never as noise. Delete this rule for a clean page. */
    .book::before {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.055;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 180px 180px;
    }

    .leaves { flex: 1; min-height: 0; position: relative; overflow: hidden; }

    .flow {
      height: 100%;
      column-count: 2;
      column-gap: 4.6rem;
      /* Sequential, not balanced — a balanced last spread would re-flow the
         whole book every time a page is turned. */
      column-fill: auto;
      transition: transform 0.26s cubic-bezier(0.3, 0.7, 0.3, 1);
    }

    /* The fold. Not a drawn line — a book's gutter is a loss of light, so it
       is a narrow shadow either side of the centre and nothing at all in the
       middle of it. */
    .spine {
      position: absolute;
      top: 0; bottom: 0; left: 50%;
      width: 4.6rem;
      transform: translateX(-50%);
      pointer-events: none;
      background: linear-gradient(90deg,
        transparent 0%, rgba(43, 43, 43, 0.09) 34%,
        rgba(43, 43, 43, 0.02) 50%,
        rgba(43, 43, 43, 0.09) 66%, transparent 100%);
    }

    .flow h1 {
      font-family: 'EB Garamond', serif;
      font-size: 1.85rem;
      font-weight: 400;
      line-height: 1.12;
    }
    .flow .meta {
      font-family: 'Space Mono', monospace;
      font-size: 0.56rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--eink-dim);
      margin-top: 0.7rem;
      padding-bottom: 1.3rem;
      border-bottom: 1px solid var(--eink-rule);
    }
    .flow p {
      font-family: 'EB Garamond', serif;
      font-size: 1.02rem;
      line-height: 1.62;
      margin-top: 1rem;
      /* A line stranded alone at a column break is the one thing that gives
         away that this is not a book. */
      orphans: 2;
      widows: 2;
    }
    .flow p:first-of-type { margin-top: 1.5rem; }
    .flow .end {
      font-family: 'Space Mono', monospace;
      font-size: 0.56rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--eink-dim);
      margin-top: 2rem;
      padding-top: 1.1rem;
      border-top: 1px solid var(--eink-rule);
    }

    .folio {
      flex: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.6rem;
      padding-top: 1rem;
      font-family: 'Space Mono', monospace;
      font-size: 0.56rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--eink-dim);
    }
    .folio button {
      border: 0;
      background: none;
      font: inherit;
      font-size: 0.95rem;
      line-height: 1;
      color: var(--eink-ink);
      cursor: pointer;
      padding: 0.2rem 0.5rem;
      opacity: 0.5;
      transition: opacity 0.2s;
    }
    .folio button:hover:not(:disabled) { opacity: 1; }
    .folio button:disabled { opacity: 0.16; cursor: default; }
    .folio .n { min-width: 7ch; text-align: center; }

    /* ── Waver teaser ── */
    /* The real page in an iframe rather than a copy of its field. waver's test
       pulls the script straight out of waver/index.html so it tests the page
       and not a copy that can drift — which means there is no module to import
       and reproducing the field here would be exactly the drift that test
       exists to prevent. Embedding it cannot fall out of step. */
    #waver-link {
      grid-column: 1 / -1;
      grid-row: 2;
      position: relative;
      min-height: 0;
      display: flex;
      flex-direction: column;
      color: inherit;
      text-decoration: none;
    }

    #waver-stage {
      position: relative;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    /* The same veil Cento wears, for the same reason: the teaser is a live
       thing, so the name only appears when it is being reached for.
       pointer-events: none is what lets the click pass through to the link
       underneath rather than landing on the veil. */
    #waver-overlay {
      position: absolute;
      inset: 0;
      z-index: 3;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(9, 9, 9, 0.88);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    /* Touch devices have no hover, so the veil never shows — the tap just
       follows the link through to Waver. */
    @media (hover: hover) {
      #waver-link:hover #waver-overlay { opacity: 1; }
    }

    #waver-logo {
      font-family: 'Josefin Sans', sans-serif;
      font-weight: 200;
      font-size: clamp(2.1rem, 3.2vw, 3.2rem);
      letter-spacing: 0.3em;
      text-indent: 0.3em; /* offset the trailing letter-space so it reads centred */
      text-transform: uppercase;
      white-space: nowrap;
    }

    /* Across the hue range the field itself travels — its base blue is
       hsl(202, 65%, 73%) and the wash carries ~75 degrees either side, so the
       word is coloured out of the thing it sits on, the way Cento's letters
       take the four voice hues. */
    #waver-logo span:nth-child(1) { color: hsl(165, 65%, 73%); }
    #waver-logo span:nth-child(2) { color: hsl(184, 65%, 73%); }
    #waver-logo span:nth-child(3) { color: hsl(202, 65%, 73%); }
    #waver-logo span:nth-child(4) { color: hsl(221, 65%, 73%); }
    #waver-logo span:nth-child(5) { color: hsl(240, 65%, 73%); }

    #waver-stage iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      /* Clicks belong to the link wrapping it, not to the embedded page. */
      pointer-events: none;
    }
    #hilo-canvas {
      /* Sized in JS to a whole multiple of the art, then centred — the few
         pixels of slack that leaves are the price of never scaling a pixel by
         a fraction. */
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: block;
      /* Integer scaling is the whole aesthetic — never let the browser
         smooth it back into mush. */
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }


    /* ── MOBILE: the two previews stack ── */
    @media (max-width: 768px) {
      /* The strip stays, just narrower — it is the only wordmark now. */
      :root { --logo-w: 38px; }
      main { grid-template-columns: 1fr; grid-template-rows: 2fr 1fr 230px; }
      /* Too little room to quarter: everything stacks in one column. Each of
         these needs an explicit row — a grid item asking for column 2 of a
         one-column grid gets an implicit column instead of an error, which is
         how the library spent a while sitting off the side of the phone. */
      #hilo-pane  { grid-column: 1; grid-row: 1; padding: 0 1.4rem;
                    grid-template-columns: 1fr; grid-template-rows: 1fr 1fr 1fr; }
      #hilo-link  { grid-column: 1; grid-row: 1; }
      #weave-pane { grid-column: 1; grid-row: 2; padding: 0; }
      #waver-link { grid-column: 1; grid-row: 3; }
      #music      { grid-column: 1; grid-row: 2; }
      #lit        { grid-column: 1; grid-row: 3; }
    }
  </style>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
</head>
<body>

  <header>
    <h1 id="brand" aria-label="closeupfarout">
      <!-- role/aria-label rather than relying on the <text> node: it names the
           heading the same way in every screen reader. -->
<span class="ltr" aria-hidden="true">C</span>
        <span class="ltr" aria-hidden="true">L</span>
        <span class="ltr" aria-hidden="true">O</span>
        <span class="ltr" aria-hidden="true">S</span>
        <span class="ltr" aria-hidden="true">E</span>
        <span class="ltr" aria-hidden="true">U</span>
        <span class="ltr" aria-hidden="true">P</span>
        <span class="ltr" aria-hidden="true">F</span>
        <span class="ltr" aria-hidden="true">A</span>
        <span class="ltr" aria-hidden="true">R</span>
        <span class="ltr" aria-hidden="true">O</span>
        <span class="ltr" aria-hidden="true">U</span>
        <span class="ltr" aria-hidden="true">T</span>
    </h1>
  </header>

  <main>
    <div id="music">
      <div id="mu-bar">
        <button type="button" id="mu-pp" aria-label="Play"></button>
        <button type="button" id="mu-skip" aria-label="Skip"></button>
        <input type="range" id="mu-vol" min="0" max="1" step="0.01" value="0.8" aria-label="Volume">
        <div id="mu-now"><div class="t"></div><div class="a"></div></div>
        <button type="button" id="mu-tv" aria-label="Expand the screen" data-live="false">
          <span class="dot"></span>
        </button>
      </div>

      <div id="mu-lib">
        <div id="mu-grid">
          <!-- Tiles and the panel are built by the script: the panel has to
               be moved between rows as a different album is opened, which
               is the one thing this layout cannot express in markup. -->
        </div>
      </div>

      <audio id="mu-audio" preload="none"></audio>
    </div>

    <section id="lit" aria-label="Writing">
      <div id="lit-rail"><!-- cards built by the script --></div>
    </section>

    <div id="hilo-pane">
      <a id="hilo-link" href="/split-stack/" aria-label="Open Split Stack">
        <div id="hilo-stage"><canvas id="hilo-canvas" aria-hidden="true"></canvas></div>
      </a>

      <div id="weave-pane">
        <a id="weave-link" href="/cento/" aria-label="Open Cento">
          <div id="weave" class="weave"></div>
          <div id="sources" class="sources"></div>
          <div id="cento-overlay" aria-hidden="true">
            <div id="cento-logo"><span>C</span><span>E</span><span>N</span><span>T</span><span>O</span></div>
          </div>
        </a>
      </div>

      <a id="waver-link" href="/waver/" aria-label="Open Waver">
        <div id="waver-stage">
          <iframe src="/waver/" title="" aria-hidden="true" tabindex="-1"
                  scrolling="no"></iframe>
        </div>
        <div id="waver-overlay" aria-hidden="true">
          <div id="waver-logo"><span>W</span><span>A</span><span>V</span><span>E</span><span>R</span></div>
        </div>
      </a>
    </div>

  </main>

  <!-- The expansion. Empty until something asks to be shown in it. -->
  <div id="expand" role="dialog" aria-modal="true" aria-label="Reading view"
       data-open="false" aria-hidden="true"></div>


  <div class="grain"></div>

  <!-- The game's own files, unmodified and shared with /split — the teaser
       runs the real rules engine rather than a copy of it, so the two can
       never drift. Deferred: nothing here should hold up the weave. -->
  <script defer src="/split-stack/pixel.js"></script>
  <script defer src="/split-stack/game.js"></script>
  <script defer src="/split-stack/scenes.js"></script>
  <script defer src="/split-stack/teaser.js"></script>
  <script>
  /* Deferred scripts have all run by the time DOMContentLoaded fires, so the
     renderer and the rules engine are both in hand here. */
  document.addEventListener('DOMContentLoaded', function () {
    var cv = document.getElementById('hilo-canvas');
    if (!cv || !window.HiLoTeaser) return;

    var t = window.HiLoTeaser.make(cv, { cols: 2, rows: 2 });
    if (!t) return;

    var link = document.getElementById('hilo-link');
    if (link && window.matchMedia && window.matchMedia('(hover: hover)').matches) {
      link.addEventListener('mouseenter', function () { t.setHover(true); });
      link.addEventListener('mouseleave', function () { t.setHover(false); });
    }

    /* The pane is a grid item with no intrinsic size, so the canvas would
       measure itself against a zero box if asked too early. */
    requestAnimationFrame(function () {
      requestAnimationFrame(function () { t.start(); });
    });
  });
  </script>

  <script>
  (function () {
    'use strict';

    // A small, read-only Cento: one fresh weave per page load. No corners, no
    // controls — just the aggregate text and who it came from. The full
    // instrument lives at /cento/.
    // Voice colours live in the CSS (`#weave-pane .v0`–`.v3`), not here.
    // Deliberately more than any screen shows. The pane clips rather than
    // scrolls, so this just has to guarantee the text runs past the bottom
    // edge on a tall display instead of stopping short with dead space.
    const SENTENCES = 44;

    // Only a few dozen sentences are needed here, so ask the API for a small
    // slice of each book rather than the whole text.
    const PARAGRAPH_WINDOW = 12;

    // How long a set of four books stays up before being replaced.
    const SWAP_INTERVAL = 30000;

    // How long one set melts into the next. Read from the stylesheet, where the
    // matching transition lives, so the two cannot drift apart. Note the CSS is
    // in seconds and this is milliseconds.
    const MELT = (parseFloat(
      getComputedStyle(document.documentElement).getPropertyValue('--melt')
    ) || 3) * 1000;

    // ── Sentence splitting (mirrors /cento) ──────────────────
    // Kept in step with Cento's own splitter \u2014 heavily semicoloned sentences
    // are usually catalogues that swamp the weave.
    const MAX_SEMICOLONS = 3;

    // Teaser only — Cento itself keeps its long sentences. A single sprawling
    // one can fill most of this small pane, which reads as one dense block
    // rather than as four voices trading lines. The floor is Cento's own.
    const MIN_WORDS = 3;
    const MAX_WORDS = 50;

    const ABBR_PERIOD = '\uE000';
    const ABBR_WORDS = /\b(Mr|Mrs|Ms|Mmes|Messrs|Mme|Mlle|Dr|Drs|Prof|Profs|Sr|Jr|Sra|Srta|St|Ste|Ss|Rev|Revd|Fr|Bro|Br|Msgr|Mgr|Ven|Bp|Abp|Card|Rt|Hon|Gen|Col|Lt|Lieut|Maj|Capt|Cpl|Sgt|Cmdr|Cdr|Cmdre|Adm|Brig|Pvt|Pfc|Ens|Sfc|Gov|Sen|Rep|Pres|Supt|Det|Insp|Amb|Mt|Ft|No|Nos|Vol|Vols|pp|Ch|Fig|Figs|Ed|Eds|Inc|Ltd|Co|Corp|Bros|Ave|Rd|Blvd|etc|vs|viz|cf|al|ibid|op|esp|ca|fl|Jan|Feb|Mar|Apr|Jun|Jul|Aug|Sep|Sept|Oct|Nov|Dec)\./g;

    function protectAbbrev(text) {
      return text
        .replace(/\b(?:[A-Za-z]\.){2,}/g, m => m.replace(/\./g, ABBR_PERIOD))
        .replace(/\b[A-Za-z]\.(?:\s+[A-Za-z]\.)+/g, m => m.replace(/\./g, ABBR_PERIOD))
        .replace(/\b[IVXLCDM]{2,}\./g, m => m.replace(/\./g, ABBR_PERIOD))
        .replace(ABBR_WORDS, (m, w) => w + ABBR_PERIOD);
    }

    function splitSentences(text) {
      const re = /[\s\S]+?[.!?…]+["”'’)\]]*(?=\s+["“'‘(]*[A-Z0-9]|\s*$)|[\s\S]+$/g;
      const matches = protectAbbrev(text).match(re);
      if (!matches) return [];
      return matches
        .map(s => s.split(ABBR_PERIOD).join('.').trim())
        .filter(s => {
          const words = s.split(/\s+/).length;
          return words >= MIN_WORDS && words <= MAX_WORDS &&
            (s.match(/;/g) || []).length <= MAX_SEMICOLONS &&
            !/\S+@\S+\.\S+/.test(s) &&
            !/^[IVXLCDM]+\.?\s*—/.test(s);
        });
    }

    function esc(str) {
      return String(str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // ── Weave: round-robin one sentence per voice ────────────
    function weave(voices) {
      const live = voices.filter(v => v.sentences.length);
      if (!live.length) return '';
      const perVoice = Math.ceil(SENTENCES / live.length);
      const rows = live.map(v => v.sentences.slice(0, perVoice));
      const maxLen = Math.max(...rows.map(r => r.length));

      const spans = [];
      for (let i = 0; i < maxLen && spans.length < SENTENCES; i++) {
        for (let j = 0; j < live.length && spans.length < SENTENCES; j++) {
          if (i < rows[j].length) {
            spans.push(
              '<span class="v' + live[j].vi + '">' + esc(rows[j][i]) + '</span>'
            );
          }
        }
      }
      return '<p>' + spans.join(' ') + '</p>';
    }

    // `overflow: hidden` clips at the padding box, so the bottom line is
    // normally sliced through. Trim the pane to a whole number of lines instead
    // and the cut lands cleanly between them.
    //
    // The line box is derived from font-size, not line-height: getComputedStyle
    // is entitled to hand back the raw number (1.85) rather than a pixel length,
    // and flooring against 1.85 quietly does nothing. font-size is always px.
    function snapToWholeLines() {
      const el = document.getElementById('weave');
      const pane = document.getElementById('weave-pane');
      const sources = document.getElementById('sources');
      const cs = getComputedStyle(el);

      const ratio = parseFloat(cs.getPropertyValue('--line-ratio')) || 1.85;
      const line = parseFloat(cs.fontSize) * ratio;
      if (!line) return;

      // Two things this has to get right:
      //
      // Measure the room the pane offers, never the weave's own height — that
      // is the value being set, so reading it back makes each run depend on
      // the last.
      //
      // And the visible band is everything below padding-top, bottom padding
      // included: the clip is at the padding box, so text runs on through
      // padding-bottom and shows there. Sizing the content box instead leaves
      // that padding free to reveal a slice of one more line.
      const padTop = parseFloat(cs.paddingTop);
      const band = pane.clientHeight - sources.offsetHeight - padTop;
      if (band < line) return;

      el.style.maxHeight = (Math.floor(band / line) * line + padTop) + 'px';
    }

    // The pane settles late: the webfont swap resizes the attributions beneath
    // it, and any window resize moves it again. Watching the pane rather than
    // the weave means the trim can't retrigger this.
    let snapTimer = null;
    function scheduleSnap() {
      clearTimeout(snapTimer);
      snapTimer = setTimeout(snapToWholeLines, 60);
    }
    new ResizeObserver(scheduleSnap).observe(document.getElementById('weave-pane'));
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(scheduleSnap);

    function renderSources(voices) {
      document.getElementById('sources').innerHTML = voices
        .filter(v => v.sentences.length && v.title)
        .map(v =>
          '<span class="v' + v.vi + '" title="' +
          esc(v.title) + (v.author ? ' — ' + esc(v.author) : '') + '">' +
          esc(v.title) + '</span>'
        )
        .join('');
    }

    async function fetchWeave() {
      const res = await fetch('/api/instrument-01?window=' + PARAGRAPH_WINDOW);
      if (!res.ok) throw new Error('API ' + res.status);
      const data = await res.json();

      const voices = (data.voices || []).map((v, i) => ({
        id: v.id,
        title: v.title,
        author: v.author,
        vi: i,
        sentences: splitSentences((v.paragraphs || []).join(' ')),
      }));

      const html = weave(voices);
      if (!html) throw new Error('no text');
      return { voices, html };
    }

    function paint(next) {
      document.getElementById('weave').innerHTML = next.html;
      renderSources(next.voices);
      snapToWholeLines();

      // Carry the four books through to Cento, so clicking the teaser opens on
      // the weave you were reading rather than a fresh draw. Re-pointed on each
      // swap, so the link always matches what is on screen.
      const ids = next.voices.map(v => v.id).filter(Number.isFinite);
      const link = document.getElementById('weave-link');
      if (link) link.href = ids.length ? '/cento/?v=' + ids.join(',') : '/cento/';
    }

    // Draw four new books and cross into them. The fetch happens before the
    // fade, so a failed request costs nothing visible — the pane never empties
    // to reveal an error, it simply keeps the voices it already has.
    let swapping = false;
    async function swapWeave() {
      if (swapping) return;
      swapping = true;

      const link = document.getElementById('weave-link');
      const weaveEl = document.getElementById('weave');
      const sourcesEl = document.getElementById('sources');

      try {
        const next = await fetchWeave();

        // Photograph the outgoing set and hang it over the pane. The clones
        // drop their ids — the styling they need comes from .weave/.sources —
        // and the weave clone keeps its trimmed height so it trails the live
        // pane exactly rather than reflowing as it dissolves.
        const ghost = document.createElement('div');
        ghost.id = 'ghost';
        ghost.setAttribute('aria-hidden', 'true');
        for (const el of [weaveEl, sourcesEl]) {
          const copy = el.cloneNode(true);
          copy.removeAttribute('id');
          copy.style.maxHeight = el.style.maxHeight;
          ghost.appendChild(copy);
        }
        link.appendChild(ghost);

        // New text goes in underneath at zero opacity, then both are released
        // in the same frame so they cross rather than queue.
        weaveEl.style.transition = 'none';
        sourcesEl.style.transition = 'none';
        weaveEl.style.opacity = '0';
        sourcesEl.style.opacity = '0';
        paint(next);

        requestAnimationFrame(() => requestAnimationFrame(() => {
          weaveEl.style.transition = '';
          sourcesEl.style.transition = '';
          weaveEl.style.opacity = '1';
          sourcesEl.style.opacity = '1';
          ghost.style.opacity = '0';
        }));

        await new Promise(r => setTimeout(r, MELT + 100));
      } catch (err) {
        console.error('Cento weave refresh:', err);
      } finally {
        // Whatever happened, leave nothing hanging over the pane and no inline
        // opacity behind — a stranded ghost would sit there for good.
        const stale = link.querySelector('#ghost');
        if (stale) stale.remove();
        for (const el of [weaveEl, sourcesEl]) {
          el.style.transition = '';
          el.style.opacity = '';
        }
        swapping = false;
      }
    }

    async function load() {
      const weaveEl = document.getElementById('weave');
      try {
        paint(await fetchWeave());
      } catch (err) {
        weaveEl.innerHTML = '<p class="weave-msg">voices unavailable</p>';
        console.error('Cento weave:', err);
        return;
      }

      // Only draw new books while someone can actually see them. A backgrounded
      // tab left open would otherwise fetch four books a minute forever, and
      // every one of those reaches R2 — nothing between here and the bucket
      // caches. Swapping resumes on return.
      let swapTimer = null;
      const startSwapping = () => {
        if (!swapTimer) swapTimer = setInterval(swapWeave, SWAP_INTERVAL);
      };
      const stopSwapping = () => {
        clearInterval(swapTimer);
        swapTimer = null;
      };

      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'hidden') stopSwapping();
        else startSwapping();
      });

      if (document.visibilityState !== 'hidden') startSwapping();
    }

    load();

  })();
  </script>

  <script>
  (function () {
    'use strict';

    // ── Music, upper right: a mini Canon ─────────────────────
    // The covers are real. Everything else — album names apart from
    // Desaparezco, track names, durations, years, genres — is still
    // placeholder, and this array is the only place to edit it. Once there
    // are real files, `dur` can come off the audio itself instead (an
    // <audio> reports duration on loadedmetadata) and be dropped from here.
    const CATALOG = [
      { title: 'Desaparezco', year: 2026, genre: 'Electronic', cover: '/images/audio/cover-01.webp',
        tracks: [['First Light','4:12'], ['Undertow','5:03'], ['Slow Hand','3:48'], ['Ferrous','6:21']] },
      // straw hat on rippled sand
      { title: 'Album Two', year: 2025, genre: 'Ambient', cover: '/images/audio/cover-02.webp',
        tracks: [['Orange Line','5:30'], ['Sixteen Hours','7:02'], ['Parallax','4:19']] },
      // sleeping duckling
      { title: 'Album Three', year: 2024, genre: 'Folk', cover: '/images/audio/cover-03.webp',
        tracks: [['Greenhouse','3:21'], ['Nine Volt','4:47'], ['Hollow Way','5:12'], ['Sightlines','3:58'], ['Drift','6:40']] },
      // inverted plums, pink and blue
      { title: 'Album Four', year: 2023, genre: 'Rock', cover: '/images/audio/cover-04.webp',
        tracks: [['Paper Weather','4:02'], ['Long Exposure','8:14'], ['Tallow','3:33']] },
      // purple bleachers at night
      { title: 'Album Five', year: 2022, genre: 'Jazz', cover: '/images/audio/cover-05.webp',
        tracks: [['Deep Field','6:55'], ['Cold Open','3:12'], ['Vantage','5:41'], ['Nightwatch','7:28']] },
    ];
    const ARTIST = 'closeupfarout';
    const COLS = 2;

    const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    const srcFor = (al, i) => '/audio/tracks/' + slug(al.title) + '-' + String(i + 1).padStart(2, '0') + '.mp3';

    /* ── ColorArt ──────────────────────────────────────────────
       Lifted from the Canon mockup unchanged, which took it from Panic's
       ColorArt by way of iTunes 11. Background is the commonest colour down
       the cover's left edge — the edge that fades into the panel — skipping
       black and white if a real colour is nearly as common. Primary,
       secondary and detail are the commonest colours in the whole cover
       that contrast with that background and are distinct from each other.
       If it changes in Canon it should change here. */
    const lum = c => 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
    const isDark = c => lum(c) < 0.5;
    const isBW = c => (c[0] > .91 && c[1] > .91 && c[2] > .91) || (c[0] < .09 && c[1] < .09 && c[2] < .09);
    const contrasts = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x, y) + .05) / (Math.min(x, y) + .05) > 1.6; };
    const isGrey = c => Math.abs(c[0] - c[1]) < .03 && Math.abs(c[0] - c[2]) < .03;
    function distinct(a, b) {
      if (Math.abs(a[0] - b[0]) > .25 || Math.abs(a[1] - b[1]) > .25 || Math.abs(a[2] - b[2]) > .25)
        return !(isGrey(a) && isGrey(b));            // two greys never count as distinct
      return false;
    }
    function minSaturation(c, min) {
      const mx = Math.max(...c), mn = Math.min(...c), s = mx ? (mx - mn) / mx : 0;
      // Panic boosts every colour to 15% saturation; true greys would pick up a red cast, so leave them alone.
      if (s >= min || s < .04) return c;
      return c.map(v => mx - (mx - v) * (min / s));
    }
    function analyze(img) {
      const W = Math.min(160, img.naturalWidth), H = Math.round(img.naturalHeight * W / img.naturalWidth);
      const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
      const cx = cv.getContext('2d', { willReadFrequently: true }); cx.drawImage(img, 0, 0, W, H);
      const d = cx.getImageData(0, 0, W, H).data;
      const edge = new Map(), all = new Map();
      const add = (m, r, g, b) => {
        const k = (r >> 3) << 10 | (g >> 3) << 5 | (b >> 3);
        let e = m.get(k); if (!e) m.set(k, e = { n: 0, r: 0, g: 0, b: 0 });
        e.n++; e.r += r; e.g += g; e.b += b;
      };
      for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
        const i = (y * W + x) * 4, r = d[i], g = d[i + 1], b = d[i + 2];
        add(all, r, g, b); if (x < 2) add(edge, r, g, b);
      }
      const toList = m => [...m.values()]
        .map(e => ({ c: [e.r / e.n / 255, e.g / e.n / 255, e.b / e.n / 255], n: e.n }))
        .sort((a, b) => b.n - a.n);

      const edges = toList(edge);
      let bg = edges[0];
      if (isBW(bg.c)) for (const e of edges.slice(1)) { if (e.n / bg.n <= .3) break; if (!isBW(e.c)) { bg = e; break; } }
      const B = bg.c, darkBg = isDark(B);

      const cands = toList(all).map(e => ({ c: minSaturation(e.c, .15), n: e.n })).filter(e => isDark(e.c) !== darkBg);
      let pr, se, dt;
      for (const { c } of cands) {
        if (!contrasts(c, B)) continue;
        if (!pr) pr = c;
        else if (!se) { if (distinct(c, pr)) se = c; }
        else if (!dt) { if (distinct(c, pr) && distinct(c, se)) { dt = c; break; } }
      }
      const fb = darkBg ? [1, 1, 1] : [0, 0, 0];
      const css = c => 'rgb(' + c.map(v => Math.round(v * 255)).join(',') + ')';
      return { bg: css(B), p: css(pr || fb), s: css(se || fb), d: css(dt || se || fb) };
    }

    // Black is what the page shows while a cover is still loading, and what
    // it keeps if one never does — the panel stays legible either way.
    const FALLBACK = { bg: '#141414', p: '#f5f2ec', s: '#9a9a9a', d: '#7d7d7d' };

    // ── the page ──
    const el = id => document.getElementById(id);
    const grid = el('mu-grid'), audio = el('mu-audio');
    if (!grid || !audio) return;

    const secs = d => { const [m, x] = d.split(':').map(Number); return m * 60 + x; };
    const mins = al => Math.round(al.tracks.reduce((n, t) => n + secs(t[1]), 0) / 60);

    // One flat running order behind both views, so next and previous carry on
    // past the end of a record the way a library does.
    const FLAT = [];
    CATALOG.forEach(function (al, ai) {
      al.tracks.forEach(function (t, ti) {
        FLAT.push({ ai: ai, ti: ti, title: t[0], dur: t[1], album: al.title });
      });
    });

    let open = -1;      // album whose panel is showing, -1 for none
    let cur = -1;       // index into FLAT, -1 for nothing loaded
    let loaded = -1;

    // ── the bar: play, skip, volume, screen ──
    const ICON = {
      play: '<path d="M5.5 3l8 5-8 5z"/>',
      pause: '<path d="M5 3h3v10H5zM10 3h3v10h-3z"/>',
      skip: '<path d="M11 3h2v10h-2z"/><path d="M4 3l6 5-6 5z"/>',
    };
    const svg = d => '<svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">' + d + '</svg>';
    el('mu-skip').innerHTML = svg(ICON.skip);

    function setPP() {
      const b = el('mu-pp'), playing = cur >= 0 && !audio.paused;
      b.innerHTML = svg(playing ? ICON.pause : ICON.play);
      b.setAttribute('aria-label', playing ? 'Pause' : 'Play');
      el('mu-tv').dataset.live = playing ? 'true' : 'false';
    }

    function now() {
      const box = el('mu-now');
      box.querySelector('.t').textContent = cur < 0 ? '' : FLAT[cur].title;
      box.querySelector('.a').textContent = cur < 0 ? '' : ARTIST + ' \u2014 ' + FLAT[cur].album;
    }

    audio.volume = 0.8;
    el('mu-vol').addEventListener('input', function (e) { audio.volume = +e.target.value; });

    /* The screen opens onto the stage. There is nothing to show in it yet —
       each song gets a video eventually — so for now it expands as itself,
       which is enough to settle the route those videos will take. */
    el('mu-tv').addEventListener('click', function () {
      const big = document.createElement('div');
      big.className = 'tv-big';
      const cap = document.createElement('div');
      cap.className = 'cap';
      cap.textContent = cur < 0 ? 'no signal' : FLAT[cur].title;
      big.appendChild(cap);
      if (window.CUFO && window.CUFO.expand) {
        window.CUFO.expand.open(big, cur < 0 ? 'Screen' : FLAT[cur].title, el('mu-tv'), 'dark');
      }
    });

    // audio.src is left alone until something is actually played, so a
    // catalogue whose files do not exist yet does not boot into an error.
    function play(i) {
      if (i < 0 || i >= FLAT.length) return;
      if (i === cur) { audio.paused ? audio.play().catch(function () {}) : audio.pause(); return; }
      cur = i;
      if (loaded !== i) { audio.src = srcFor(CATALOG[FLAT[i].ai], FLAT[i].ti); loaded = i; }
      audio.play().catch(function () { paintPlaying(); });
      paintPlaying();
    }
    el('mu-pp').addEventListener('click', function () { play(cur < 0 ? 0 : cur); });
    // Skip wraps rather than stopping dead at the end of the catalogue.
    el('mu-skip').addEventListener('click', function () {
      play(cur < 0 ? 0 : (cur + 1) % FLAT.length);
    });

    function paintPlaying() { setPP(); now(); mark(); }

    // ── the album grid ──
    const tiles = CATALOG.map(function (al, i) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'mu-tile';
      b.setAttribute('aria-expanded', 'false');
      const im = document.createElement('img');
      im.src = al.cover; im.alt = al.title + ' cover'; im.draggable = false;
      const t = document.createElement('b'); t.textContent = al.title;
      const a = document.createElement('i'); a.textContent = ARTIST;
      b.append(im, t, a);
      b.addEventListener('click', function () { toggle(i); });
      grid.appendChild(b);

      // One decode per cover, kept on the album. A second <img> rather than
      // reusing the tile's: the tile may not have finished loading, and
      // analyze() needs naturalWidth.
      al.colors = null;
      const probe = new Image();
      probe.onload = function () {
        try { al.colors = analyze(probe); } catch (err) { al.colors = FALLBACK; }
        if (open === i) paint(al);
      };
      probe.onerror = function () { al.colors = FALLBACK; if (open === i) paint(al); };
      probe.src = al.cover;
      return b;
    });

    const pan = document.createElement('div');
    pan.id = 'mu-pan';
    pan.hidden = true;
    pan.innerHTML =
      '<div id="mu-notch"></div>' +
      '<div id="mu-body">' +
        '<img id="mu-art" alt="">' +
        '<div id="mu-fade"></div>' +
        '<div id="mu-tx">' +
          '<div id="mu-title"></div>' +
          '<div id="mu-sub"></div>' +
          '<ul id="mu-tracks"></ul>' +
          '<div id="mu-foot"></div>' +
        '</div>' +
      '</div>';
    grid.appendChild(pan);

    function paint(al) {
      const c = al.colors || FALLBACK;
      pan.style.setProperty('--mu-bg', c.bg);
      pan.style.setProperty('--mu-p', c.p);
      pan.style.setProperty('--mu-s', c.s);
      pan.style.setProperty('--mu-d', c.d);
    }

    // Canon measures rather than computes: the notch has to land on the
    // tile's centre whatever the column widths round to.
    function placeNotch(i) {
      const t = tiles[i].getBoundingClientRect(), p = pan.getBoundingClientRect();
      el('mu-notch').style.left = (t.left + t.width / 2 - p.left) + 'px';
    }

    function openAlbum(i) {
      const al = CATALOG[i];
      // The panel belongs after the last tile of the row the album sits in,
      // so the row stays whole and the drawer opens beneath it.
      const end = Math.min(Math.floor(i / COLS) * COLS + COLS - 1, CATALOG.length - 1);
      tiles[end].after(pan);

      paint(al);
      el('mu-art').src = al.cover;
      el('mu-art').alt = al.title + ' cover';
      el('mu-title').textContent = al.title;
      el('mu-sub').textContent = ARTIST + ' \u00b7 ' + al.year;
      el('mu-foot').textContent =
        al.tracks.length + ' songs, ' + mins(al) + ' minutes \u00b7 ' + al.genre;

      const list = el('mu-tracks');
      list.innerHTML = '';
      al.tracks.forEach(function (t, n) {
        const b = document.createElement('button');
        b.type = 'button';
        b.innerHTML = '<span class="n"></span><span class="t"></span><span class="du"></span>';
        b.querySelector('.n').textContent = n + 1;
        b.querySelector('.t').textContent = t[0];
        b.querySelector('.du').textContent = t[1];
        b.addEventListener('click', function () {
          play(FLAT.findIndex(function (f) { return f.ai === i && f.ti === n; }));
        });
        const li = document.createElement('li');
        li.appendChild(b);
        list.appendChild(li);
      });

      pan.hidden = false;
      open = i;
      tiles.forEach(function (t, n) { t.setAttribute('aria-expanded', n === i ? 'true' : 'false'); });
      mark();
      placeNotch(i);
    }

    function closeAlbum() {
      pan.hidden = true;
      open = -1;
      tiles.forEach(function (t) { t.setAttribute('aria-expanded', 'false'); });
    }
    function toggle(i) { i === open ? closeAlbum() : openAlbum(i); }

    function mark() {
      if (open < 0) return;
      const playing = cur >= 0 && !audio.paused && FLAT[cur].ai === open ? FLAT[cur].ti : -1;
      el('mu-tracks').querySelectorAll('button').forEach(function (b, n) {
        b.setAttribute('aria-current', n === playing ? 'true' : 'false');
      });
    }

    audio.addEventListener('play', paintPlaying);
    audio.addEventListener('pause', paintPlaying);
    audio.addEventListener('ended', function () {
      if (cur + 1 < FLAT.length) play(cur + 1); else { cur = -1; paintPlaying(); }
    });
    audio.addEventListener('error', function () {
      // Say so rather than sitting on a dead control. This fires exactly when
      // a track is missing, which is every track until the audio lands — so
      // it has to point at something that exists.
      if (cur >= 0) el('mu-now').querySelector('.a').textContent = 'unavailable';
      setPP();
    });

    // The columns are fluid, so the notch has to be put back after a resize.
    let rt = null;
    new ResizeObserver(function () {
      clearTimeout(rt);
      rt = setTimeout(function () { if (open >= 0) placeNotch(open); }, 80);
    }).observe(grid);

    paintPlaying();
    // Nothing open to begin with: the window is first of all a grid of
    // covers, newest first, and opening one is the visitor's move.
  })();
  </script>

  <script>
  (function () {
    'use strict';

    /* ── The expansion ─────────────────────────────────────────
       A general mechanism, not a literature feature. It takes any element and
       shows it full-bleed from the logo strip to the right edge of the window,
       and the strip — the one thing it never covers — is how you get out.
       Cento, Split Stack and Waver are meant to open this way too, so nothing
       below knows or asks what it is framing. */
    const host = document.getElementById('expand');
    const header = document.querySelector('body > header');
    if (!host || !header) return;

    let opener = null;   // what to hand focus back to on the way out

    function open(node, label, tone) {
      host.dataset.tone = tone || 'paper';
      host.replaceChildren(node);
      host.scrollTop = 0;
      if (label) host.setAttribute('aria-label', label);
      host.dataset.open = 'true';
      host.removeAttribute('aria-hidden');
      document.body.dataset.expanded = 'true';
      // The strip stops being decoration and becomes the way back, so it has
      // to say that to a screen reader as well as to a mouse.
      header.setAttribute('role', 'button');
      header.setAttribute('tabindex', '0');
      header.setAttribute('aria-label', 'Back to the front page');
      host.focus({ preventScroll: true });
    }

    function close() {
      if (host.dataset.open !== 'true') return;
      host.dataset.open = 'false';
      host.setAttribute('aria-hidden', 'true');
      delete document.body.dataset.expanded;
      header.removeAttribute('role');
      header.removeAttribute('tabindex');
      header.setAttribute('aria-label', 'closeupfarout');
      if (opener) { opener.focus(); opener = null; }
      // Let the fade finish before emptying it, or the content vanishes
      // instantly and only the paper fades.
      setTimeout(function () { if (host.dataset.open !== 'true') host.replaceChildren(); }, 360);
    }

    host.tabIndex = -1;
    header.addEventListener('click', function () { close(); });
    header.addEventListener('keydown', function (e) {
      if (document.body.dataset.expanded && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); close(); }
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') close();
      // The stage holds focus, so arrows have to be forwarded to whatever is
      // standing on it rather than handled here — this knows nothing about
      // books, only that its tenant may care about keys.
      else if (host.dataset.open === 'true' && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
        const kid = host.firstElementChild;
        if (kid) kid.dispatchEvent(new KeyboardEvent('keydown', { key: e.key, bubbles: false }));
      }
    });

    window.CUFO = window.CUFO || {};
    window.CUFO.expand = {
      open: function (node, label, from, tone) { opener = from || null; open(node, label, tone); },
      close: close,
      get isOpen() { return host.dataset.open === 'true'; },
    };

    /* ── Literature ────────────────────────────────────────────
       Titles are the Issue 01 list. The prose is invented placeholder, long
       enough that the spread actually paginates and the page turns can be
       judged — a three-paragraph stub fits two columns and never flips.
       Replace `text` as the pieces are written; nothing else reads anything
       about a work. */
    /* Dust: rules whose spacing closes as they fall, so the field reads as
       something coming to rest rather than as a gradient. Generated because
       thirty-four hand-typed <rect>s is not a drawing, it is a transcription. */
    const DUST = (function () {
      let out = '', y = 170;
      // 33 rules, the gap closing from 13 to 1, landing the last at ~401 so
      // the field runs off the bottom edge. Evenly spaced it read as a
      // texture rather than as anything coming to rest.
      for (let i = 0; i < 33; i++) {
        out += '<rect class="dim" x="0" y="' + y.toFixed(1) + '" width="200" height="1"/>';
        y += 13 - i * 0.375;
      }
      return out;
    })();

    const WORKS = [
      { title: '2fer', author: 'N. Auerbach',
        art: '<span class="cv-disc solid" style="top:40%"></span>' +
          '<span class="cv-disc ring" style="top:40%"></span>' +
          '<span class="cv-t" style="left:7%;top:4.5%">2FER</span>' +
          '<span class="cv-a" style="left:7%;bottom:5%">N. Auerbach</span>',
        text: [
        'Two things can be true, which is the sort of sentence that sounds like wisdom and functions like an escape hatch.',
        'I have been thinking about the places where the two things are not merely both true but are true because of one another, which is harder, and rarer, and worth the trouble of saying slowly.',
        'The phrase arrives in arguments as a kind of truce, and like most truces it is mostly about ending the fighting rather than settling anything.',
        'What I mean is narrower and more demanding. I mean the cases where the second thing is true because the first one is, and where saying only one of them is not a simplification but an error.',
        'A person can be generous and also keeping score. Not generous despite the scorekeeping, and not secretly ungenerous — generous, and keeping score, and the one running on the other.',
        'We do not have good grammar for this. The grammar we have is concessive: although, despite, nevertheless. Every one of those words quietly ranks the two halves.',
        'The honest construction would be flatter. And. Simply and. But “and” reads as a list, and a list implies the items are independent, which is the thing I am trying not to say.',
        'So the sentence gets longer. It has to. Anything shorter has already taken a side.'] },
      { title: 'Flips', author: 'R. Okonkwo',
        art: '<span class="cv-q tl"></span><span class="cv-q br"></span>' +
          '<span class="cv-t knock" style="left:6%;top:3.5%;font-size:11cqw">FLIPS</span>' +
          '<span class="cv-t knock flip" style="right:6%;bottom:3.5%;font-size:11cqw">FLIPS</span>' +
          '<span class="cv-a" style="left:6%;top:52%;color:var(--eink-ink)">R. Okonkwo</span>',
        text: [
        'The board came up and over and landed wrong, and he rode it out anyway, which was the whole of his talent as far as anyone could tell.',
        'He had been at it since the lot was poured. The security guard had stopped coming out around the second summer.',
        'The lot had been a Caldor and before that a drive-in, and the concrete was poured in one continuous slab that had cracked exactly twice in forty years.',
        'Those two cracks were the whole topography of the place. Everyone who skated there knew them the way you know the stairs in a house you grew up in.',
        'He had been at it since the lot was poured, which was not true, but it was the kind of thing people said about him and he had stopped correcting it.',
        'The trick he was working on did not have a name yet, or it had four names depending on who you asked, which amounts to the same thing.',
        'It went up and over and came down wrong, and he rode it out, and the board shot away across the slab and hit the fence with a sound like a dropped plate.',
        'He went and got it. He came back. That was the whole afternoon, and the one before it, and the one after.'] },
      { title: 'Over the Hill', author: 'M. Delacroix',
        art: '<svg viewBox="0 0 200 420" preserveAspectRatio="none" aria-hidden="true">' +
            '<path class="out" d="M-6 330 Q 70 330 110 238 T 206 128" stroke-width="22"/>' +
          '</svg>' +
          '<span class="cv-t" style="left:6%;top:3.5%;font-size:9cqw">HILL</span>' +
          '<span class="cv-a" style="right:6%;top:5%">M. Delacroix</span>' +
          '<span class="cv-t" style="left:6%;bottom:4%;font-size:9cqw">OVER THE</span>',
        text: [
        'Nobody tells you that the hill is not a hill. It is a long shallow rise, and you are most of the way up it before the word occurs to you at all.',
        'The metaphor fails in a specific and interesting way, which is that hills have a summit and you know when you are on it.',
        'What actually happens is that the grade eases. You notice you are not working as hard. You take this for a sign of fitness for about a year.',
        'Then one morning you find yourself describing something as the way it used to be done, in a tone of voice you have heard before, from someone you did not entirely respect at the time.',
        'There is no summit. There is a long shallow rise, and a point somewhere on it where you turn around to check the view and discover it is behind you.'] },
      { title: 'Dust Settled', author: 'J. Varga',
        art: '<svg viewBox="0 0 200 420" preserveAspectRatio="none" aria-hidden="true">' +
            DUST +
          '</svg>' +
          '<span class="cv-t" style="left:6%;top:4%;font-size:10cqw">DUST<br>SETTLED</span>' +
          '<span class="cv-a" style="left:6%;top:30%;color:var(--eink-ink)">J. Varga</span>',
        text: [
        'Afterward the house was very clean, which was the part no one had warned her about.',
        'She found the receipts in a drawer he had never used, held with a clip, in order, going back years.',
        'The cleaners had come on the Tuesday and done the whole house in six hours, which was less time than it had taken him to die.',
        'She had not asked them to do the study. They had done the study. Everything was in boxes, labelled in a hand she did not know, and the labels were all correct.',
        'The receipts were in a drawer he had never used, held with a clip, in order, going back years. Hardware store, hardware store, hardware store, florist.',
        'The florist was the one that stopped her. Not because of what it might mean — she knew what it meant, it meant her birthday, every year, the same shop.',
        'It stopped her because he had kept the receipt. Because somewhere in him was a man who thought that one day somebody might need to check.',
        'She put the clip back in the drawer and closed it, and the house was very quiet, and very clean, and that was the part no one had warned her about.'] },
    ];

    const rail = document.getElementById('lit-rail');
    if (!rail) return;

    /* Put the shelf's top edge on Cento's rule. The attributions are pinned
       to the bottom of their pane, so the rule sits a block's height above
       it — a height that moves with the titles and the window, which is why
       this is measured rather than written as a track. */
    const mainEl = document.querySelector('main');
    const sources = document.getElementById('sources');
    if (mainEl && sources) {
      const align = function () {
