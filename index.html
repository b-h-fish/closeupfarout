<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>closeupfarout</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@100&family=Space+Mono:ital@0;1&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink: #1a1008;
      --paper: #ffffff;
      --accent: #1a1008;
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--paper);
    }

    /* ── NAV ── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2rem;
      height: 80px;
      background: var(--paper);
    }

    .nav-wordmark {
      font-family: 'Josefin Sans', sans-serif;
      font-weight: 100;
      font-size: 1.4rem;
      letter-spacing: 0.15em;
      text-transform: lowercase;
      color: var(--ink);
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      list-style: none;
      gap: 2rem;
    }

    .nav-links a {
      font-family: 'Space Mono', monospace;
      font-size: 0.85rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent);
      text-decoration: none;
      opacity: 0.6;
      transition: opacity 0.2s;
    }

    .nav-links a:hover { opacity: 1; }

    /* ── STAGE ── */
    #stage {
      position: fixed;
      top: 80px; left: 0; right: 0; bottom: 0;
      overflow: hidden;
      background: var(--paper);
    }

    /* ── SPHERE SCENE ── */
    .scene {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      perspective: 900px;
    }

    .sphere {
      position: relative;
      width: 0; height: 0;
      transform-style: preserve-3d;
      animation: rotateSphere 32s linear infinite,
                 breathe 8s ease-in-out infinite;
    }

    #fade-overlay {
      position: absolute;
      inset: 0;
      background: var(--paper);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.55s ease-in-out;
      z-index: 5;
    }

    @keyframes rotateSphere {
      from { transform: rotateY(0deg) rotateX(12deg); }
      to   { transform: rotateY(360deg) rotateX(12deg); }
    }

    @keyframes breathe {
      0%, 100% { scale: 1; }
      50%       { scale: 0.88; }
    }

    .tile {
      position: absolute;
      background-size: cover;
      background-position: center;
      backface-visibility: visible;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.08);
      will-change: transform;
    }

    /* ── COVER IMAGE ── */
    .cover { display: none; }

    /* ── MOBILE ── */
    @media (max-width: 768px) {
      nav {
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 110px;
        gap: 0.6rem;
      }

      .nav-links {
        gap: 1.4rem;
        justify-content: center;
      }

      .nav-links a {
        font-size: 0.75rem;
      }

      #stage {
        top: 110px;
      }

      .scene {
        left: 50%;
        top: 45%;
      }

      .sphere {
        scale: 0.55;
      }

      .cover {
        display: none;
      }

      @keyframes breathe {
        0%, 100% { scale: 0.55; }
        50%       { scale: 0.48; }
      }
    }

    /* ── GRAIN ── */
    .grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 50;
      opacity: 0.04;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      background-size: 200px 200px;
    }
  </style>
</head>
<body>

  <nav>
    <a class="nav-wordmark" href="/">closeupfarout</a>
    <ul class="nav-links">
      <li><a href="/weekly/">Weekly</a></li>
      <li><a href="/quarterly/">Quarterly</a></li>
      <li><a href="/audio/">Audio</a></li>
    </ul>
  </nav>

  <div id="stage">
    <div id="fade-overlay"></div>
    <div class="scene">
      <div class="sphere" id="sphere"></div>
    </div>
    <div class="cover">
      <img src="images/issue-01-placeholder.png" alt="Issue 01 — Summer 2026" />
    </div>
  </div>

  <div class="grain"></div>

  <script>
    const IMAGES = [
      'images/sphere-img-01.jpg',
      'images/sphere-img-02.jpg',
      'images/sphere-img-03.jpg',
      'images/sphere-img-04.jpg',
      'images/sphere-img-05.jpg',
      'images/sphere-img-06.jpg',
      'images/sphere-img-07.jpg',
    ];

    const TILE_COUNT = 54;
    const RADIUS     = 260;
    const TILE_SIZE  = 88;

    // All transforms use the same 5-function structure so CSS can interpolate smoothly:
    // rotateY(rY) rotateX(rX) translateZ(tZ) translateX(tX) translateY(tY)
    function tf(rY, rX, tZ, tX, tY) {
      return `rotateY(${rY}deg) rotateX(${rX}deg) translateZ(${tZ}px) translateX(${tX}px) translateY(${tY}px)`;
    }

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    // ── SPHERE: 60 tiles via Fibonacci distribution ──────────────────────────
    function spherePositions() {
      const golden = Math.PI * (3 - Math.sqrt(5));
      return Array.from({ length: TILE_COUNT }, (_, i) => {
        const y     = 1 - (i / (TILE_COUNT - 1)) * 2;
        const theta = golden * i;
        const lat   = Math.asin(y) * (180 / Math.PI);
        const lon   = (theta * 180 / Math.PI) % 360;
        return { rY: lon, rX: -lat, tZ: RADIUS, tX: 0, tY: 0 };
      });
    }

    // ── CUBE: 6 faces × 9 tiles (3×3 grid) = 54 — perfect cube ─────────────
    function cubePositions() {
      const S = RADIUS * 0.46; // face half-extent — ~8px gap between tiles
      const FACES = [
        [0,    0],   // front  (+Z)
        [-90,  0],   // right  (+X)
        [180,  0],   // back   (-Z)
        [90,   0],   // left   (-X)
        [0,  -90],   // top    (+Y)
        [0,   90],   // bottom (-Y)
      ];
      const COLS = 3, ROWS = 3; // perfect 3×3 grid per face
      const out = [];
      FACES.forEach(([rY, rX]) => {
        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            const tX = S * (-1 + (c / (COLS - 1)) * 2);
            const tY = S * (-1 + (r / (ROWS - 1)) * 2);
            out.push({ rY, rX, tZ: S + TILE_SIZE / 2 + 18, tX, tY });
          }
        }
      });
      return out; // 54 positions
    }

    // ── CONE: 5 lateral rings + circular base = 54 ──────────────────────────
    // Ring sizes obey 2π·r / count ≥ TILE_SIZE so tiles never overlap within a ring.
    // tZ = √(r²+Y²), rX = atan2(-Y,r) places each ring at world pos (r·sinφ, Y, r·cosφ)
    function conePositions() {
      const out = [];

      // Lateral rings — count and radius chosen so spacing ≥ 88px per tile
      // Surface dist between adjacent rings = √(Δr²+ΔY²) ≥ 88px
      const rings = [
        { count:  3, r:  65, Y: -155 }, // apex      — 2π·65/3   = 136px ✓
        { count:  5, r: 110, Y: -100 }, //            2π·110/5   = 138px ✓
        { count:  8, r: 175, Y:  -35 }, // surf→ring2 = 92px ✓   2π·175/8  = 137px ✓
        { count: 11, r: 230, Y:  +40 }, // surf→ring3 = 93px ✓   2π·230/11 = 131px ✓
        { count: 12, r: 265, Y: +125 }, // surf→ring4 = 92px ✓   2π·265/12 = 139px ✓
      ]; // 39 tiles

      rings.forEach(({ count, r, Y }) => {
        const tZ = Math.sqrt(r * r + Y * Y);
        const rX = Math.atan2(-Y, r) * (180 / Math.PI);
        for (let i = 0; i < count; i++) {
          const rY = (i / count) * 360;
          out.push({ rY, rX, tZ, tX: 0, tY: 0 });
        }
      });

      // Flat base: 15 tiles lying horizontal (rX=-90), each rotated to its own
      // angle (rY=a) so tiles are consistently oriented radially around the disk.
      // Ring radii spaced 90px apart so tiles don't overlap between rings.
      const tZ_base = 165;
      [{ count: 3, r: 75 }, { count: 5, r: 165 }, { count: 7, r: 253 }]
        .forEach(({ count, r }) => {
          for (let i = 0; i < count; i++) {
            const a = (i / count) * 360; // degrees
            out.push({ rY: a, rX: -90, tZ: tZ_base, tX: r, tY: 0 });
          }
        }); // 15 tiles

      return out; // 54 positions
    }

    // ── TORUS: 5 θ-rings around the tube × φ tiles around the torus = 54 ────
    // rX=0 for all; tZ = R + r·cos(θ) positions each ring's depth;
    // tY = r·sin(θ) positions each ring vertically on the tube.
    function torusPositions() {
      const R = 175; // major radius (torus center to tube center)
      const r =  76; // tube radius — sized so inner rings are ≥88px apart vertically
      const out = [];

      // Rings: θ evenly spaced, φ count chosen so 2π·(R+r·cosθ)/count ≥ 88px
      const rings = [
        { theta:   0, count: 14 }, // outer       — spacing 113px ✓
        { theta:  72, count: 13 }, // upper-outer  — spacing  96px ✓
        { theta: 144, count:  7 }, // upper-inner  — spacing 102px ✓
        { theta: 216, count:  7 }, // lower-inner  — spacing 102px ✓
        { theta: 288, count: 13 }, // lower-outer  — spacing  96px ✓
      ]; // 54 total — inner rings 89.4px apart vertically ✓

      rings.forEach(({ theta, count }) => {
        const th = theta * Math.PI / 180;
        const tZ = R + r * Math.cos(th);
        const tY = r * Math.sin(th);
        for (let i = 0; i < count; i++) {
          const rY = (i / count) * 360;
          out.push({ rY, rX: 0, tZ, tX: 0, tY });
        }
      });

      return out; // 54 positions
    }

    // ── BUILD TILES ──────────────────────────────────────────────────────────
    function buildTiles() {
      const sphere = document.getElementById('sphere');
      const pool   = shuffle(IMAGES);
      const pos    = torusPositions();

      for (let i = 0; i < TILE_COUNT; i++) {
        const p    = pos[i];
        const tile = document.createElement('div');
        tile.className          = 'tile';
        tile.style.width        = TILE_SIZE + 'px';
        tile.style.height       = TILE_SIZE + 'px';
        tile.style.marginLeft   = -TILE_SIZE / 2 + 'px';
        tile.style.marginTop    = -TILE_SIZE / 2 + 'px';
        tile.style.backgroundImage = `url('${pool[i % pool.length]}')`;
        tile.style.transform    = tf(p.rY, p.rX, p.tZ, p.tX, p.tY);
        sphere.appendChild(tile);
      }
    }

    // ── APPLY SHAPE ──────────────────────────────────────────────────────────
    function applyShape(positions) {
      document.querySelectorAll('.tile').forEach((tile, i) => {
        const p = positions[i];
        tile.style.transform = tf(p.rY, p.rX, p.tZ, p.tX, p.tY);
      });
    }

    // ── MORPH CYCLE: fade out → snap to new shape → fade in ─────────────────
    const SHAPES = [torusPositions, cubePositions, spherePositions];
    let shapeIdx = 0; // start on torus; cycle goes → cube → sphere → torus …
    const FADE_MS = 550; // must match CSS transition on .sphere

    function cycleShape() {
      shapeIdx = (shapeIdx + 1) % SHAPES.length;
      const overlay = document.getElementById('fade-overlay');

      // 1. Fade overlay in (covers the sphere)
      overlay.style.opacity = '1';

      setTimeout(() => {
        // 2. Snap tiles instantly while hidden
        applyShape(SHAPES[shapeIdx]());
        // 3. Fade overlay back out (reveals new shape)
        overlay.style.opacity = '0';
      }, FADE_MS);

      setTimeout(cycleShape, 11500);
    }

    buildTiles();
    setTimeout(cycleShape, 11500); // first morph after 11.5s on sphere

  </script>

</body>
</html>
