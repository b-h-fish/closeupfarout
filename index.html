<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>closeupfarout</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@100&family=Space+Mono:ital@0;1&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink: #1a1008;
      --paper: #ffffff;
      --accent: #1a1008;
      --gap: 3px;
    }

    html, body {
      width: 100%; height: 100%;
      max-height: 100%;
      overflow: hidden;
      background: var(--paper);
    }

    /* ── NAV ── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2rem;
      height: 52px;
      background: var(--paper);
    }

    .nav-wordmark {
      font-family: 'Josefin Sans', sans-serif;
      font-weight: 100;
      font-size: 1.1rem;
      letter-spacing: 0.15em;
      text-transform: lowercase;
      color: var(--ink);
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      list-style: none;
    }

    .nav-links a {
      font-family: 'Space Mono', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent);
      text-decoration: none;
      opacity: 0.6;
      transition: opacity 0.2s;
    }

    .nav-links a:hover { opacity: 1; }

    /* ── STAGE ── */
    #stage {
      position: fixed;
      top: 52px; left: 0; right: 0; bottom: 0;
      overflow: hidden;
      background: var(--paper);
    }

    /* ── CELLS ── */
    .cell {
      position: absolute;
      background-size: cover;
      background-position: center;
      opacity: 0;
      transition-property: opacity;
      transition-timing-function: ease-in-out;
    }

    /* ── GRAIN ── */
    .grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 50;
      opacity: 0.04;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      background-size: 200px 200px;
    }
  </style>
</head>
<body>

  <nav>
    <a class="nav-wordmark" href="/">closeupfarout</a>
    <ul class="nav-links">
      <li><a href="/issue-01/">Issue 01 — Spring 2026</a></li>
    </ul>
  </nav>

  <div id="stage"></div>

  <div class="grain"></div>

  <script>
    const IMAGES = [
      'images/67-laughing-gas.jpg',
      'images/Screen-Shot-2020-07-29-at-10.00.32-PM.png',
      'images/Screen-Shot-2020-11-20-at-4.06.40-PM.png',
      'images/Screen-Shot-2021-02-18-at-1.43.33-AM.png',
      'images/Screen-Shot-2021-08-11-at-3.12.55-AM.png',
      'images/b.h.-fish-pic-copy.JPG',
      'images/ballet-holo.png',
      'images/bern.png',
      'images/canvalley.png',
      'images/femarmharm.png',
      'images/leaflute.png',
      'images/live-coney.png',
      'images/showman-shadow.png',
      'images/skomorokh.png',
      'images/splitlip.png',
    ];

    // Macro panel grid layout
    const PANEL_COLS  = 4;
    const PANEL_ROWS  = 2;
    const PANEL_GAP   = 10; // gap between panels
    const STAGE_PAD   = 16; // padding around the whole grid

    // Micro mosaic inside each panel
    const BASE_COLS   = 4;  // base grid units per panel
    const CELL_GAP    = 2;
    const HOLD_MS     = 3500;
    const STAGGER_MS  = 1200;
    const MIN_FADE_MS = 300;
    const MAX_FADE_MS = 2200;
    const OVERLAP_MS  = 600;

    const stage = document.getElementById('stage');

    function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
    function randFade() { return MIN_FADE_MS + Math.random() * (MAX_FADE_MS - MIN_FADE_MS); }
    function randHold() { return HOLD_MS + Math.random() * 2000; }
    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    // Build a mosaic inside a given container of known pixel size
    function buildMosaic(container, size) {
      const unit = (size - CELL_GAP * (BASE_COLS - 1)) / BASE_COLS;
      const rows = Math.ceil((size + CELL_GAP) / (unit + CELL_GAP));
      const taken = Array.from({ length: rows + 4 }, () => new Uint8Array(BASE_COLS));

      function fits(r, c, s) {
        if (c + s > BASE_COLS) return false;
        for (let dr = 0; dr < s; dr++)
          for (let dc = 0; dc < s; dc++)
            if (taken[r + dr]?.[c + dc]) return false;
        return true;
      }
      function occupy(r, c, s) {
        for (let dr = 0; dr < s; dr++)
          for (let dc = 0; dc < s; dc++)
            if (taken[r + dr]) taken[r + dr][c + dc] = 1;
      }

      const pool = shuffle(IMAGES);
      const cells = [];
      let idx = 0;

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < BASE_COLS; c++) {
          if (taken[r][c]) continue;

          const roll = Math.random();
          const preferred = roll < 0.12 ? [4, 2, 1]
                          : roll < 0.42 ? [2, 1, 4]
                          :               [1, 2, 4];

          let chosen = 1;
          for (const s of preferred) {
            if (fits(r, c, s)) { chosen = s; break; }
          }
          occupy(r, c, chosen);

          const px  = chosen * unit + (chosen - 1) * CELL_GAP;
          const x   = c * (unit + CELL_GAP);
          const y   = r * (unit + CELL_GAP);
          const src = pool[idx++ % pool.length];

          const el = document.createElement('div');
          el.className = 'cell';
          el.style.cssText = `
            position: absolute;
            left: ${x}px; top: ${y}px;
            width: ${px}px; height: ${px}px;
            background-image: url('${src}');
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition-property: opacity;
            transition-timing-function: ease-in-out;
          `;
          container.appendChild(el);
          cells.push(el);
        }
      }
      return cells;
    }

    async function fadeIn(cells) {
      await sleep(40);
      cells.forEach(cell => {
        cell.style.transitionDuration = `${randFade()}ms`;
        cell.style.transitionDelay    = `${Math.random() * STAGGER_MS}ms`;
        cell.style.opacity = '1';
      });
      await sleep(STAGGER_MS + MAX_FADE_MS);
      cells.forEach(cell => { cell.style.transitionDelay = '0ms'; });
    }

    function fadeOut(cells) {
      cells.forEach(cell => {
        cell.style.transitionDuration = `${randFade()}ms`;
        cell.style.transitionDelay    = `${Math.random() * STAGGER_MS}ms`;
        cell.style.opacity = '0';
      });
      setTimeout(() => cells.forEach(c => c.remove()), STAGGER_MS + MAX_FADE_MS);
    }

    // Each panel runs its own independent loop
    async function runPanel(container, size, startDelay) {
      await sleep(startDelay);
      let current = buildMosaic(container, size);
      await fadeIn(current);
      while (true) {
        await sleep(randHold());
        fadeOut(current);
        await sleep(OVERLAP_MS);
        current = buildMosaic(container, size);
        await fadeIn(current);
      }
    }

    function init() {
      const W = stage.clientWidth;
      const H = stage.clientHeight;

      // Fit panels to both dimensions: find size that fills height with whole rows
      const maxByWidth = Math.floor((W - STAGE_PAD * 2 - PANEL_GAP * (PANEL_COLS - 1)) / PANEL_COLS);
      const targetRows = Math.round((H - STAGE_PAD * 2 + PANEL_GAP) / (maxByWidth + PANEL_GAP));
      const panelSize  = Math.min(maxByWidth, Math.floor((H - STAGE_PAD * 2 - PANEL_GAP * (targetRows - 1)) / targetRows));
      const panelRows  = targetRows;

      const gridW = PANEL_COLS * panelSize + PANEL_GAP * (PANEL_COLS - 1);

      const grid = document.createElement('div');
      grid.style.cssText = `
        position: absolute;
        left: ${Math.round((W - gridW) / 2)}px;
        top: ${STAGE_PAD}px;
        display: grid;
        grid-template-columns: repeat(${PANEL_COLS}, ${panelSize}px);
        gap: ${PANEL_GAP}px;
      `;
      stage.appendChild(grid);

      for (let i = 0; i < PANEL_COLS * panelRows; i++) {
        const panel = document.createElement('div');
        panel.style.cssText = `
          position: relative;
          width: ${panelSize}px;
          height: ${panelSize}px;
          overflow: hidden;
        `;
        grid.appendChild(panel);
        runPanel(panel, panelSize, Math.random() * 5000);
      }
    }

    init();
  </script>

</body>
</html>
