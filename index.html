<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>closeupfarout</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@100&family=Space+Mono:ital@0;1&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Spectral:ital,wght@1,400&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink: #1a1008;
      --paper: #ffffff;
      --accent: #1a1008;
      --rule: rgba(26, 16, 8, 0.10);
      --dim: rgba(26, 16, 8, 0.45);
      /* Slim bar across the top. A shade off the #090909 page so it separates
         without becoming a band of colour. */
      --nav-h: 50px; /* 25% up from 40px */
      --hdr: #171717;
      /* How long one set of books takes to melt into the next. The script reads
         this back, so the timing is defined only here. */
      --melt: 1.6s;
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--paper);
      color: var(--ink);
    }


    /* ── HEADER ── */
    body > header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      height: var(--nav-h);
      background: var(--hdr);
      display: flex;
      align-items: center;
      /* Same 2rem the teaser uses, so the wordmark starts on the page's left
         margin rather than a margin of its own. */
      padding: 0 2rem;
    }

    #brand {
      font-family: 'Josefin Sans', sans-serif;
      font-weight: 100;
      font-size: 1.19rem; /* 25% up from 0.95rem */
      letter-spacing: 0.15em;
      text-transform: lowercase;
      color: rgba(245, 242, 236, 0.78);
      white-space: nowrap;
    }

    /* ── MAIN: teaser left, wave field right ── */
    main {
      position: fixed;
      top: var(--nav-h);
      left: 0; right: 0;
      bottom: 0;
      display: grid;
      /* Teaser takes 40%; the remaining 60% is the field, uncovered. */
      grid-template-columns: 2fr 3fr;
      /* The black lives here rather than on the teaser so #waves can span the
         whole viewport beneath it. Whatever the teaser does not cover is
         field. */
      background: #090909;
    }

    /* Spans main, behind everything. It must stay absolutely positioned: in
       flow it becomes a grid item, auto-places into the free column, and its
       full-viewport intrinsic width crushes the teaser's track. */
    #waves {
      position: absolute;
      inset: 0;
      z-index: 0;
      display: block;
      pointer-events: none;
    }

    /* ── Left: hover veil over the preview block ── */
    #weave-link {
      position: relative;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      color: inherit;
      text-decoration: none;
    }

    #cento-overlay {
      position: absolute;
      inset: 0;
      z-index: 3;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      background: rgba(9, 9, 9, 0.88);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    /* Touch devices have no hover, so the veil never shows — the tap just
       follows the link through to Cento. */
    @media (hover: hover) {
      #weave-link:hover #cento-overlay { opacity: 1; }
    }

    #cento-logo {
      font-family: 'Spectral', serif;
      font-style: italic;
      font-size: clamp(2.1rem, 3.2vw, 3.2rem);
      letter-spacing: 0.2em;
      text-indent: 0.2em; /* offset the trailing letter-space so it reads centred */
      white-space: nowrap;
    }

    /* Same four voice hues Cento uses, in the same order as its own wordmark */
    #cento-logo span:nth-child(1) { color: #c07a2b; }
    #cento-logo span:nth-child(2) { color: #8b3d6b; }
    #cento-logo span:nth-child(3) { color: #2b6e8b; }
    #cento-logo span:nth-child(4) { color: #4a7a46; }
    #cento-logo span:nth-child(5) { color: #c07a2b; }

    /* ── Left: the woven text ── */
    #weave-pane {
      display: flex;
      flex-direction: column;
      min-height: 0;
      /* Full height of its column, under the header. Opaque, so it masks the
         field that spans main behind it — the waves read only to its right. */
      grid-column: 1;
      grid-row: 1;
      position: relative;
      z-index: 1;
      /* Full margin against the page edge, half of it facing the field. */
      padding: 0 1rem 0 2rem;

      /* Cento's own dark colourway, kept to this block so the rest of the page
         stays on paper. The voice hues need no adjustment — they were chosen
         against this background in the first place. */
      --teaser-bg: #090909;
      --teaser-fg: #f5f2ec;
      --teaser-rule: rgba(245, 242, 236, 0.14);
      --teaser-dim: rgba(245, 242, 236, 0.42);
      background: var(--teaser-bg);
      color: var(--teaser-fg);
    }

    .weave {
      flex: 1;
      min-height: 0;
      /* Deliberately clipped, not scrollable — the weave runs past the bottom
         edge mid-sentence so the page reads as an excerpt of something larger.
         The script trims this to a whole number of lines so the cut always
         falls cleanly between them, never through one. */
      overflow: hidden;
      padding: 1.6rem 0 1.2rem;
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.02rem, 1.15vw, 1.24rem);
      /* Single source of truth: the script reads this back to size a line. */
      --line-ratio: 1.85;
      line-height: var(--line-ratio);
    }

    /* Loading is silent — the pane simply stays empty until the weave lands.
       This is only for the failure case, kept quiet so it doesn't shout. */
    .weave-msg {
      font-style: italic;
      color: var(--teaser-dim);
    }

    /* The cento idea, made visible: the weave settles from four borrowed
       voices into one poem in a single hand, then separates again. Colour
       comes from a class rather than an inline style so `.mono` can win.
       The class is toggled on the pane so the text and its attributions
       cross together — one toggle, no chance of the two drifting apart. */
    .weave span,
    .sources span { transition: color 1.6s ease-in-out; }

    #weave-pane .v0 { color: #c07a2b; }
    #weave-pane .v1 { color: #8b3d6b; }
    #weave-pane .v2 { color: #2b6e8b; }
    #weave-pane .v3 { color: #4a7a46; }

    #weave-pane.mono .weave span,
    #weave-pane.mono .sources span { color: var(--teaser-fg); }

    /* Melting into a new set of books. The outgoing text is cloned into #ghost,
       stacked over the live pane, and the two cross in opposite directions at
       once — so the old text is still dissolving as the new one surfaces,
       rather than the pane emptying between them.

       Opacity is independent of the colour cycle above, so a melt and a colour
       crossing can overlap without either disturbing the other. The ghost sits
       under #cento-overlay (z-index 3) so hovering still works mid-melt. */
    #ghost {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: flex;
      flex-direction: column;
      pointer-events: none;
    }

    .weave, .sources, #ghost { transition: opacity var(--melt) ease-in-out; }

    /* Indefinite colour cycling is exactly what this preference is for. */
    @media (prefers-reduced-motion: reduce) {
      .weave span { transition: none; }
    }

    /* ── Left: attributions ── */
    .sources {
      flex-shrink: 0;
      /* The weave above is trimmed to whole lines, so it no longer fills the
         pane. Hold this at the bottom and let the slack sit above the rule. */
      margin-top: auto;
      border-top: 1px solid var(--teaser-rule);
      padding: 0.9rem 0 1.1rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.3rem 1.5rem;
    }

    /* Plain text, not links — the whole preview block is one link to Cento. */
    .sources span {
      font-family: 'EB Garamond', serif;
      font-size: 0.83rem;
      line-height: 1.4;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      opacity: 0.9;
    }

    /* ── MOBILE: one column ── */
    @media (max-width: 768px) {
      main { grid-template-columns: 1fr; }
      #weave-pane { padding: 0 1.4rem; }
      .weave { font-size: 1.02rem; }
      .sources { grid-template-columns: 1fr; }
      .sources span { font-size: 0.78rem; }
    }

    /* ── GRAIN ── */
    .grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 50;
      opacity: 0.04;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      background-size: 200px 200px;
    }

    /* ── Hi Lo teaser ──
       Built on the same idea as the Cento block beside it: the page shows the
       actual thing rather than a picture of it. The game plays itself here
       through its own rules engine, renderer and palettes, so a card on the
       front page is the card you get when you follow the link. */
    #hilo-pane {
      display: flex;
      flex-direction: column;
      min-height: 0;
      position: relative;
      z-index: 1;
      grid-column: 2;
      grid-row: 2;
      /* Opaque, so it masks the field spanning main behind it — exactly as the
         weave block does on the other side. */
      background: #090909;
      color: #f5f2ec;
      /* Mirror of the weave's margins: full against the page edge, half
         facing the field. */
      padding: 0 2rem 0 1rem;
    }

    /* The field keeps the top of its column; the game takes the bottom, and a
       little more than half of it — two rows of cards need the height, and the
       field reads the same at any size. */
    main { grid-template-rows: 1fr 1.3fr; }
    #weave-pane { grid-row: 1 / span 2; }

    #hilo-link {
      position: relative;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      color: inherit;
      text-decoration: none;
    }

    /* The art is a bounded screen rather than a bleed. Every setting is
       landscape by construction — ground plane at 42%, sky above — so a tall
       pane filled edge to edge leaves the bottom half an empty table. Holding
       a landscape ratio and centring it lets the same block sit in a strip, a
       column or a phone without being recomposed. */
    #hilo-stage {
      position: relative;
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.2rem 0 1rem;
    }
    #hilo-canvas {
      display: block;
      aspect-ratio: 8 / 5;
      width: 100%;
      max-width: 100%;
      max-height: 100%;
      /* Integer scaling is the whole aesthetic — never let the browser
         smooth it back into mush. */
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    /* Same anatomy as the weave's attributions — a rule, then small serif text
       — so the two previews read as siblings rather than as two designs. */
    #hilo-meta {
      flex-shrink: 0;
      border-top: 1px solid rgba(245, 242, 236, 0.14);
      padding: 0.9rem 0 1.1rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.3rem 1.5rem;
    }
    #hilo-meta span {
      font-family: 'EB Garamond', serif;
      font-size: 0.83rem;
      line-height: 1.4;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      opacity: 0.9;
    }
    #hilo-meta .right { text-align: right; }

    /* ── MOBILE: the two previews stack, the field drops out ── */
    @media (max-width: 768px) {
      main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
      #weave-pane { grid-column: 1; grid-row: 1; }
      #hilo-pane  { grid-column: 1; grid-row: 2; padding: 0 1.4rem; }
    }
  </style>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
</head>
<body>

  <header><h1 id="brand">closeupfarout</h1></header>

  <main>
    <canvas id="waves" aria-hidden="true"></canvas>

    <div id="weave-pane">
      <a id="weave-link" href="/cento/" aria-label="Open Cento">
        <div id="weave" class="weave"></div>
        <div id="sources" class="sources"></div>
        <div id="cento-overlay" aria-hidden="true">
          <div id="cento-logo"><span>C</span><span>E</span><span>N</span><span>T</span><span>O</span></div>
        </div>
      </a>
    </div>

    <div id="hilo-pane">
      <a id="hilo-link" href="/hi-lo/" aria-label="Open Hi Lo">
        <div id="hilo-stage"><canvas id="hilo-canvas" aria-hidden="true"></canvas></div>
        <div id="hilo-meta">
          <span id="hilo-setting"></span>
          <span class="right">a card game</span>
        </div>
      </a>
    </div>

  </main>


  <div class="grain"></div>

  <!-- The game's own files, unmodified and shared with /hi-lo — the teaser
       runs the real rules engine rather than a copy of it, so the two can
       never drift. Deferred: nothing here should hold up the weave. -->
  <script defer src="/hi-lo/pixel.js"></script>
  <script defer src="/hi-lo/game.js"></script>
  <script defer src="/hi-lo/scenes.js"></script>
  <script defer src="/hi-lo/teaser.js"></script>
  <script>
  /* Deferred scripts have all run by the time DOMContentLoaded fires, so the
     renderer and the rules engine are both in hand here. */
  document.addEventListener('DOMContentLoaded', function () {
    var cv = document.getElementById('hilo-canvas');
    if (!cv || !window.HiLoTeaser) return;

    var nm = document.getElementById('hilo-setting');
    var t = window.HiLoTeaser.make(cv, {
      cols: 3, rows: 2,
      onScene: function (name) { if (nm) nm.textContent = name; }
    });
    if (!t) return;
    if (nm) nm.textContent = t.name();

    var link = document.getElementById('hilo-link');
    if (link && window.matchMedia && window.matchMedia('(hover: hover)').matches) {
      link.addEventListener('mouseenter', function () { t.setHover(true); });
      link.addEventListener('mouseleave', function () { t.setHover(false); });
    }

    /* The pane is a grid item with no intrinsic size, so the canvas would
       measure itself against a zero box if asked too early. */
    requestAnimationFrame(function () {
      requestAnimationFrame(function () { t.start(); });
    });
  });
  </script>

  <script>
  (function () {
    'use strict';

    // A small, read-only Cento: one fresh weave per page load. No corners, no
    // controls — just the aggregate text and who it came from. The full
    // instrument lives at /cento/.
    // Voice colours live in the CSS (`#weave-pane .v0`–`.v3`), not here — the
    // colour cycle needs them in classes so `.mono` can override them.
    // Deliberately more than any screen shows. The pane clips rather than
    // scrolls, so this just has to guarantee the text runs past the bottom
    // edge on a tall display instead of stopping short with dead space.
    const SENTENCES = 44;

    // Only a few dozen sentences are needed here, so ask the API for a small
    // slice of each book rather than the whole text.
    const PARAGRAPH_WINDOW = 12;

    // How long the weave holds each state before crossing to the other. The
    // fade itself lives on the `#weave span` transition in the CSS.
    const MONO_INTERVAL = 9000;

    // How long a set of four books stays up before being replaced.
    const SWAP_INTERVAL = 48000;

    // How long one set melts into the next. Read from the stylesheet, where the
    // matching transition lives, so the two cannot drift apart. Note the CSS is
    // in seconds and this is milliseconds.
    const MELT = (parseFloat(
      getComputedStyle(document.documentElement).getPropertyValue('--melt')
    ) || 3) * 1000;

    // ── Sentence splitting (mirrors /cento) ──────────────────
    // Kept in step with Cento's own splitter \u2014 heavily semicoloned sentences
    // are usually catalogues that swamp the weave.
    const MAX_SEMICOLONS = 3;

    // Teaser only — Cento itself keeps its long sentences. A single sprawling
    // one can fill most of this small pane, which reads as one dense block
    // rather than as four voices trading lines. The floor is Cento's own.
    const MIN_WORDS = 3;
    const MAX_WORDS = 50;

    const ABBR_PERIOD = '\uE000';
    const ABBR_WORDS = /\b(Mr|Mrs|Ms|Mmes|Messrs|Mme|Mlle|Dr|Drs|Prof|Profs|Sr|Jr|Sra|Srta|St|Ste|Ss|Rev|Revd|Fr|Bro|Br|Msgr|Mgr|Ven|Bp|Abp|Card|Rt|Hon|Gen|Col|Lt|Lieut|Maj|Capt|Cpl|Sgt|Cmdr|Cdr|Cmdre|Adm|Brig|Pvt|Pfc|Ens|Sfc|Gov|Sen|Rep|Pres|Supt|Det|Insp|Amb|Mt|Ft|No|Nos|Vol|Vols|pp|Ch|Fig|Figs|Ed|Eds|Inc|Ltd|Co|Corp|Bros|Ave|Rd|Blvd|etc|vs|viz|cf|al|ibid|op|esp|ca|fl|Jan|Feb|Mar|Apr|Jun|Jul|Aug|Sep|Sept|Oct|Nov|Dec)\./g;

    function protectAbbrev(text) {
      return text
        .replace(/\b(?:[A-Za-z]\.){2,}/g, m => m.replace(/\./g, ABBR_PERIOD))
        .replace(/\b[A-Za-z]\.(?:\s+[A-Za-z]\.)+/g, m => m.replace(/\./g, ABBR_PERIOD))
        .replace(/\b[IVXLCDM]{2,}\./g, m => m.replace(/\./g, ABBR_PERIOD))
        .replace(ABBR_WORDS, (m, w) => w + ABBR_PERIOD);
    }

    function splitSentences(text) {
      const re = /[\s\S]+?[.!?…]+["”'’)\]]*(?=\s+["“'‘(]*[A-Z0-9]|\s*$)|[\s\S]+$/g;
      const matches = protectAbbrev(text).match(re);
      if (!matches) return [];
      return matches
        .map(s => s.split(ABBR_PERIOD).join('.').trim())
        .filter(s => {
          const words = s.split(/\s+/).length;
          return words >= MIN_WORDS && words <= MAX_WORDS &&
            (s.match(/;/g) || []).length <= MAX_SEMICOLONS &&
            !/\S+@\S+\.\S+/.test(s) &&
            !/^[IVXLCDM]+\.?\s*—/.test(s);
        });
    }

    function esc(str) {
      return String(str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // ── Weave: round-robin one sentence per voice ────────────
    function weave(voices) {
      const live = voices.filter(v => v.sentences.length);
      if (!live.length) return '';
      const perVoice = Math.ceil(SENTENCES / live.length);
      const rows = live.map(v => v.sentences.slice(0, perVoice));
      const maxLen = Math.max(...rows.map(r => r.length));

      const spans = [];
      for (let i = 0; i < maxLen && spans.length < SENTENCES; i++) {
        for (let j = 0; j < live.length && spans.length < SENTENCES; j++) {
          if (i < rows[j].length) {
            spans.push(
              '<span class="v' + live[j].vi + '">' + esc(rows[j][i]) + '</span>'
            );
          }
        }
      }
      return '<p>' + spans.join(' ') + '</p>';
    }

    // `overflow: hidden` clips at the padding box, so the bottom line is
    // normally sliced through. Trim the pane to a whole number of lines instead
    // and the cut lands cleanly between them.
    //
    // The line box is derived from font-size, not line-height: getComputedStyle
    // is entitled to hand back the raw number (1.85) rather than a pixel length,
    // and flooring against 1.85 quietly does nothing. font-size is always px.
    function snapToWholeLines() {
      const el = document.getElementById('weave');
      const pane = document.getElementById('weave-pane');
      const sources = document.getElementById('sources');
      const cs = getComputedStyle(el);

      const ratio = parseFloat(cs.getPropertyValue('--line-ratio')) || 1.85;
      const line = parseFloat(cs.fontSize) * ratio;
      if (!line) return;

      // Two things this has to get right:
      //
      // Measure the room the pane offers, never the weave's own height — that
      // is the value being set, so reading it back makes each run depend on
      // the last.
      //
      // And the visible band is everything below padding-top, bottom padding
      // included: the clip is at the padding box, so text runs on through
      // padding-bottom and shows there. Sizing the content box instead leaves
      // that padding free to reveal a slice of one more line.
      const padTop = parseFloat(cs.paddingTop);
      const band = pane.clientHeight - sources.offsetHeight - padTop;
      if (band < line) return;

      el.style.maxHeight = (Math.floor(band / line) * line + padTop) + 'px';
    }

    // The pane settles late: the webfont swap resizes the attributions beneath
    // it, and any window resize moves it again. Watching the pane rather than
    // the weave means the trim can't retrigger this.
    let snapTimer = null;
    function scheduleSnap() {
      clearTimeout(snapTimer);
      snapTimer = setTimeout(snapToWholeLines, 60);
    }
    new ResizeObserver(scheduleSnap).observe(document.getElementById('weave-pane'));
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(scheduleSnap);

    function renderSources(voices) {
      document.getElementById('sources').innerHTML = voices
        .filter(v => v.sentences.length && v.title)
        .map(v =>
          '<span class="v' + v.vi + '" title="' +
          esc(v.title) + (v.author ? ' — ' + esc(v.author) : '') + '">' +
          esc(v.title) + '</span>'
        )
        .join('');
    }

    async function fetchWeave() {
      const res = await fetch('/api/instrument-01?window=' + PARAGRAPH_WINDOW);
      if (!res.ok) throw new Error('API ' + res.status);
      const data = await res.json();

      const voices = (data.voices || []).map((v, i) => ({
        title: v.title,
        author: v.author,
        vi: i,
        sentences: splitSentences((v.paragraphs || []).join(' ')),
      }));

      const html = weave(voices);
      if (!html) throw new Error('no text');
      return { voices, html };
    }

    function paint(next) {
      document.getElementById('weave').innerHTML = next.html;
      renderSources(next.voices);
      snapToWholeLines();
    }

    // Draw four new books and cross into them. The fetch happens before the
    // fade, so a failed request costs nothing visible — the pane never empties
    // to reveal an error, it simply keeps the voices it already has.
    //
    // Nothing here touches `.mono`, so the colour cycle carries on across the
    // swap uninterrupted; text arriving mid-cycle inherits whichever state the
    // pane is in and is already black or coloured on arrival.
    let swapping = false;
    async function swapWeave() {
      if (swapping) return;
      swapping = true;

      const link = document.getElementById('weave-link');
      const weaveEl = document.getElementById('weave');
      const sourcesEl = document.getElementById('sources');

      try {
        const next = await fetchWeave();

        // Photograph the outgoing set and hang it over the pane. The clones
        // drop their ids — the styling they need comes from .weave/.sources —
        // and the weave clone keeps its trimmed height so it trails the live
        // pane exactly rather than reflowing as it dissolves.
        const ghost = document.createElement('div');
        ghost.id = 'ghost';
        ghost.setAttribute('aria-hidden', 'true');
        for (const el of [weaveEl, sourcesEl]) {
          const copy = el.cloneNode(true);
          copy.removeAttribute('id');
          copy.style.maxHeight = el.style.maxHeight;
          ghost.appendChild(copy);
        }
        link.appendChild(ghost);

        // New text goes in underneath at zero opacity, then both are released
        // in the same frame so they cross rather than queue.
        weaveEl.style.transition = 'none';
        sourcesEl.style.transition = 'none';
        weaveEl.style.opacity = '0';
        sourcesEl.style.opacity = '0';
        paint(next);

        requestAnimationFrame(() => requestAnimationFrame(() => {
          weaveEl.style.transition = '';
          sourcesEl.style.transition = '';
          weaveEl.style.opacity = '1';
          sourcesEl.style.opacity = '1';
          ghost.style.opacity = '0';
        }));

        await new Promise(r => setTimeout(r, MELT + 100));
      } catch (err) {
        console.error('Cento weave refresh:', err);
      } finally {
        // Whatever happened, leave nothing hanging over the pane and no inline
        // opacity behind — a stranded ghost would sit there for good.
        const stale = link.querySelector('#ghost');
        if (stale) stale.remove();
        for (const el of [weaveEl, sourcesEl]) {
          el.style.transition = '';
          el.style.opacity = '';
        }
        swapping = false;
      }
    }

    async function load() {
      const weaveEl = document.getElementById('weave');
      try {
        paint(await fetchWeave());
      } catch (err) {
        weaveEl.innerHTML = '<p class="weave-msg">voices unavailable</p>';
        console.error('Cento weave:', err);
        return;
      }

      // Alternate between the four voices and one black hand. Toggled on the
      // pane so the weave and its attributions cross together. Started only
      // after a successful render so it never runs against the error state.
      if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        const pane = document.getElementById('weave-pane');
        setInterval(() => pane.classList.toggle('mono'), MONO_INTERVAL);
      }

      setInterval(swapWeave, SWAP_INTERVAL);
    }

    load();

  })();
  </script>

  <script>
  (function () {
    'use strict';

    // ── Issue 01 block: waves ────────────────────────────────
    // A dense field of light-blue lines. Each is a sum of three sines at
    // unrelated frequencies rather than one clean sine, so the curve wanders
    // instead of repeating — the difference between reading as water and
    // reading as a signal trace.
    //
    // Where this differs from the eight-line version: parameters now vary
    // smoothly with position down the block instead of being drawn at random
    // per line. At this density random parameters read as fizz; related ones
    // read as a field, with neighbours moving almost together and the whole
    // thing shearing slowly. The progressive `phase` is what makes the crests
    // travel down the block rather than each line pulsing in place.
    const host = document.querySelector('main');
    const canvas = document.getElementById('waves');
    if (!host || !canvas) return;
    const ctx = canvas.getContext('2d');

    const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const TAU = Math.PI * 2;

    // Spacing, not CPU, is the binding constraint — much below ~1.2px apart the
    // lines stop resolving and flatten into a wash. So the count is derived from
    // the height on offer rather than fixed: the field now spans the whole
    // column, and a fixed count would have come out half as dense as it was in
    // the top half alone.
    const SPACING = 1.2;
    const N_MIN = 40, N_MAX = 700;
    const STEP = 6;  // px between sampled points along a line

    // Lines are grouped by colour and each group stroked as one path, so the
    // frame costs a handful of stroke() calls rather than one per line.
    const COLOURS = ['#8fc7e8', '#a8d8f0', '#6fb0d8', '#9ccde6', '#7dbfe0', '#b3dcf2'];
    const ALPHA = 0.16;

    // Math.sin is the hot path at this count — a table is several times quicker
    // and the error is invisible at these amplitudes.
    const LUT_BITS = 12, LUT_N = 1 << LUT_BITS;
    const LUT = new Float32Array(LUT_N);
    for (let i = 0; i < LUT_N; i++) LUT[i] = Math.sin(i / LUT_N * TAU);
    const SCALE = LUT_N / TAU;
    const fsin = a => LUT[((a * SCALE) | 0) & (LUT_N - 1)];

    let lines = [];

    function buildLines(n) {
      lines = Array.from({ length: n }, (_, i) => {
        const f = i / (n - 1); // 0 at the top of the field, 1 at the bottom
        return {
          y: 0.02 + f * 0.96,
          amp: 0.010 + 0.013 * (0.5 + 0.5 * Math.sin(f * 5.1 + 0.7)),
          // Neighbouring lines sit slightly further through the same waveform,
          // which is what turns a stack of curves into a travelling swell.
          phase: f * 12.0,
          k1: 1.10 + 0.45 * Math.sin(f * 3.3),
          k2: 2.60 + 0.60 * Math.sin(f * 2.1 + 1.3),
          k3: 0.55 + 0.20 * Math.sin(f * 4.7 + 2.2),
          speed: 0.05 + 0.045 * Math.sin(f * 2.6 + 0.4),
          bucket: i % COLOURS.length,
        };
      });
    }
    const NORM = 1.00 + 0.42 + 0.65;


    // Flat colour, edge to edge — no end fade, so the lines carry their full
    // weight right to both sides of the block. Independent of size, so unlike
    // the gradients these need no rebuilding on resize.
    const STROKES = COLOURS.map(c => {
      const n = parseInt(c.slice(1), 16);
      return 'rgba(' + (n >> 16 & 255) + ',' + (n >> 8 & 255) + ',' +
             (n & 255) + ',' + ALPHA + ')';
    });

    let w = 0, h = 0;

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = host.clientWidth;
      h = host.clientHeight;
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
      // Required, not belt-and-braces: <canvas> is a replaced element, so
      // `inset: 0` with `width: auto` resolves to its intrinsic size (the
      // attributes just set, in CSS px) rather than to the container. Without
      // these the element is dpr times too large on a retina display and every
      // getBoundingClientRect measured against it is off by the same factor.
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      const n = Math.max(N_MIN, Math.min(N_MAX, Math.round(h / SPACING)));
      if (n !== lines.length) buildLines(n);
    }

    function draw(t) {
      if (!w || !h) return; // hidden (mobile) or not laid out yet
      ctx.clearRect(0, 0, w, h);
      ctx.lineWidth = 1;
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';

      for (let b = 0; b < COLOURS.length; b++) {
        ctx.beginPath();
        for (const ln of lines) {
          if (ln.bucket !== b) continue;
          const baseY = ln.y * h;
          const amp = ln.amp * h;
          const drift = ln.phase + t * ln.speed;
          for (let x = 0; x <= w; x += STEP) {
            const u = x / w;
            const v = 1.00 * fsin(u * ln.k1 * TAU + drift)
                    + 0.42 * fsin(u * ln.k2 * TAU + drift * 1.3)
                    + 0.65 * fsin(u * ln.k3 * TAU + drift * 0.7);
            const y = baseY + (v / NORM) * amp;
            if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
          }
        }
        ctx.strokeStyle = STROKES[b];
        ctx.stroke();
      }
    }

    let raf = null;
    const startedAt = performance.now();

    function frame(now) {
      draw((now - startedAt) / 1000);
      raf = requestAnimationFrame(frame);
    }

    function start() {
      if (raf || REDUCED) return;
      raf = requestAnimationFrame(frame);
    }
    function stop() {
      if (!raf) return;
      cancelAnimationFrame(raf);
      raf = null;
    }

    new ResizeObserver(() => { resize(); if (REDUCED) draw(0); }).observe(host);
    document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

    resize();
    if (REDUCED) draw(0); else start();
  })();
  </script>
