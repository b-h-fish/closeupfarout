<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Split — all 16 grids</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0b0812; color: #e8dcc0; font: 13px/1.5 ui-monospace, Menlo, monospace; padding: 14px; }
  header { margin-bottom: 12px; }
  h1 { font-size: 15px; font-weight: 600; letter-spacing: .06em; }
  .note { color: #8a7f96; margin-top: 6px; }
  .warn { color: #e0a05c; margin-top: 4px; max-width: 92ch; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 8px; }
  .row > i { font-style: normal; color: #6d6379; width: 5.5em; letter-spacing: .08em; }
  .row button {
    font: inherit; color: #b9ae94; background: #17111f; border: 1px solid #2e2438;
    padding: 4px 10px; cursor: pointer; letter-spacing: .04em;
  }
  .row button:hover { color: #f4edda; border-color: #4a3a58; }
  .row button[aria-pressed="true"] { color: #0b0812; background: #b9ae94; border-color: #b9ae94; }
  .sheet { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 14px; }
  .cap { display: flex; justify-content: space-between; gap: 8px; color: #b9ae94; padding: 0 2px 3px; }
  .cap b { color: #f4edda; font-weight: 600; }
  .cap .got { text-align: right; }
  /* Each frame is given a real viewport size, so the game inside lays out
     exactly as it would on that screen; the wrapper then scales it down. */
  .win { position: relative; overflow: hidden; border: 1px solid #2e2438; background: #000; }
  .win.off { border-color: #6d4a2a; }
  .win iframe { position: absolute; top: 0; left: 0; border: 0; transform-origin: 0 0; }
</style>
</head>
<body>
<header>
  <h1>HI | LO — all sixteen grids</h1>
  <div class="row" id="rowWin"><i>this</i></div>
  <div class="row" id="rowPhone"><i>phone</i></div>
  <div class="row" id="rowDesk"><i>desktop</i></div>
  <div class="row" id="rowTablet"><i>tablet</i></div>
  <div class="row" id="rowTv"><i>tv</i></div>
  <div class="row" id="rowScene"><i>theme</i></div>
  <div class="note" id="meta">measuring…</div>
  <div class="warn" id="warn"></div>
</header>
<div class="sheet" id="sheet"></div>

<script src="/split-stack/layout.js"></script>
<script>
(function () {
  // Captured before the sheet can scroll, so "this window" gets the true viewport.
  var TRUE_W = window.innerWidth, TRUE_H = window.innerHeight;
  var DPR = window.devicePixelRatio || 1;
  var SEED = 424242;
  /* Index into SCENES in scenes.js — the same number the page takes as
     ?scene=, so a panel shows exactly what that link would. */
  var SCENES = [{ i:0, label:'Dusk Terrace' }, { i:1, label:'Palm Court' },
                { i:2, label:'Space Port' }, { i:3, label:'Jungle Hike' }];
  var SCENE = 0;
  var L = window.HiLoLayout;

  /* Sizes are the viewport the browser actually leaves a page — device height
     less its chrome — not the raw screen, since that is what the game reads.
     `dpr` is what the real device reports; this display may not match it. */
  var DEVICES = [
    { g:'rowWin',    label:'This window',    w:TRUE_W, h:TRUE_H, dpr:DPR },
    { g:'rowPhone',  label:'iPhone SE',      w:375,  h:553,  dpr:2, coarse:1 },
    { g:'rowPhone',  label:'iPhone 15',      w:390,  h:664,  dpr:3, coarse:1 },
    { g:'rowPhone',  label:'15 Pro Max',     w:430,  h:745,  dpr:3, coarse:1 },
    { g:'rowPhone',  label:'iPhone SE ↻',    w:667,  h:375,  dpr:2, coarse:1 },
    { g:'rowPhone',  label:'iPhone 15 ↻',    w:844,  h:390,  dpr:3, coarse:1 },
    { g:'rowPhone',  label:'Pro Max ↻',      w:932,  h:430,  dpr:3, coarse:1 },
    /* A desktop window can be any shape, and a tall narrow one is the shape
       none of the device sizes reach — nothing else here is portrait with a
       mouse, which is what the layout keys on. */
    { g:'rowDesk',   label:'Tall 700',       w:700,  h:900,  dpr:2, coarse:0 },
    { g:'rowDesk',   label:'Tall 900',       w:900,  h:1100, dpr:2, coarse:0 },
    { g:'rowDesk',   label:'Short 1152',     w:1152, h:547,  dpr:2, coarse:0 },
    { g:'rowDesk',   label:'Laptop 1440',    w:1440, h:780,  dpr:2, coarse:0 },
    { g:'rowTablet', label:'iPad mini',      w:744,  h:1005, dpr:2, coarse:1 },
    { g:'rowTablet', label:'iPad Air',       w:820,  h:1052, dpr:2, coarse:1 },
    { g:'rowTablet', label:'iPad Pro 13',    w:1024, h:1238, dpr:2, coarse:1 },
    { g:'rowTablet', label:'iPad mini ↻',    w:1133, h:616,  dpr:2, coarse:1 },
    { g:'rowTablet', label:'iPad Air ↻',     w:1180, h:692,  dpr:2, coarse:1 },
    { g:'rowTablet', label:'iPad Pro 13 ↻',  w:1366, h:896,  dpr:2, coarse:1 },
    { g:'rowTv',     label:'720p',           w:1280, h:720,  dpr:1, coarse:0 },
    { g:'rowTv',     label:'1080p',          w:1920, h:1080, dpr:1, coarse:0 },
    { g:'rowTv',     label:'4K',             w:3840, h:2160, dpr:1, coarse:0 }
  ];

  var sheet = document.getElementById('sheet');
  var meta  = document.getElementById('meta');
  var warn  = document.getElementById('warn');
  var timers = [];

  DEVICES.forEach(function (d) {
    var b = document.createElement('button');
    b.textContent = d.label;
    b.setAttribute('aria-pressed', 'false');
    b.addEventListener('click', function () { build(d); });
    d.btn = b;
    document.getElementById(d.g).appendChild(b);
  });

  var current = DEVICES[0];
  SCENES.forEach(function (sc) {
    var b = document.createElement('button');
    b.textContent = sc.label;
    b.setAttribute('aria-pressed', sc.i === SCENE ? 'true' : 'false');
    b.addEventListener('click', function () { SCENE = sc.i; build(current); });
    sc.btn = b;
    document.getElementById('rowScene').appendChild(b);
  });

  /* Scaling is chosen per grid by pixel density, not by screen size, and the
     only thing that matters is whether it is 2x or better. A frame runs at this
     display's density whatever size we give it, so where the two disagree the
     panel is not that device — work out exactly which grids, rather than
     casting doubt over all sixteen. */
  function unfaithful(dev) {
    var bad = {};
    if (!L || (dev.dpr >= 2) === (DPR >= 2)) return bad;
    for (var c = 1; c <= 4; c++) for (var r = 1; r <= 4; r++) {
      var co = !!dev.coarse;
      var a = L.game(c, r, dev.w, dev.h, dev.dpr, co);
      var b = L.game(c, r, dev.w, dev.h, DPR, co);
      if (a.scale.toFixed(4) !== b.scale.toFixed(4) || a.uiSide !== b.uiSide) bad[c + 'x' + r] = true;
    }
    return bad;
  }

  function build(dev) {
    timers.forEach(clearTimeout); timers = [];
    sheet.textContent = '';
    current = dev;
    DEVICES.forEach(function (d) { d.btn.setAttribute('aria-pressed', d === dev ? 'true' : 'false'); });
    SCENES.forEach(function (sc) { sc.btn.setAttribute('aria-pressed', sc.i === SCENE ? 'true' : 'false'); });

    var VW = dev.w, VH = dev.h;
    var colW = (sheet.getBoundingClientRect().width - 3*12) / 4;
    var k = colW / VW;

    meta.textContent =
      dev.label + ' — ' + VW + ' × ' + VH + ' css px at ' + dev.dpr + '×' +
      '  ·  ' + SCENES[SCENE].label +
      '  ·  this display is ' + DPR + '×' +
      '  ·  panels are full size shown at ' + (k*100).toFixed(1) + '%' +
      '  ·  seed ' + SEED;

    var bad = unfaithful(dev), names = Object.keys(bad);
    warn.textContent = names.length
      ? 'This display is ' + DPR + '× and the ' + dev.label + ' is ' + dev.dpr + '×. Continuous '
        + 'scaling turns on at 2×, so ' + names.length + ' panel' + (names.length > 1 ? 's' : '')
        + ' below (' + names.join(', ') + ') will not match the real device. The rest are faithful.'
      : (!L ? 'layout.js did not load, so density differences cannot be checked.' : '');

    var pointer = (dev.coarse === undefined) ? null : dev.coarse;
    for (var r = 1; r <= 4; r++) for (var c = 1; c <= 4; c++)
      add(c, r, VW, VH, k, bad[c + 'x' + r], pointer);
  }

  function add(c, r, VW, VH, k, off, COARSE) {
    var tile = document.createElement('div');

    var cap = document.createElement('div');
    cap.className = 'cap';
    cap.innerHTML = '<b>' + c + ' × ' + r + '</b><span class="got">…</span>';
    tile.appendChild(cap);

    var win = document.createElement('div');
    win.className = 'win' + (off ? ' off' : '');
    win.style.width = Math.round(VW * k) + 'px';
    win.style.height = Math.round(VH * k) + 'px';
    tile.appendChild(win);
    sheet.appendChild(tile);

    // staggered, so sixteen canvases don't all start their loops at once
    timers.push(setTimeout(function () {
      var f = document.createElement('iframe');
      f.width = VW; f.height = VH;
      f.style.width = VW + 'px';
      f.style.height = VH + 'px';
      f.style.transform = 'scale(' + k + ')';
      f.loading = 'eager';
      f.src = '/split-stack/?seed=' + SEED + '&grid=' + c + 'x' + r + '&scene=' + SCENE
            + (COARSE === null ? '' : '&coarse=' + COARSE);
      // Read back what the frame actually measured. If it does not match the
      // size we asked for, the panel is a different layout from the real thing
      // and the sheet is lying — so say so on the panel rather than hide it.
      f.addEventListener('load', function () {
        var got = cap.querySelector('.got');
        try {
          var iw = f.contentWindow.innerWidth, ih = f.contentWindow.innerHeight;
          var ok = (iw === VW && ih === VH);
          got.textContent = (ok ? iw + '×' + ih : iw + '×' + ih + ' ✗ not ' + VW + '×' + VH)
                          + (off ? '  ✳ wrong density' : '');
          got.style.color = !ok ? '#e06b5c' : (off ? '#e0a05c' : '#6a9f6a');
        } catch (e) { got.textContent = 'unreadable'; }
      });
      win.appendChild(f);
    }, (sheet.children.length - 1) * 220));
  }

  build(DEVICES[0]);
})();
</script>
</body>
</html>
