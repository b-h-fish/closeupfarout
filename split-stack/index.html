<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Split | Pixel Card Game</title>
<meta name="description" content="Split: a card game about reading what is left in the deck.">
<!-- The game's own icon: the S from the mark, cut. The cut falls after the
     letter's waist rather than through it — the wordmark halves its glyphs on
     the exact middle, but on an S that middle IS the waist, and covering it
     costs the letter the stroke that makes it an S. Cutting a row lower leaves
     the waist whole and red, meeting the rule head on. 5x7 at k=2 plus a 2px
     rule is exactly 16, so 32 and 48 are whole multiples of the same picture
     rather than resamples of it. -->
<link rel="icon" type="image/png" sizes="48x48" href="/split-stack/icon-48.png">
<link rel="icon" type="image/png" sizes="32x32" href="/split-stack/icon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/split-stack/icon-16.png">
<link rel="icon" href="/split-stack/favicon.ico" sizes="any">
<link rel="apple-touch-icon" sizes="180x180" href="/split-stack/apple-touch-icon.png">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #07070c;
    -webkit-tap-highlight-color: transparent;
  }
  body { display: flex; align-items: center; justify-content: center; }
  /* The setting is drawn on its own layer at a scale that never changes with
     the grid; the board is drawn over it at whatever scale that grid takes. */
  #stack { position: relative; }
  #stack canvas { position: absolute; top: 0; left: 0; }
  #bg { z-index: 0; }
  #stage { z-index: 1; }
  /* Integer-scaled pixels, never smoothed. The scale factor is chosen in JS so
     one logical pixel is always a whole number of device pixels. */
  #bg, #stage {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    touch-action: manipulation;
  }
  #stage:focus-visible { outline: 2px solid #f2ead6; outline-offset: 2px; }
  .vh {
    position: absolute; width: 1px; height: 1px;
    margin: -1px; padding: 0; overflow: hidden;
    clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
  }
</style>
</head>
<body>
  <div id="stack">
    <canvas id="bg" width="640" height="400" aria-hidden="true"></canvas>
    <canvas id="stage" width="640" height="400" tabindex="0"
            aria-label="Split. Arrow keys move between piles, Enter selects, then H for high, L for low, S for split."></canvas>
  </div>
  <div id="say" class="vh" role="status" aria-live="polite"></div>

  <!-- Absolute, not relative. Relative paths resolve against the URL rather
       than the directory, so at /split (no trailing slash) they would look for
       /pixel.js and the game would come up blank. -->
  <script src="/split-stack/pixel.js"></script>
  <script src="/split-stack/layout.js"></script>
  <script src="/split-stack/scenes.js"></script>
  <script src="/split-stack/game.js"></script>
  <script src="/split-stack/app.js"></script>
</body>
</html>
