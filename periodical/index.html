<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Issue-01 — closeupfarout</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@100;300&family=Space+Mono:ital@0;1&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink: #1a1008;
      --paper: #ffffff;
      --rule: #d8d4cc;
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--paper);
      font-family: 'Space Mono', monospace;
      color: var(--ink);
    }

    /* ── NAV ── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2rem;
      height: 80px;
      background: var(--paper);
      border-bottom: 1px solid var(--rule);
    }

    .nav-wordmark {
      font-family: 'Josefin Sans', sans-serif;
      font-weight: 100;
      font-size: 1.4rem;
      letter-spacing: 0.15em;
      text-transform: lowercase;
      color: var(--ink);
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      list-style: none;
      gap: 2rem;
    }

    .nav-links a {
      font-size: 0.85rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink);
      text-decoration: none;
      opacity: 0.6;
      transition: opacity 0.2s;
    }

    .nav-links a:hover,
    .nav-links a.active { opacity: 1; }

    /* ── CONTENT ── */
    .page {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      padding-top: 80px;
    }

    .announcement {
      text-align: center;
    }

    .announcement .label {
      font-size: 0.65rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      opacity: 0.4;
      margin-bottom: 1rem;
    }

    .announcement h2 {
      font-family: 'Josefin Sans', sans-serif;
      font-weight: 100;
      font-size: clamp(1.4rem, 4vw, 2.8rem);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      line-height: 1.4;
    }

    /* ── MOBILE ── */
    @media (max-width: 768px) {
      nav {
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 110px;
        gap: 0.6rem;
      }

      .nav-links {
        gap: 1.4rem;
        justify-content: center;
      }

      .nav-links a { font-size: 0.75rem; }

      .page { padding-top: 110px; }
    }
  </style>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
</head>
<body>

  <nav>
    <a class="nav-wordmark" href="/">closeupfarout</a>
    <ul class="nav-links">
      <li><a href="/cento/">Cento</a></li>
      <li><a href="/periodical/" class="active">Issue-01</a></li>
    </ul>
  </nav>

  <div class="page">
    <div class="announcement">
      <h2>Issue 01 — Summer 2026</h2>
    </div>
  </div>

</body>
</html>
