<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Waver — closeupfarout</title>
  <style>
    /* ── WAVER ────────────────────────────────────────────────
       The working copy of the wave field. /wave123 holds the same field kept
       as a reference and is not edited; this is the one that changes, so a
       diff between the two reads as a log of everything this page becomes.

       Still deliberately self-contained: no shared stylesheet, no shared
       script, nothing here reaching into ../index.html. */

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #090909;
    }

    /* The field's host: the script measures this for its size, and the canvas
       is positioned against it. */
    main {
      position: fixed;
      inset: 0;
      background: #090909;
    }

    /* Must stay absolutely positioned. In flow a <canvas> is a replaced element
       whose intrinsic size comes from its width/height attributes, and it would
       size the layout rather than overlay it. */
    #waves {
      position: absolute;
      inset: 0;
      display: block;
      pointer-events: none;
    }

    .grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 50;
      opacity: 0.04;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      background-size: 200px 200px;
    }

    /* The page's only chrome, and it is absent by default — see the controls
       block in the script for when it comes and goes. Clickable only while
       visible, so an invisible bar can never swallow a click meant for the
       page. Sits above the grain, or the grain would veil it. */
    .modes {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      z-index: 60;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.3rem 1.7rem;
      padding: 1.4rem 1.2rem;
      padding-bottom: calc(1.4rem + env(safe-area-inset-bottom, 0px));
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.65s ease;
      font: 11px/1 ui-sans-serif, -apple-system, 'Helvetica Neue', Helvetica, sans-serif;
    }
    .modes.awake { opacity: 1; pointer-events: auto; }

    .modes button {
      -webkit-appearance: none; appearance: none;
      background: none;
      border: 0;
      padding: 0.4rem 0.2rem;
      font: inherit;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: #8fc7e8;
      opacity: 0.5;
      cursor: pointer;
      transition: opacity 0.25s ease, color 0.25s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .modes button:hover { opacity: 0.85; }
    .modes button[aria-pressed="true"] { opacity: 1; color: #dceffa; }
    .modes button:focus-visible {
      outline: 1px solid rgba(220, 239, 250, 0.45);
      outline-offset: 5px;
    }

    @media (prefers-reduced-motion: reduce) {
      .modes { transition: none; }
    }
  </style>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
</head>
<body>

  <main><canvas id="waves" aria-hidden="true"></canvas></main>

  <div class="grain"></div>

  <nav class="modes" id="modes" aria-label="Field modes"></nav>

  <script>
  (function () {
    'use strict';

    // A dense field of light-blue lines. Each is a sum of three sines at
    // unrelated frequencies rather than one clean sine, so the curve wanders
    // instead of repeating — the difference between reading as water and
    // reading as a signal trace.
    //
    // Parameters vary smoothly with position down the field rather than being
    // drawn at random per line. At this density random parameters read as fizz;
    // related ones read as a field, with neighbours moving almost together and
    // the whole thing shearing slowly. The progressive `phase` is what makes
    // the crests travel down the field rather than each line pulsing in place.
    const host = document.querySelector('main');
    const canvas = document.getElementById('waves');
    if (!host || !canvas) return;
    const ctx = canvas.getContext('2d');

    const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const TAU = Math.PI * 2;

    // Spacing, not CPU, is the binding constraint — much below ~1.2px apart the
    // lines stop resolving and flatten into a wash. So the count is derived
    // from the height on offer rather than fixed.
    const SPACING = 1.2;
    const N_MIN = 40, N_MAX = 750;

    // The field runs past the top and bottom of the screen by more than any
    // line's amplitude, so a line swinging can never uncover an edge. At
    // 0.02..0.98 the outermost line pulled away from the top and left a band
    // of background behind it; the count scales with the span to hold SPACING.
    const SPAN_TOP = -0.035, SPAN_BOT = 1.035;
    const SPAN = SPAN_BOT - SPAN_TOP;
    const STEP = 6;  // px between sampled points along a line

    // ── the modes ────────────────────────────────────────────────────
    // A mode is only numbers, so this list is both the settings and the
    // version history: a look worth keeping becomes a row rather than a copy
    // of the page, and a fix here reaches every one of them.
    //
    // On the colour wash itself: hue is a smooth field over the whole screen
    // rather than a value held by a line. A line runs through several hues on
    // its way across, and the boundaries between them are that field's own
    // contours — curved and soft, instead of the straight edges a grid of
    // cells leaves behind. Two waves travel at different angles and speeds,
    // and their sum is quasi-periodic, so patches of colour gather, slide
    // across and dissolve rather than cycling back to an arrangement already
    // seen. Both terms travel: that is what carries the colour over the
    // screen instead of making it pulse in place.
    const MODES = [
      { id: 'wash', label: 'Wash',
        alpha: 0.20,     // weight of a single line
        sat: 65,         // the original shade's own saturation and lightness:
        light: 73,       // #8fc7e8 is hsl(202, 66%, 73%)
        blue: 202,       // the hue a mix of zero returns to, so zero is not an
                         // approximation of the original look, it is the look
        spread: 75,      // degrees of hue the wash carries at its fullest
        bands: 48,       // hue quantised this finely: one stroke() per band,
                         // ~7 degrees apart, which does not read as a step
        rate: 0.70 },    // pace of the whole wash
    ];

    // The mode in force, and the handful of values derived from it. Switching
    // recomputes these and nothing else — the lines are not rebuilt and the
    // clock is not reset, so the field carries on through a change rather
    // than restarting into it.
    let M = MODES[0];
    let W1, W2, WM, TURN, STROKES;

    function applyMode(mode) {
      M = mode;
      // The wash's two waves, the turn of the wheel and the mix field all
      // scale off one rate, so they hold their proportion at any pace. The
      // field's own motion is deliberately outside it: that is per-line.
      W1 = 0.26 * M.rate;
      W2 = 0.19 * M.rate;
      WM = 0.13 * M.rate;
      TURN = 6 * M.rate;      // degrees/sec the wheel turns
      // One stroke per band, at the band's middle hue. Within a mode these
      // never change — the wash moves segments between bands rather than
      // recolouring a band.
      STROKES = Array.from({ length: M.bands }, (_, j) =>
        'hsla(' + ((j + 0.5) / M.bands * 360).toFixed(1) + ',' +
        M.sat + '%,' + M.light + '%,' + M.alpha + ')');
    }

    // How far the wash takes over, as a second slow field of its own. It runs
    // at a different angle and speed from the hue, so the two never lock into
    // step. The bias leaves roughly a third of the screen sitting at zero,
    // which is what keeps patches of the original blue standing while colour
    // slides past them.
    function mixAt(u, v, t) {
      const m = fsin((u * 0.90 - v * 1.40) * TAU - t * WM) * 0.75 + 0.35;
      return m < 0 ? 0 : m > 1 ? 1 : m;
    }

    function hueAt(u, v, t) {
      const q = 1.00 * fsin((u * 1.30 + v * 0.80) * TAU - t * W1)
              + 0.65 * fsin((u * 2.10 - v * 1.70) * TAU - t * W2);
      const wash = t * TURN + (q / 1.65) * M.spread;
      // Hue is a circle, so take the short way round from blue to the wash.
      let d = ((wash - M.blue) % 360 + 360) % 360;
      if (d > 180) d -= 360;
      return M.blue + d * mixAt(u, v, t);
    }

    // Math.sin is the hot path at this count — a table is several times quicker
    // and the error is invisible at these amplitudes.
    const LUT_BITS = 12, LUT_N = 1 << LUT_BITS;
    const LUT = new Float32Array(LUT_N);
    for (let i = 0; i < LUT_N; i++) LUT[i] = Math.sin(i / LUT_N * TAU);
    const SCALE = LUT_N / TAU;
    const fsin = a => LUT[((a * SCALE) | 0) & (LUT_N - 1)];

    let lines = [];

    function buildLines(n) {
      lines = Array.from({ length: n }, (_, i) => {
        const f = i / (n - 1); // 0 at the top of the field, 1 at the bottom
        return {
          y: SPAN_TOP + f * SPAN,
          amp: 0.010 + 0.013 * (0.5 + 0.5 * Math.sin(f * 5.1 + 0.7)),
          // Neighbouring lines sit slightly further through the same waveform,
          // which is what turns a stack of curves into a travelling swell.
          phase: f * 12.0,
          k1: 1.10 + 0.45 * Math.sin(f * 3.3),
          k2: 2.60 + 0.60 * Math.sin(f * 2.1 + 1.3),
          k3: 0.55 + 0.20 * Math.sin(f * 4.7 + 2.2),
          speed: 0.05 + 0.045 * Math.sin(f * 2.6 + 0.4),
        };
      });
    }
    const NORM = 1.00 + 0.42 + 0.65;

    let w = 0, h = 0;

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = host.clientWidth;
      h = host.clientHeight;
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
      // Required, not belt-and-braces: <canvas> is a replaced element, so
      // `inset: 0` with `width: auto` resolves to its intrinsic size (the
      // attributes just set, in CSS px) rather than to the container. Without
      // these the element is dpr times too large on a retina display.
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      const n = Math.max(N_MIN, Math.min(N_MAX, Math.round(h * SPAN / SPACING)));
      if (n !== lines.length) buildLines(n);
    }

    function draw(t) {
      if (!w || !h) return; // not laid out yet
      ctx.clearRect(0, 0, w, h);
      ctx.lineWidth = 1;
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';

      // One path per band, built in a single pass over the lines. A segment
      // joins the band its own position falls in, so a line changes colour
      // partway across wherever it crosses a contour of the wash.
      const bands = M.bands;
      const paths = new Array(bands);
      for (let j = 0; j < bands; j++) paths[j] = new Path2D();

      for (const ln of lines) {
        const baseY = ln.y * h;
        const amp = ln.amp * h;
        const drift = ln.phase + t * ln.speed;
        let run = -1, px = 0, py = 0;

        for (let x = 0; ; x += STEP) {
          // The last sample lands exactly on the right edge whatever STEP
          // divides into, rather than up to STEP short of it.
          const last = x >= w;
          const sx = last ? w : x;
          const u = sx / w;
          const v = 1.00 * fsin(u * ln.k1 * TAU + drift)
                  + 0.42 * fsin(u * ln.k2 * TAU + drift * 1.3)
                  + 0.65 * fsin(u * ln.k3 * TAU + drift * 0.7);
          const sy = baseY + (v / NORM) * amp;

          // The wash is sampled at the segment's own position, so colour
          // follows the line as it rises and falls rather than sitting in a
          // fixed layer the line passes behind.
          let g = (hueAt(u, sy / h, t) / 360 * bands) | 0;
          g = ((g % bands) + bands) % bands;   // hue is a circle, and negative

          if (run < 0) {
            paths[g].moveTo(sx, sy);
            run = g;
          } else if (g !== run) {
            // The crossing segment goes into both runs. Starting the new one
            // at this point alone would leave a STEP-wide gap at every colour
            // change, and those gaps would trace the contours in background.
            paths[run].lineTo(sx, sy);
            paths[g].moveTo(px, py);
            paths[g].lineTo(sx, sy);
            run = g;
          } else {
            paths[g].lineTo(sx, sy);
          }

          px = sx; py = sy;
          if (last) break;
        }
      }

      for (let j = 0; j < bands; j++) {
        ctx.strokeStyle = STROKES[j];
        ctx.stroke(paths[j]);
      }
    }

    let raf = null;
    const startedAt = performance.now();

    function frame(now) {
      draw((now - startedAt) / 1000);
      raf = requestAnimationFrame(frame);
    }

    function start() {
      if (raf || REDUCED) return;
      raf = requestAnimationFrame(frame);
    }
    function stop() {
      if (!raf) return;
      cancelAnimationFrame(raf);
      raf = null;
    }

    new ResizeObserver(() => { resize(); if (REDUCED) draw(0); }).observe(host);
    document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

    // A mode named in the URL wins over the default, so a link opens the one
    // the sender was looking at rather than whatever the default happens to be.
    const asked = new URLSearchParams(location.search).get('mode');
    applyMode(MODES.find(m => m.id === asked) || MODES[0]);

    resize();
    if (REDUCED) draw(0); else start();

    /* ── the controls ──────────────────────────────────────────────────
       The page's only chrome. It surfaces on any sign of someone there — a
       pointer moving, a touch, a key — and withdraws once nothing has
       happened for a few seconds, so the field is unaccompanied whenever it
       is simply being watched.

       Idleness is read from a timestamp on a slow interval rather than by
       resetting a timer on every event: pointermove fires hundreds of times
       a second, and clearing and rearming a timeout on each one is a lot of
       churn for something that only needs checking three times a second.
       ───────────────────────────────────────────────────────────────── */
    const bar = document.getElementById('modes');
    if (bar) {
      const IDLE = 2600;    // ms of stillness before the controls withdraw
      let lastAt = 0, awake = false;

      function wake() {
        lastAt = performance.now();
        if (!awake) { awake = true; bar.classList.add('awake'); }
      }

      setInterval(() => {
        if (!awake) return;
        // Never pull the bar out from under the keyboard: a control that
        // faded while focused would leave the focus ring on nothing.
        if (bar.contains(document.activeElement)) { lastAt = performance.now(); return; }
        if (performance.now() - lastAt > IDLE) {
          awake = false;
          bar.classList.remove('awake');
        }
      }, 300);

      function select(i) {
        applyMode(MODES[i]);
        for (let j = 0; j < bar.children.length; j++) {
          bar.children[j].setAttribute('aria-pressed', String(j === i));
        }
        // The mode travels in the URL. replaceState rather than pushState:
        // the back button should leave the page, not walk back through every
        // mode tried along the way.
        const url = new URL(location.href);
        url.searchParams.set('mode', MODES[i].id);
        history.replaceState(null, '', url);
        if (REDUCED) draw(0);
        wake();
      }

      MODES.forEach((m, i) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.textContent = m.label;
        b.setAttribute('aria-pressed', String(m === M));
        b.addEventListener('click', () => select(i));
        bar.appendChild(b);
      });

      ['pointermove', 'pointerdown', 'keydown', 'wheel', 'touchstart']
        .forEach(ev => window.addEventListener(ev, wake, { passive: true }));
      bar.addEventListener('focusin', wake);

      // Shown on arrival and then left to withdraw — enough to be noticed
      // without being insisted on.
      wake();
    }
  })();
  </script>

</body>
</html>
