<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Waver — closeupfarout</title>
  <style>
    /* ── WAVER ────────────────────────────────────────────────
       The working copy of the wave field. /wave123 holds the same field kept
       as a reference and is not edited; this is the one that changes, so a
       diff between the two reads as a log of everything this page becomes.

       Still deliberately self-contained: no shared stylesheet, no shared
       script, nothing here reaching into ../index.html. */

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #090909;
    }

    /* The field's host: the script measures this for its size, and the canvas
       is positioned against it. */
    main {
      position: fixed;
      inset: 0;
      background: #090909;
    }

    /* Must stay absolutely positioned. In flow a <canvas> is a replaced element
       whose intrinsic size comes from its width/height attributes, and it would
       size the layout rather than overlay it. */
    #waves {
      position: absolute;
      inset: 0;
      display: block;
      pointer-events: none;
    }

    .grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 50;
      opacity: 0.04;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      background-size: 200px 200px;
    }
  </style>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
</head>
<body>

  <main><canvas id="waves" aria-hidden="true"></canvas></main>

  <div class="grain"></div>

  <script>
  (function () {
    'use strict';

    // A dense field of light-blue lines. Each is a sum of three sines at
    // unrelated frequencies rather than one clean sine, so the curve wanders
    // instead of repeating — the difference between reading as water and
    // reading as a signal trace.
    //
    // Parameters vary smoothly with position down the field rather than being
    // drawn at random per line. At this density random parameters read as fizz;
    // related ones read as a field, with neighbours moving almost together and
    // the whole thing shearing slowly. The progressive `phase` is what makes
    // the crests travel down the field rather than each line pulsing in place.
    const host = document.querySelector('main');
    const canvas = document.getElementById('waves');
    if (!host || !canvas) return;
    const ctx = canvas.getContext('2d');

    const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const TAU = Math.PI * 2;

    // Spacing, not CPU, is the binding constraint — much below ~1.2px apart the
    // lines stop resolving and flatten into a wash. So the count is derived
    // from the height on offer rather than fixed.
    const SPACING = 1.2;
    const N_MIN = 40, N_MAX = 750;

    // The field runs past the top and bottom of the screen by more than any
    // line's amplitude, so a line swinging can never uncover an edge. At
    // 0.02..0.98 the outermost line pulled away from the top and left a band
    // of background behind it; the count scales with the span to hold SPACING.
    const SPAN_TOP = -0.035, SPAN_BOT = 1.035;
    const SPAN = SPAN_BOT - SPAN_TOP;
    const STEP = 6;  // px between sampled points along a line

    const ALPHA = 0.20;

    // Colour comes from where a segment sits on screen now, not from which
    // line it belongs to. The screen is a grid of cells, each a 60th of it,
    // and every cell takes a random hue that is rerolled on a fixed beat.
    //
    // Cells draw from a small set of hues rather than each holding its own:
    // it keeps the frame to one stroke() per hue, and neighbours landing on
    // the same colour breaks up the grid that 60 separate hues would show.
    const COLS = 10, ROWS = 6;      // 60 cells, so each is a 60th of the screen
    const CELLS = COLS * ROWS;
    const HUES = 12;                // distinct colours alive at any one moment
    const CYCLE = 1.2;              // seconds between rerolls
    const SAT = 65, LIGHT = 73;     // the old palette's weight, as HSL

    // Deterministic noise, so a cell's colour is a pure function of (cell,
    // beat): nothing to store, nothing to rebuild, and the reroll happens by
    // the beat number changing rather than by a timer firing.
    function hash(i, beat) {
      let x = (i * 374761393 + beat * 668265263) | 0;
      x = Math.imul(x ^ (x >>> 13), 1274126177);
      return ((x ^ (x >>> 16)) >>> 0) / 4294967296;
    }

    // Math.sin is the hot path at this count — a table is several times quicker
    // and the error is invisible at these amplitudes.
    const LUT_BITS = 12, LUT_N = 1 << LUT_BITS;
    const LUT = new Float32Array(LUT_N);
    for (let i = 0; i < LUT_N; i++) LUT[i] = Math.sin(i / LUT_N * TAU);
    const SCALE = LUT_N / TAU;
    const fsin = a => LUT[((a * SCALE) | 0) & (LUT_N - 1)];

    let lines = [];

    function buildLines(n) {
      lines = Array.from({ length: n }, (_, i) => {
        const f = i / (n - 1); // 0 at the top of the field, 1 at the bottom
        return {
          y: SPAN_TOP + f * SPAN,
          amp: 0.010 + 0.013 * (0.5 + 0.5 * Math.sin(f * 5.1 + 0.7)),
          // Neighbouring lines sit slightly further through the same waveform,
          // which is what turns a stack of curves into a travelling swell.
          phase: f * 12.0,
          k1: 1.10 + 0.45 * Math.sin(f * 3.3),
          k2: 2.60 + 0.60 * Math.sin(f * 2.1 + 1.3),
          k3: 0.55 + 0.20 * Math.sin(f * 4.7 + 2.2),
          speed: 0.05 + 0.045 * Math.sin(f * 2.6 + 0.4),
        };
      });
    }
    const NORM = 1.00 + 0.42 + 0.65;

    // Flat colour, edge to edge — no end fade, so the lines carry their full
    // weight right to both sides.
    const strokeFor = hue =>
      'hsla(' + hue.toFixed(1) + ',' + SAT + '%,' + LIGHT + '%,' + ALPHA + ')';

    let w = 0, h = 0;

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = host.clientWidth;
      h = host.clientHeight;
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
      // Required, not belt-and-braces: <canvas> is a replaced element, so
      // `inset: 0` with `width: auto` resolves to its intrinsic size (the
      // attributes just set, in CSS px) rather than to the container. Without
      // these the element is dpr times too large on a retina display.
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      const n = Math.max(N_MIN, Math.min(N_MAX, Math.round(h * SPAN / SPACING)));
      if (n !== lines.length) buildLines(n);
    }

    function draw(t) {
      if (!w || !h) return; // not laid out yet
      ctx.clearRect(0, 0, w, h);
      ctx.lineWidth = 1;
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';

      // This beat's colour. The hue set and each cell's place in it are
      // rerolled together, so the whole screen turns over at once.
      const beat = Math.floor(t / CYCLE);
      const hues = new Array(HUES);
      for (let j = 0; j < HUES; j++) hues[j] = hash(j, beat) * 360;
      const groupOf = new Uint8Array(CELLS);
      for (let c = 0; c < CELLS; c++) groupOf[c] = (hash(c + 9973, beat) * HUES) | 0;

      // One path per hue, built in a single pass over the lines. A segment
      // joins the path of whatever cell it lands in, so a line changes colour
      // partway across wherever it crosses a cell edge.
      const paths = new Array(HUES);
      for (let j = 0; j < HUES; j++) paths[j] = new Path2D();

      for (const ln of lines) {
        const baseY = ln.y * h;
        const amp = ln.amp * h;
        const drift = ln.phase + t * ln.speed;
        let run = -1, px = 0, py = 0;

        for (let x = 0; ; x += STEP) {
          // The last sample lands exactly on the right edge whatever STEP
          // divides into, rather than up to STEP short of it.
          const last = x >= w;
          const sx = last ? w : x;
          const u = sx / w;
          const v = 1.00 * fsin(u * ln.k1 * TAU + drift)
                  + 0.42 * fsin(u * ln.k2 * TAU + drift * 1.3)
                  + 0.65 * fsin(u * ln.k3 * TAU + drift * 0.7);
          const sy = baseY + (v / NORM) * amp;

          // Lines that sit off the top or bottom take the nearest cell's
          // colour; they are drawn only to keep the edges covered.
          let row = (sy / h * ROWS) | 0;
          if (row < 0) row = 0; else if (row >= ROWS) row = ROWS - 1;
          let col = (u * COLS) | 0;
          if (col >= COLS) col = COLS - 1;
          const g = groupOf[row * COLS + col];

          if (run < 0) {
            paths[g].moveTo(sx, sy);
            run = g;
          } else if (g !== run) {
            // The crossing segment goes into both runs. Starting the new one
            // at this point alone would leave a STEP-wide gap on every cell
            // boundary, and the seams would read as a grid in background.
            paths[run].lineTo(sx, sy);
            paths[g].moveTo(px, py);
            paths[g].lineTo(sx, sy);
            run = g;
          } else {
            paths[g].lineTo(sx, sy);
          }

          px = sx; py = sy;
          if (last) break;
        }
      }

      for (let j = 0; j < HUES; j++) {
        ctx.strokeStyle = strokeFor(hues[j]);
        ctx.stroke(paths[j]);
      }
    }

    let raf = null;
    const startedAt = performance.now();

    function frame(now) {
      draw((now - startedAt) / 1000);
      raf = requestAnimationFrame(frame);
    }

    function start() {
      if (raf || REDUCED) return;
      raf = requestAnimationFrame(frame);
    }
    function stop() {
      if (!raf) return;
      cancelAnimationFrame(raf);
      raf = null;
    }

    new ResizeObserver(() => { resize(); if (REDUCED) draw(0); }).observe(host);
    document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

    resize();
    if (REDUCED) draw(0); else start();
  })();
  </script>

</body>
</html>
