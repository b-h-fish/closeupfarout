<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cento — Close Up Far Out</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Cinzel:wght@400&family=Abril+Fatface&family=Libre+Baskerville:ital@1&family=Spectral:ital,wght@0,400;1,400&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:     #090909;
      --fg:     #f5f2ec;
      --dim:    rgba(245,242,236,0.38);
      --rule:   rgba(245,242,236,0.07);
      --bar-h:  2.5rem;
      --subtle: rgba(245,242,236,0.12);
      --ctrl:   rgba(245,242,236,0.62);
      --border: rgba(245,242,236,0.15);
      --border-focus: rgba(245,242,236,0.4);
      --overlay-bg: rgba(0,0,0,0.6);
      --panel-bg: #111010;
      --panel-border: rgba(245,242,236,0.14);
      --panel-shadow: rgba(0,0,0,0.5);
      --input-rule: rgba(245,242,236,0.2);
      --input-rule-focus: rgba(245,242,236,0.5);
      --placeholder: rgba(245,242,236,0.3);
      --result-rule: rgba(245,242,236,0.06);
      --result-hover: rgba(245,242,236,0.05);
    }

    :root.light {
      --bg:     #f7f6f3;
      --fg:     #090909;
      --dim:    rgba(9,9,9,0.38);
      --rule:   rgba(9,9,9,0.07);
      --subtle: rgba(9,9,9,0.10);
      --ctrl:   rgba(9,9,9,0.62);
      --border: rgba(9,9,9,0.18);
      --border-focus: rgba(9,9,9,0.4);
      --overlay-bg: rgba(0,0,0,0.3);
      --panel-bg: #e8e5df;
      --panel-border: rgba(9,9,9,0.14);
      --panel-shadow: rgba(0,0,0,0.15);
      --input-rule: rgba(9,9,9,0.2);
      --input-rule-focus: rgba(9,9,9,0.5);
      --placeholder: rgba(9,9,9,0.3);
      --result-rule: rgba(9,9,9,0.08);
      --result-hover: rgba(9,9,9,0.05);
    }

    ::selection {
      background: rgba(245,242,236,0.18);
      color: inherit;
    }
    :root.light ::selection {
      background: rgba(9,9,9,0.14);
      color: inherit;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: 'Cormorant Garamond', serif;
      overflow: hidden;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    /* ── Top bar ─────────────────────────────────────────────── */
    #top-bar {
      position: fixed;
      inset: 0 0 auto 0;
      height: var(--bar-h);
      display: grid;
      grid-template-columns: 3fr 5fr 3fr;
      align-items: center;
      padding: 0 1.4rem;
      border-bottom: 1px solid var(--rule);
      background: var(--bg);
      z-index: 50;
    }
    #top-left { display: flex; align-items: center; }
    #top-center { display: flex; align-items: center; justify-content: center; gap: 0.4rem; }
    #top-right { display: flex; align-items: center; justify-content: flex-end; }

    #instrument-label {
      background: none;
      border: none;
      font-family: 'Spectral', serif;
      font-style: italic;
      font-size: 1.05rem;
      font-weight: 400;
      letter-spacing: 0.1em;
      color: var(--fg);
      cursor: pointer;
      padding: 0;
      transition: color 0.2s;
    }
    @media (hover: hover) {
      #instrument-label:hover { color: var(--dim); }
    }

    #mode-toggle {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    #share-btn { min-width: 7rem; text-align: right; outline: none; }
    #mode-btn, #color-btn, #share-btn {
      background: none;
      border: none;
      font-family: 'EB Garamond', serif;
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.11em;
      text-transform: uppercase;
      color: var(--fg);
      cursor: pointer;
      padding: 0.15rem 0.4rem;
      transition: color 0.2s;
    }
    #mode-group { display: flex; align-items: center; justify-content: flex-end; width: 9rem; }
    #color-btn { width: 5rem; text-align: left; }
    @media (hover: hover) {
      #mode-btn:hover, #color-btn:hover, #share-btn:hover { color: var(--dim); }
    }

    #count-input {
      width: 3.6rem;
      background: none;
      border: 1px solid var(--border);
      color: var(--fg);
      font-family: 'EB Garamond', serif;
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-align: center;
      padding: 0.15rem 0.3rem;
      outline: none;
      transition: border-color 0.2s;
    }
    #count-input:focus { border-color: var(--border-focus); }

    #words-refresh {
      background: none;
      border: none;
      color: var(--fg);
      font-size: 0.95rem;
      cursor: pointer;
      padding: 0 0.2rem;
      transition: color 0.2s;
    }
    @media (hover: hover) {
      #words-refresh:hover { color: var(--dim); }
    }

    body.share-mode #center { cursor: default; }
    body.share-mode .vp-controls,
    body.share-mode .vc-mute { visibility: hidden !important; }
    body.share-mode #words-refresh,
    body.share-mode #count-input,
    body.share-mode #mode-btn,
    body.share-mode #color-btn { visibility: hidden !important; }
    #share-popup {
      display: none;
      position: absolute;
      z-index: 11;
      background: #f5f2ec;
      border: none;
      border-radius: 4px;
      padding: 0.4rem 0.8rem;
      font-family: 'EB Garamond', serif;
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.11em;
      text-transform: uppercase;
      color: #090909;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
      transition: opacity 0.2s;
    }
    :root.light #share-popup {
      background: #090909;
      color: #f5f2ec;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    @media (hover: hover) {
      #share-popup:hover { opacity: 0.7; }
    }

    #share-preview-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(0,0,0,0.85);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    #share-preview-overlay.visible { display: flex; }
    #share-preview-images {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      max-height: calc(100vh - 6rem);
      width: 100%;
    }
    #share-preview-images img {
      max-width: 100%;
      max-height: 70vh;
      border-radius: 4px;
      object-fit: contain;
    }
    #share-preview-actions {
      display: flex;
      gap: 1rem;
      margin-top: 1rem;
    }
    #share-preview-actions button {
      background: none;
      border: 1px solid rgba(245,242,236,0.3);
      border-radius: 4px;
      color: #f5f2ec;
      font-family: 'EB Garamond', serif;
      font-size: 0.9rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.5rem 1.5rem;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }
    #share-preview-actions button:hover {
      border-color: rgba(245,242,236,0.6);
    }

    .share-caret {
      display: none;
      position: absolute;
      width: 1.5px;
      background: var(--fg);
      z-index: 10;
      touch-action: none;
    }
    .share-caret::before, .share-caret::after {
      content: '';
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 8px;
      height: 8px;
      background: var(--fg);
      border-radius: 50%;
      cursor: grab;
    }
    .share-caret::before { top: -4px; }
    .share-caret::after { bottom: -4px; }
    @media (max-width: 720px) {
      .share-caret { display: none !important; }
    }
    body.share-dragging { cursor: grabbing !important; }
    body.share-dragging .share-caret { pointer-events: none; }


    /* ── Stage ───────────────────────────────────────────────── */
    #stage {
      position: fixed;
      inset: var(--bar-h) 0 0 0;
      display: grid;
      grid-template-columns: 3fr 5fr 3fr;
      grid-template-rows: 1fr 1fr;
      grid-template-areas:
        "v0 center v1"
        "v2 center v3";
    }
    #v0 { grid-area: v0; }
    #v1 { grid-area: v1; }
    #v2 { grid-area: v2; }
    #v3 { grid-area: v3; }

    /* ── Center column ───────────────────────────────────────── */
    #center {
      grid-area: center;
      overflow-y: scroll;
      border-left: 1px solid var(--rule);
      border-right: 1px solid var(--rule);
      scrollbar-width: thin;
      scrollbar-color: var(--subtle) transparent;
    }

    #text-out {
      padding: 2.4rem 1.8rem 4rem;
      font-size: clamp(1.08rem, 1.5vw, 1.32rem);
      line-height: 1.88;
    }

    #text-out p {
      margin: 0 0 1.5em;
    }

    #text-out .words-block {
      line-height: 1.88;
    }

    .loading-msg {
      color: var(--dim);
      font-style: italic;
      font-size: 0.95rem;
    }

    @keyframes fadeInOut {
      0%, 100% { opacity: 0.25; }
      50%       { opacity: 0.7; }
    }
    .loading-msg { animation: fadeInOut 2s ease-in-out infinite; }

    /* ── Voice panels ────────────────────────────────────────── */
    .vp {
      position: relative;
      padding: 1.8rem 1.5rem 1.8rem 1.8rem;
      overflow: hidden;
      cursor: default;
      transition: opacity 0.35s;
      user-select: none;
      /* Corners are draggable and nothing inside them scrolls, so hand every
         gesture to the pointer handlers rather than the browser. */
      touch-action: none;
    }

    /* Drag-to-rearrange */
    @media (hover: hover) {
      .vp { cursor: grab; }
    }
    body.vp-dragging, body.vp-dragging .vp { cursor: grabbing !important; }
    .vp.vp-source { opacity: 0.35; transition: none; }
    .vp.vp-target {
      background: var(--result-hover);
      outline: 1px dashed var(--border-focus);
      outline-offset: -6px;
    }

    /* Colored rule on the inner edge (touching center) */
    #v0::after, #v2::after {
      content: '';
      position: absolute;
      top: 0; bottom: 0; right: 0;
      width: 1px;
      background: var(--vc, var(--rule));
      opacity: 0.45;
    }
    #v1::after, #v3::after {
      content: '';
      position: absolute;
      top: 0; bottom: 0; left: 0;
      width: 1px;
      background: var(--vc, var(--rule));
      opacity: 0.45;
    }

    /* Horizontal divider between top and bottom rows */
    #v0, #v1 { border-bottom: 1px solid var(--rule); }

    /* Voice accent mark */
    .vp::before {
      content: '';
      position: absolute;
      top: 1.8rem;
      bottom: 1.8rem;
      left: 0;
      width: 2px;
      background: var(--vc, transparent);
    }
    #v1::before, #v3::before {
      left: auto;
      right: 0;
    }

    .vnum-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 0.9rem;
    }

    .vnum {
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.62rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--vc, var(--dim));
      font-weight: 300;
    }

    .vc-mute {
      background: none;
      border: none;
      font-family: 'EB Garamond', serif;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--ctrl);
      cursor: pointer;
      padding: 0;
      transition: color 0.2s;
      white-space: nowrap;
    }
    @media (hover: hover) {
      .vc-mute:hover { color: var(--fg); }
    }

    .vtitle {
      font-size: clamp(0.95rem, 1.4vw, 1.25rem);
      font-style: italic;
      line-height: 1.3;
      color: var(--fg);
      margin-bottom: 0.5rem;
    }
    :root.light .vtitle { font-weight: 600; }

    .vmeta {
      font-family: 'EB Garamond', serif;
      font-size: clamp(0.85rem, 1.1vw, 1.05rem);
      letter-spacing: 0.01em;
      color: var(--dim);
      line-height: 1.6;
    }
    :root.light .vmeta { font-weight: 500; }

    /* ── Per-corner controls ─────────────────────────────────── */
    .vp-controls {
      position: absolute;
      left: 1.8rem;
      right: 1.5rem;
      bottom: 1.35rem;
      display: flex;
      flex-wrap: nowrap;
      justify-content: space-between;
      align-items: center;
      font-family: 'EB Garamond', serif;
      font-size: 0.88rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      opacity: 0.9;
      transition: opacity 0.2s;
    }
    .vp:hover .vp-controls { opacity: 1; }

    .vp-controls button {
      background: none;
      border: none;
      font: inherit;
      letter-spacing: inherit;
      text-transform: inherit;
      color: var(--ctrl);
      cursor: pointer;
      padding: 0;
      transition: color 0.2s;
      white-space: nowrap;
    }
    .vp-controls button:hover { color: var(--fg); }
    .vp-controls button:disabled { cursor: default; opacity: 0.5; }
    .vc-find.pinned { color: var(--vc, var(--fg)); }

    /* Muted state — dim the text, keep controls fully usable */
    .vp.muted .vnum-row .vnum,
    .vp.muted .vtitle,
    .vp.muted .vmeta { opacity: 0.25; }
    .vp.muted::before { opacity: 0.25; }

    /* Corner loading state */
    .vp.vloading .vtitle { color: var(--dim); font-style: italic; }

    /* ── Error / unavailable state ───────────────────────────── */
    .vtitle.unavail { color: var(--dim); font-style: normal; }

    /* ── Search modal ────────────────────────────────────────── */
    #search-modal[hidden] { display: none; }
    #search-modal {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .sm-backdrop {
      position: absolute;
      inset: 0;
      background: var(--overlay-bg);
      backdrop-filter: blur(2px);
    }
    .sm-panel {
      position: relative;
      width: min(90vw, 460px);
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      padding: 1.4rem 1.4rem 1.1rem;
      box-shadow: 0 20px 60px var(--panel-shadow);
    }
    .sm-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 1rem;
    }
    .sm-title {
      font-family: 'EB Garamond', serif;
      font-size: 0.82rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--dim);
    }
    #sm-voice { color: var(--fg); }
    #sm-close {
      background: none; border: none; cursor: pointer;
      color: var(--dim); font-size: 1rem; line-height: 1;
      transition: color 0.2s;
    }
    #sm-close:hover { color: var(--fg); }
    #sm-input {
      width: 100%;
      background: none;
      border: none;
      border-bottom: 1px solid var(--input-rule);
      color: var(--fg);
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.25rem;
      padding: 0.4rem 0.1rem;
      outline: none;
    }
    #sm-input:focus { border-bottom-color: var(--input-rule-focus); }
    #sm-input::placeholder { color: var(--placeholder); font-style: italic; }
    #sm-results {
      margin-top: 0.6rem;
      overflow-y: auto;
      flex: 1;
    }
    .sm-result {
      display: flex;
      flex-direction: column;
      gap: 0.1rem;
      width: 100%;
      text-align: left;
      background: none;
      border: none;
      border-bottom: 1px solid var(--result-rule);
      cursor: pointer;
      padding: 0.55rem 0.2rem;
      transition: background 0.15s;
    }
    .sm-result:hover { background: var(--result-hover); }
    .sm-r-title {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 1.02rem;
      color: var(--fg);
      line-height: 1.25;
    }
    .sm-r-author {
      font-family: 'EB Garamond', serif;
      font-size: 0.78rem;
      color: var(--dim);
    }
    .sm-empty {
      color: var(--dim);
      font-family: 'EB Garamond', serif;
      font-size: 0.85rem;
      font-style: italic;
      padding: 0.6rem 0.2rem;
    }

    /* ── Paste modal ─────────────────────────────────────────── */
    #paste-modal[hidden] { display: none; }
    #paste-modal {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #pm-input {
      width: 100%;
      background: none;
      border: 1px solid var(--input-rule);
      color: var(--fg);
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.05rem;
      line-height: 1.6;
      padding: 0.7rem 0.6rem;
      outline: none;
      resize: vertical;
      transition: border-color 0.2s;
    }
    #pm-input:focus { border-color: var(--input-rule-focus); }
    #pm-input::placeholder { color: var(--placeholder); font-style: italic; }
    #pm-submit {
      margin-top: 0.9rem;
      align-self: flex-start;
      background: none;
      border: none;
      cursor: pointer;
      font-family: 'EB Garamond', serif;
      font-size: 0.82rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--dim);
      transition: color 0.2s;
    }
    #pm-submit:hover { color: var(--fg); }

    /* ── Small-screen shared: anything both portrait and landscape need ── */
    @media (max-width: 720px), (max-height: 540px) {
      #top-bar { padding: 0 0.9rem; }
      #instrument-label { white-space: nowrap; }
    }

    /* ── Portrait phones: weave-first, voices as a tap-to-expand strip ── */
    @media (max-width: 720px) and (orientation: portrait) {
      #instrument-label { font-size: 0.72rem; letter-spacing: 0.08em; }
      #mode-btn, #color-btn, #share-btn { font-size: 0.72rem; letter-spacing: 0.05em; padding: 0.15rem 0.2rem; }
      #share-btn { min-width: auto; }
      #mode-group { width: 6.5rem; }
      #color-btn { width: 4rem; }
      #count-input { width: 3.2rem; font-size: 16px; padding: 0.1rem 0.2rem; }
      #share-preview-overlay { padding: 1rem; }
      #share-preview-actions { gap: 0.5rem; }
      #share-preview-actions button { font-size: 0.75rem; padding: 0.4rem 1rem; }

      #stage {
        grid-template-columns: 1fr 1fr;
        grid-template-rows: auto auto minmax(0, 1fr);
        grid-template-areas:
          "v0 v1"
          "v2 v3"
          "center center";
      }

      .vp {
        padding: 0.7rem 0.7rem 0.75rem;
        cursor: pointer;
        border-bottom: 1px solid var(--rule);
      }
      #v0, #v2 { border-right: 1px solid var(--rule); }
      .vp::before { top: 0.7rem; bottom: 0.7rem; }

      .vnum-row { margin-bottom: 0.35rem; }
      .vc-mute { font-size: 0.64rem; }
      .vtitle {
        font-size: 0.82rem;
        margin-bottom: 0;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .vmeta { font-size: 0.82rem; }

      .vp .vmeta, .vp .vp-controls { display: none; }
      .vp.expanded .vmeta { display: block; margin-top: 0.45rem; font-size: 0.8rem; }
      .vp.expanded .vp-controls {
        display: grid !important;
        grid-template-columns: 1fr 1fr;
        justify-items: start;
        position: static;
        margin-top: 0.6rem;
        font-size: 0.74rem;
        gap: 0.7rem 0.6rem;
        opacity: 1;
      }

      /* Reset landscape control overrides */
      .vp-controls {
        position: absolute;
        left: 1.8rem;
        right: 1.5rem;
        bottom: 1.35rem;
        margin-top: 0;
      }

      #center { border-left: none; border-right: none; }
      #text-out { padding: 1.6rem 1.3rem 3rem; font-size: clamp(1.08rem, 1.5vw, 1.32rem); }
    }

    /* ── Landscape phones: keep the four-corners layout, fit short corners ── */
    @media (orientation: landscape) and (max-height: 540px) {
      #top-bar { padding: 0 1rem; }
      #instrument-label { font-size: 0.85rem; letter-spacing: 0.1em; }
      #mode-btn, #color-btn, #share-btn { font-size: 0.72rem; letter-spacing: 0.07em; }
      #mode-group { width: 6.5rem; }
      #color-btn { width: 4rem; }
      #count-input { width: 3rem; font-size: 0.72rem; }

      /* Reset portrait grid — restore desktop four-corners */
      #stage {
        grid-template-columns: 3fr 5fr 3fr;
        grid-template-rows: 1fr 1fr;
        grid-template-areas:
          "v0 center v1"
          "v2 center v3";
      }

      .vp {
        padding: 0.7rem 0.9rem 0.7rem 1rem;
        cursor: default;
        border-bottom: none;
      }
      #v0, #v1 { border-bottom: 1px solid var(--rule); }
      #v0, #v2 { border-right: none; }
      .vp::before { top: 0.7rem; bottom: 0.7rem; }

      .vnum-row { margin-bottom: 0.4rem; }
      .vc-mute { font-size: 0.6rem; }
      .vtitle {
        font-size: 0.82rem;
        margin-bottom: 0.3rem;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .vmeta { font-size: 0.74rem; }

      /* Reset portrait hide — always show meta and controls */
      .vp .vmeta { display: block; }
      .vp .vp-controls {
        display: grid !important;
        grid-template-columns: 1fr 1fr;
        justify-items: start;
        position: absolute;
        left: 1rem; right: 0.9rem; bottom: 0.45rem;
        margin-top: 0;
        font-size: 0.72rem;
        gap: 0.35rem 0.6rem;
        opacity: 1;
      }

      #center { border-left: 1px solid var(--rule); border-right: 1px solid var(--rule); }
      #text-out { padding: 1.6rem 1.4rem 3rem; font-size: clamp(1.08rem, 1.5vw, 1.32rem); }
    }
  </style>
</head>

  <div id="search-modal" hidden>

        <button id="sm-close" aria-label="Close">✕</button>

             placeholder="Search by title or author…">

  <div id="paste-modal" hidden>
    <div class="sm-backdrop"></div>
    <div class="sm-panel">
      <div class="sm-head">
        <span class="sm-title">Type — Voice <span id="pm-voice">I</span></span>
        <button id="pm-close" aria-label="Close">✕</button>
      </div>
      <textarea id="pm-input" rows="10" spellcheck="false"
                placeholder="Paste or type your text here…"></textarea>
      <button id="pm-submit">Use this text</button>
    </div>
  </div>

  <script>
  (() => {
    const NUMERALS = ['I','II','III','IV'];
    const VOICE_COLORS = ['#c07a2b', '#8b3d6b', '#2b6e8b', '#4a7a46'];

    let voices    = [];
    let mode      = 'sentences';
    let textColor = 'voice';   // 'voice' = per-voice colors (default), 'white' = uniform
    let loading   = false;

    const MAX_SENTENCES = 999;
    const MAX_WORDS     = 9999;
    const MAX_DIALOGUE  = 999;
    const DEFAULT_SENTENCES = 30;
    const DEFAULT_WORDS     = 300;
    const DEFAULT_DIALOGUE  = 30;
    const DISPLAY_WINDOW = 150;
    let sentenceCount = DEFAULT_SENTENCES;
    let wordCount     = DEFAULT_WORDS;
    let dialogueCount = DEFAULT_DIALOGUE;
    let cachedWordsHtml = null;

    // Per-corner state. cornerMode only drives the pinned indicator ('book' when
    // the current book was chosen via Find, 'random' otherwise); the current
    // book id itself lives on voices[i].id.
    const cornerMode = ['random', 'random', 'random', 'random'];
    const cornerLoading = [false, false, false, false];

    // ── Helpers ────────────────────────────────────────────────
    function pickWindow(arr, size) {
      if (!size || arr.length <= size) return arr.slice();
      const start = Math.floor(Math.random() * (arr.length - size));
      return arr.slice(start, start + size);
    }

    function esc(str) {
      return String(str)
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;');
    }

    // ── Render corners ─────────────────────────────────────────
    function renderCorners() {
      for (let i = 0; i < 4; i++) {
        const panel = document.getElementById('v' + i);
        const v = voices[i];

        if (!v) continue;

        panel.style.setProperty('--vc', VOICE_COLORS[i]);
        panel.classList.toggle('muted', !v.active);

        panel.querySelector('.vtitle').textContent = v.title || '—';
        panel.querySelector('.vtitle').classList.toggle('unavail', v.source === 'error');

        // Meta line carries the author (Gutenberg books have one; some don't).
        panel.querySelector('.vmeta').textContent = v.author || '';

        // Light the Find control when this corner is pinned to a specific book.
        panel.querySelector('.vc-find').classList.toggle('pinned', cornerMode[i] === 'book');
        panel.querySelector('.vc-mute').textContent = v.active ? '✕ Silence' : '○ Restore';
      }
    }

    // ── Render text ────────────────────────────────────────────
    function renderText(scrollToTop) {
      const out   = document.getElementById('text-out');
      const active = voices.filter(v => v.active && v.paragraphs.length > 0);

      if (!active.length) {
        out.innerHTML = '<p class="loading-msg" style="animation:none;opacity:0.3">—</p>';
        return;
      }

      if (mode === 'sentences') {
        out.innerHTML = renderSentences(active);
      } else if (mode === 'dialogue') {
        out.innerHTML = renderDialogue(active);
      } else {
        if (!cachedWordsHtml) cachedWordsHtml = renderWords(active);
        out.innerHTML = cachedWordsHtml;
      }

      if (scrollToTop) document.getElementById('center').scrollTop = 0;
    }

    // Abbreviations/honorifics that end in a period without ending a sentence.
    // Their periods are swapped for a placeholder before splitting, then
    // restored — so “Mr. Smith”, “Gen. Lee”, “Rev. Fr. Brown” stay whole.
    const ABBR_PERIOD = '\uE000';
    const ABBR_WORDS = /\b(Mr|Mrs|Ms|Mmes|Messrs|Mme|Mlle|Dr|Drs|Prof|Profs|Sr|Jr|Sra|Srta|St|Ste|Ss|Rev|Revd|Fr|Bro|Br|Msgr|Mgr|Ven|Bp|Abp|Card|Rt|Hon|Gen|Col|Lt|Lieut|Maj|Capt|Cpl|Sgt|Cmdr|Cdr|Cmdre|Adm|Brig|Pvt|Pfc|Ens|Sfc|Gov|Sen|Rep|Pres|Supt|Det|Insp|Amb|Mt|Ft|No|Nos|Vol|Vols|pp|Ch|Fig|Figs|Ed|Eds|Inc|Ltd|Co|Corp|Bros|Ave|Rd|Blvd|etc|vs|viz|cf|al|ibid|op|esp|ca|fl|Jan|Feb|Mar|Apr|Jun|Jul|Aug|Sep|Sept|Oct|Nov|Dec)\./g;

    function protectAbbrev(text) {
      return text
        // Dotted initialisms: U.S., U.K., e.g., i.e., a.m., U.S.A.
        .replace(/\b(?:[A-Za-z]\.){2,}/g, m => m.replace(/\./g, ABBR_PERIOD))
        // Spaced name-initial runs: J. R. R.
        .replace(/\b[A-Za-z]\.(?:\s+[A-Za-z]\.)+/g, m => m.replace(/\./g, ABBR_PERIOD))
        // Multi-character Roman numerals: II. III. IV. XII. etc.
        .replace(/\b[IVXLCDM]{2,}\./g, m => m.replace(/\./g, ABBR_PERIOD))
        // Honorifics / titles / common abbreviations from the list
        .replace(ABBR_WORDS, (m, w) => w + ABBR_PERIOD);
    }

    // Split a run of prose into sentences. A terminator (.!?…) plus any closing
    // quotes/brackets only ends a sentence when what follows begins a new one —
    // whitespace then a capital, digit, or opening quote — or the text ends. A
    // closing quote followed by a lowercase word is a dialogue tag
    // (“There is!” roared Grampa…) and stays part of the same sentence.
    // Abbreviation periods are protected first so “Mr. Smith” never splits.
    function splitSentences(text) {
      const re = /[\s\S]+?[.!?…]+["”'’)\]]*(?=\s+["“'‘(]*[A-Z0-9]|\s*$)|[\s\S]+$/g;
      const matches = protectAbbrev(text).match(re);
      if (!matches) return [];
      return matches
        .map(s => s.split(ABBR_PERIOD).join('.').trim())
        .filter(s => s.split(/\s+/).length >= 3 && !/\S+@\S+\.\S+/.test(s) && !/^[IVXLCDM]+\.?\s*—/.test(s));
    }

    // Center-text color for a voice — its own hue, or uniform white when the
    // Color/White toggle is set to white.
    function spanColor(v) {
      return textColor === 'white' ? 'var(--fg)' : VOICE_COLORS[v.index];
    }

    function renderSentences(active) {
      const perVoice = Math.ceil(sentenceCount / active.length);
      const sentsByVoice = active.map(v =>
        splitSentences(v.paragraphs.join(' ')).slice(0, perVoice)
      );

      const maxLen = Math.max(...sentsByVoice.map(s => s.length));
      const spans  = [];

      for (let i = 0; i < maxLen && spans.length < sentenceCount; i++) {
        for (let j = 0; j < active.length && spans.length < sentenceCount; j++) {
          if (i < sentsByVoice[j].length) {
            spans.push(
              `<span style="color:${spanColor(active[j])}">${esc(sentsByVoice[j][i])}</span>`
            );
          }
        }
      }

      return `<p class="sentences-block">${spans.join(' ')}</p>`;
    }

    // Pull quoted speech out of a book. Quote characters are written as escapes
    // so the pattern can't be broken by smart-quote substitution in an editor.
    const QUOTE_CHARS = '“”„‟"';
    const DIALOGUE_RE = new RegExp(
      '[' + QUOTE_CHARS + ']([^' + QUOTE_CHARS + ']+)[' + QUOTE_CHARS + ']', 'g'
    );

    // A usable line of dialogue is a complete spoken sentence: opening on a
    // capital and closing on a period inside the quotes. This drops index
    // fragments, mid-sentence scraps, and "he said," tags.
    //
    // The word bounds are a pacing decision for live reading — long enough to
    // let a quasi-soliloquy breathe, short enough that one voice can't stall
    // the exchange.
    const DIALOGUE_MIN_WORDS = 3;
    const DIALOGUE_MAX_WORDS = 100;

    function isUsableDialogue(q) {
      const words = q.split(/\s+/).length;
      if (words < DIALOGUE_MIN_WORDS || words > DIALOGUE_MAX_WORDS) return false;
      if (!/^[A-Z]/.test(q)) return false;
      if (!/\.$/.test(q)) return false;
      return true;
    }

    function extractDialogue(text) {
      const re = new RegExp(DIALOGUE_RE.source, 'g');
      const results = [];
      let m;
      while ((m = re.exec(text)) !== null) {
        const quote = m[1].trim();
        if (isUsableDialogue(quote)) results.push(quote);
      }
      return results;
    }

    // Extracted quotes and the chosen starting offset are cached on the voice so
    // a change in one corner never reshuffles the others. Random/Find/Type build
    // a brand-new voice object, which drops the cache; Passage clears the offset
    // only, drawing a fresh run from the same book.
    function voiceQuotes(v) {
      if (!v._quotes) {
        // Search the whole book, not just the display window — a 150-paragraph
        // slice often lands on front matter or narration with no dialogue.
        v._quotes = extractDialogue((v.allParagraphs || v.paragraphs).join(' '));
      }
      return v._quotes;
    }

    function renderDialogue(active) {
      const voiced = [];
      const quotesByVoice = [];
      for (const v of active) {
        const quotes = voiceQuotes(v);
        if (quotes.length > 0) {
          voiced.push(v);
          quotesByVoice.push(quotes);
        }
      }
      if (!voiced.length) {
        return '<p class="loading-msg" style="animation:none;opacity:0.3">no dialogue found</p>';
      }
      const perVoice = Math.ceil(dialogueCount / voiced.length);
      for (let i = 0; i < quotesByVoice.length; i++) {
        const quotes = quotesByVoice[i];
        const v = voiced[i];
        if (v._qStart == null) {
          v._qStart = quotes.length > perVoice
            ? Math.floor(Math.random() * (quotes.length - perVoice))
            : 0;
        }
        const start = Math.min(v._qStart, Math.max(0, quotes.length - perVoice));
        quotesByVoice[i] = quotes.slice(start, start + perVoice);
      }

      const maxLen = Math.max(...quotesByVoice.map(q => q.length));
      const spans = [];

      for (let i = 0; i < maxLen && spans.length < dialogueCount; i++) {
        for (let j = 0; j < voiced.length && spans.length < dialogueCount; j++) {
          if (i < quotesByVoice[j].length) {
            spans.push(
              `<span style="color:${spanColor(voiced[j])}">“${esc(quotesByVoice[j][i])}”</span>`
            );
          }
        }
      }

      return `<p class="sentences-block">${spans.join(' ')}</p>`;
    }

    const ARTICLES = new Set(['the','a','an']);
    const PREPS = new Set(['of','in','to','on','at','by','from','with','for','into','through','during','before','after','between','about','over','under','upon']);
    const LINKING = new Set(['is','am','are','was','were','be','been','being','has','have','had']);

    function wordCat(w) {
      const lc = w.toLowerCase().replace(/[^a-z']/g, '');
      if (ARTICLES.has(lc)) return 'art';
      if (PREPS.has(lc)) return 'prep';
      if (LINKING.has(lc)) return 'link';
      return null;
    }

    // Every voice draws its chunk lengths from its own seeded stream, kept on
    // the voice itself. So a source carries its rhythm wherever it goes: drag
    // a four-word voice onto a one-word voice and they trade places intact,
    // rather than inheriting whatever cadence the new corner had. Only ↻
    // clears the seeds and deals a new texture.
    function mulberry32(a) {
      return function () {
        a |= 0; a = a + 0x6D2B79F5 | 0;
        let t = Math.imul(a ^ a >>> 15, 1 | a);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }

    function newSeed() {
      return (Math.random() * 4294967296) >>> 0;
    }

    function renderWords(active) {
      const rnds = active.map(v => {
        if (v._seed == null) v._seed = newSeed();
        return mulberry32(v._seed);
      });
      const perVoice = Math.ceil(wordCount / active.length);
      const wordsByVoice = active.map(v =>
        v.paragraphs
          .flatMap(p => p.split(/\s+/).filter(w => w))
          .slice(0, perVoice)
      );

      const cursors = active.map(() => 0);
      const spans = [];
      let vi = 0;
      let lastCat = null;
      let needsCap = false;

      while (spans.length < wordCount) {
        const words = wordsByVoice[vi];
        if (cursors[vi] >= words.length) {
          vi = (vi + 1) % active.length;
          let checked = 0;
          while (cursors[vi] >= wordsByVoice[vi].length && checked < active.length) {
            vi = (vi + 1) % active.length;
            checked++;
          }
          if (checked >= active.length) break;
          continue;
        }

        const chunkLen = 1 + Math.floor(rnds[vi]() * 5);
        const color = spanColor(active[vi]);

        if (needsCap) {
          while (cursors[vi] < words.length && !/^[A-Z""“]/.test(words[cursors[vi]])) {
            cursors[vi]++;
          }
          if (cursors[vi] >= words.length) {
            vi = (vi + 1) % active.length;
            continue;
          }
          needsCap = false;
        }

        for (let w = 0; w < chunkLen && cursors[vi] < words.length && spans.length < wordCount; w++) {
          const word = words[cursors[vi]++];
          const cat = wordCat(word);
          if (cat && cat === lastCat) continue;
          spans.push(`<span style="color:${color}" data-vi="${active[vi].index}">${esc(word)}</span>`);
          lastCat = cat;
          if (/[.!?…][""”]?$/.test(word)) needsCap = true;
        }

        vi = (vi + 1) % active.length;
      }

      return `<p class="words-block">${spans.join(' ')}</p>`;
    }

    // ── Fetch pairing ──────────────────────────────────────────
    async function loadPairing() {
      if (loading) return;
      loading = true;
      cachedWordsHtml = null;

      document.getElementById('text-out').innerHTML =
        '<p class="loading-msg">gathering voices</p>';

      // Reset corners to placeholder while loading
      for (let i = 0; i < 4; i++) {
        const p = document.getElementById('v' + i);
        p.style.removeProperty('--vc');
        p.classList.remove('muted');
        p.querySelector('.vtitle').textContent = '—';
        p.querySelector('.vmeta').textContent = '';
      }

      try {
        const res  = await fetch('/api/instrument-01');
        if (!res.ok) throw new Error(`API ${res.status}`);
        const data = await res.json();

        voices = data.voices.map((v, i) => ({
          ...v,
          allParagraphs: v.paragraphs,
          paragraphs: pickWindow(v.paragraphs, DISPLAY_WINDOW),
          active: true,
          index: i,
        }));

        renderCorners();
        renderText(true);
      } catch (err) {
        document.getElementById('text-out').innerHTML =
          `<p class="loading-msg" style="animation:none">Could not load voices. Please try again.</p>`;
        console.error('Instrument 01:', err);
      } finally {
        loading = false;
      }
    }

    // ── Load one corner ────────────────────────────────────────
    // Fetches `url` into corner `i`, preserving its color and active state.
    // `titleOverride` (a {title,author} book) is used when the user pinned an
    // exact book so its label matches exactly what they chose.
    async function loadVoice(i, url, titleOverride) {
      if (cornerLoading[i] || loading) return;
      cornerLoading[i] = true;
      cachedWordsHtml = null;

      const panel = document.getElementById('v' + i);
      panel.classList.add('vloading');
      panel.querySelector('.vtitle').textContent = 'gathering…';
      panel.querySelector('.vmeta').textContent = '';

      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error(`API ${res.status}`);
        const { voice } = await res.json();

        const prev = voices[i] || {};
        voices[i] = {
          ...voice,
          allParagraphs: voice.paragraphs,
          paragraphs: pickWindow(voice.paragraphs, DISPLAY_WINDOW),
          color: VOICE_COLORS[i],
          active: prev.active !== false,
          index: i,
        };
        if (titleOverride) {
          voices[i].id     = titleOverride.id;
          voices[i].title  = titleOverride.title;
          voices[i].author = titleOverride.author;
        }

        renderCorners();
        renderText(true);
      } catch (err) {
        console.error('Instrument 01 voice ' + i + ':', err);
        renderCorners(); // restore previous voice display
      } finally {
        cornerLoading[i] = false;
        panel.classList.remove('vloading');
      }
    }

    function newPassage(i) {
      const v = voices[i];
      if (!v || !v.allParagraphs || !v.allParagraphs.length) return;
      const total = v.allParagraphs.length;
      if (total <= DISPLAY_WINDOW) {
        const half = Math.floor(total / 2);
        const oldStart = v.allParagraphs.indexOf(v.paragraphs[0]);
        const newStart = (oldStart + half) % total;
        v.paragraphs = v.allParagraphs.slice(newStart, newStart + total);
      } else {
        const oldFirst = v.paragraphs[0];
        let attempts = 0;
        do {
          v.paragraphs = pickWindow(v.allParagraphs, DISPLAY_WINDOW);
          attempts++;
        } while (v.paragraphs[0] === oldFirst && attempts < 5);
      }
      // Dialogue reads the whole book, so the paragraph window above doesn't
      // affect it — clear this voice's offset so it draws a new run instead.
      v._qStart = null;
      cachedWordsHtml = null;
      renderText();
    }

    // Swap in a different random book.
    function newRandom(i) {
      cornerMode[i] = 'random';
      loadVoice(i, '/api/instrument-01?single=gutenberg');
    }

    // Pin an exact book to a corner (from the search modal), then load it.
    function pinBook(i, book) {
      cornerMode[i] = 'book';
      loadVoice(i, '/api/instrument-01?book=' + book.id, book);
    }

    // Return a corner to random draws.
    function unpinCorner(i) {
      newRandom(i);
    }

    // ── Events ─────────────────────────────────────────────────
    document.getElementById('instrument-label').addEventListener('click', () => {
      document.documentElement.classList.toggle('light');
      syncColorLabel();
    });

    const countInput = document.getElementById('count-input');
    const refreshBtn = document.getElementById('words-refresh');

    const MODES = ['sentences', 'dialogue', 'words'];
    const MODE_LABELS = { sentences: 'Sentences', words: 'Words', dialogue: 'Dialogue' };

    function syncCountInput() {
      if (mode === 'sentences') countInput.value = sentenceCount;
      else if (mode === 'words') countInput.value = wordCount;
      else countInput.value = dialogueCount;
    }

    function syncRefreshBtn() {
      refreshBtn.style.visibility = mode === 'words' ? 'visible' : 'hidden';
    }

    const modeBtn = document.getElementById('mode-btn');
    modeBtn.addEventListener('click', () => {
      const idx = (MODES.indexOf(mode) + 1) % MODES.length;
      mode = MODES[idx];
      modeBtn.textContent = MODE_LABELS[mode];
      syncCountInput();
      syncRefreshBtn();
      renderText();
    });

    refreshBtn.addEventListener('click', () => {
      voices.forEach(v => { if (v) v._seed = null; }); // deal a new rhythm
      cachedWordsHtml = null;
      renderText();
    });

    countInput.addEventListener('input', () => {
      const raw = countInput.value.replace(/\D/g, '');
      if (!raw) return;
      let n = parseInt(raw, 10);
      const max = mode === 'sentences' ? MAX_SENTENCES : mode === 'words' ? MAX_WORDS : MAX_DIALOGUE;
      if (n > max) { n = max; countInput.value = n; }
      if (n < 1) n = 1;
      if (mode === 'sentences') sentenceCount = n;
      else if (mode === 'words') { wordCount = n; cachedWordsHtml = null; }
      else dialogueCount = n;
      renderText();
    });

    countInput.addEventListener('blur', () => {
      const raw = countInput.value.replace(/\D/g, '');
      if (!raw || parseInt(raw, 10) < 1) {
        if (mode === 'sentences') sentenceCount = DEFAULT_SENTENCES;
        else if (mode === 'words') wordCount = DEFAULT_WORDS;
        else dialogueCount = DEFAULT_DIALOGUE;
      }
      syncCountInput();
    });

    const colorBtn = document.getElementById('color-btn');
    function syncColorLabel() {
      if (textColor === 'voice') { colorBtn.textContent = 'Color'; }
      else {
        colorBtn.textContent = document.documentElement.classList.contains('light') ? 'Black' : 'White';
      }
    }
    colorBtn.addEventListener('click', () => {
      textColor = textColor === 'voice' ? 'white' : 'voice';
      syncColorLabel();
      if (mode === 'words' && cachedWordsHtml) {
        document.querySelectorAll('#text-out span[data-vi]').forEach(sp => {
          const vi = parseInt(sp.dataset.vi, 10);
          sp.style.color = textColor === 'white' ? 'var(--fg)' : VOICE_COLORS[vi];
        });
        cachedWordsHtml = document.getElementById('text-out').innerHTML;
      } else {
        cachedWordsHtml = null;
        renderText();
      }
    });

    // Passage — a new passage from the book this corner currently holds.
    document.querySelectorAll('.vc-reroll').forEach(btn => {
      btn.addEventListener('click', () => {
        newPassage(parseInt(btn.dataset.vi, 10));
      });
    });

    // Random — swap in a different random book.
    document.querySelectorAll('.vc-random').forEach(btn => {
      btn.addEventListener('click', () => {
        newRandom(parseInt(btn.dataset.vi, 10));
      });
    });

    // Find — open the search modal targeting this corner.
    document.querySelectorAll('.vc-find').forEach(btn => {
      btn.addEventListener('click', () => {
        openSearch(parseInt(btn.dataset.vi, 10));
      });
    });

    // Silence / restore this voice.
    document.querySelectorAll('.vc-mute').forEach(btn => {
      btn.addEventListener('click', () => {
        const i = parseInt(btn.dataset.vi, 10);
        if (!voices[i]) return;
        voices[i].active = !voices[i].active;
        renderCorners();
        if (mode === 'words' && cachedWordsHtml) {
          document.querySelectorAll('#text-out span[data-vi="' + i + '"]').forEach(sp => {
            sp.style.display = voices[i].active ? '' : 'none';
          });
        } else {
          cachedWordsHtml = null;
          renderText();
        }
      });
    });

    // Mobile: tap a voice tab (not its buttons) to reveal/hide its controls.
    // On desktop the .expanded class has no styling, so this is a no-op there.
    document.querySelectorAll('.vp').forEach(panel => {
      panel.addEventListener('click', e => {
        if (e.target.closest('button')) return; // let control buttons act
        if (suppressPanelClick) return;         // this was the end of a drag
        const wasExpanded = panel.classList.contains('expanded');
        document.querySelectorAll('.vp.expanded').forEach(p => p.classList.remove('expanded'));
        if (!wasExpanded) panel.classList.add('expanded');
      });
    });

    // ── Rearrange voices by dragging one corner onto another ───
    // The numeral and colour belong to the corner, not the book: dragging II
    // onto IV sends that book to the fourth corner and it takes on IV's green.
    // That keeps the four-colour layout fixed for a performer while the books
    // move, and makes the swap legible in the centre weave.

    function swapVoices(a, b) {
      if (a === b || !voices[a] || !voices[b]) return;

      const tmp = voices[a]; voices[a] = voices[b]; voices[b] = tmp;
      [a, b].forEach(i => { voices[i].index = i; voices[i].color = VOICE_COLORS[i]; });

      const mode_ = cornerMode[a]; cornerMode[a] = cornerMode[b]; cornerMode[b] = mode_;

      renderCorners();
      // Safe to re-weave: the seed is untouched, so Words keeps its rhythm and
      // only the books move. Sentences and Dialogue are deterministic already.
      cachedWordsHtml = null;
      renderText();
    }

    const DRAG_THRESHOLD = 8; // px of travel before a press becomes a drag
    let dragFrom = null, dragging = false, dragPointer = null;
    let dragStartX = 0, dragStartY = 0, suppressPanelClick = false;

    function panelSlot(el) {
      const vp = el && el.closest ? el.closest('.vp') : null;
      return vp ? parseInt(vp.dataset.vi, 10) : null;
    }

    function markTarget(slot) {
      document.querySelectorAll('.vp.vp-target').forEach(p => p.classList.remove('vp-target'));
      if (slot != null && slot !== dragFrom) {
        document.getElementById('v' + slot).classList.add('vp-target');
      }
    }

    function endDrag(commitSlot) {
      if (dragging && commitSlot != null) swapVoices(dragFrom, commitSlot);
      document.body.classList.remove('vp-dragging');
      document.querySelectorAll('.vp-source, .vp-target')
        .forEach(p => p.classList.remove('vp-source', 'vp-target'));
      suppressPanelClick = dragging;
      dragging = false; dragFrom = null; dragPointer = null;
      if (suppressPanelClick) setTimeout(() => { suppressPanelClick = false; }, 0);
    }

    document.querySelectorAll('.vp').forEach(panel => {
      panel.addEventListener('pointerdown', e => {
        if (e.button != null && e.button !== 0) return;   // left / touch only
        if (e.target.closest('button')) return;           // let controls act
        if (shareMode || loading) return;
        const slot = parseInt(panel.dataset.vi, 10);
        if (cornerLoading[slot]) return;
        dragFrom = slot;
        dragPointer = e.pointerId;
        dragStartX = e.clientX; dragStartY = e.clientY;
      });
    });

    document.addEventListener('pointermove', e => {
      if (dragFrom == null || e.pointerId !== dragPointer) return;

      if (!dragging) {
        if (Math.hypot(e.clientX - dragStartX, e.clientY - dragStartY) < DRAG_THRESHOLD) return;
        dragging = true;
        document.body.classList.add('vp-dragging');
        document.getElementById('v' + dragFrom).classList.add('vp-source');
      }

      e.preventDefault();
      markTarget(panelSlot(document.elementFromPoint(e.clientX, e.clientY)));
    });

    document.addEventListener('pointerup', e => {
      if (dragFrom == null || e.pointerId !== dragPointer) return;
      endDrag(dragging ? panelSlot(document.elementFromPoint(e.clientX, e.clientY)) : null);
    });

    document.addEventListener('pointercancel', e => {
      if (dragFrom == null || e.pointerId !== dragPointer) return;
      endDrag(null);
    });

    // ── Search modal ───────────────────────────────────────────
    const searchModal = document.getElementById('search-modal');
    const smInput     = document.getElementById('sm-input');
    const smResults   = document.getElementById('sm-results');
    const smVoice     = document.getElementById('sm-voice');
    let searchTarget  = null;   // corner index being edited
    let searchTimer   = null;
    let searchResults = [];     // current [{id,title,author}]

    function openSearch(i) {
      searchTarget = i;
      smVoice.textContent = NUMERALS[i];
      smVoice.style.color = VOICE_COLORS[i];
      smInput.value = '';
      smResults.innerHTML = '';
      searchResults = [];
      searchModal.hidden = false;
      smInput.focus();
    }

    function closeSearch() {
      searchModal.hidden = true;
      searchTarget = null;
      clearTimeout(searchTimer);
    }

    function renderSearchResults() {
      if (!searchResults.length) {
        smResults.innerHTML = smInput.value.trim().length >= 2
          ? '<div class="sm-empty">No matches.</div>' : '';
        return;
      }
      smResults.innerHTML = searchResults.map((b, idx) =>
        `<button class="sm-result" data-idx="${idx}">` +
          `<span class="sm-r-title">${esc(b.title)}</span>` +
          (b.author ? `<span class="sm-r-author">${esc(b.author)}</span>` : '') +
        `</button>`
      ).join('');
    }

    async function runSearch(q) {
      try {
        const res = await fetch('/api/instrument-01?search=' + encodeURIComponent(q));
        if (!res.ok) throw new Error(`API ${res.status}`);
        const data = await res.json();
        if (searchModal.hidden) return; // closed while in flight
        searchResults = data.results || [];
        renderSearchResults();
      } catch (err) {
        console.error('Instrument 01 search:', err);
      }
    }

    smInput.addEventListener('input', () => {
      clearTimeout(searchTimer);
      const q = smInput.value.trim();
      if (q.length < 2) { searchResults = []; renderSearchResults(); return; }
      searchTimer = setTimeout(() => runSearch(q), 250);
    });

    // Enter selects the first result.
    smInput.addEventListener('keydown', e => {
      if (e.key === 'Enter' && searchResults.length) {
        pinBook(searchTarget, searchResults[0]);
        closeSearch();
      } else if (e.key === 'Escape') {
        closeSearch();
      }
    });

    smResults.addEventListener('click', e => {
      const btn = e.target.closest('.sm-result');
      if (!btn) return;
      pinBook(searchTarget, searchResults[parseInt(btn.dataset.idx, 10)]);
      closeSearch();
    });

    document.getElementById('sm-close').addEventListener('click', closeSearch);
    searchModal.querySelector('.sm-backdrop').addEventListener('click', closeSearch);

    // ── Paste modal ──────────────────────────────────────────────
    const pasteModal = document.getElementById('paste-modal');
    const pmInput    = document.getElementById('pm-input');
    const pmVoice    = document.getElementById('pm-voice');
    let pasteTarget  = null;

    document.querySelectorAll('.vc-paste').forEach(btn => {
      btn.addEventListener('click', () => {
        pasteTarget = parseInt(btn.dataset.vi, 10);
        pmVoice.textContent = NUMERALS[pasteTarget];
        pmVoice.style.color = VOICE_COLORS[pasteTarget];
        pmInput.value = '';
        pasteModal.hidden = false;
        pmInput.focus();
      });
    });

    function closePaste() {
      pasteModal.hidden = true;
      pasteTarget = null;
    }

    document.getElementById('pm-close').addEventListener('click', closePaste);
    pasteModal.querySelector('.sm-backdrop').addEventListener('click', closePaste);

    document.getElementById('pm-submit').addEventListener('click', () => {
      const raw = pmInput.value.trim();
      if (!raw || pasteTarget === null) return;

      const paragraphs = raw.split(/\n\s*\n/)
        .map(p => p.replace(/\n/g, ' ').replace(/\s+/g, ' ').trim())
        .filter(p => p.length > 0);

      if (!paragraphs.length) return;

      const i = pasteTarget;
      const allWords = raw.split(/\s+/).filter(w => w);
      const titleWords = allWords.slice(0, 5);
      const title = titleWords.join(' ') + (allWords.length > 5 ? '…' : '');

      voices[i] = {
        title: title,
        author: null,
        source: 'paste',
        color: VOICE_COLORS[i],
        allParagraphs: paragraphs,
        paragraphs: pickWindow(paragraphs, DISPLAY_WINDOW),
        active: true,
        index: i,
      };
      cornerMode[i] = 'random';
      cachedWordsHtml = null;

      renderCorners();
      renderText(true);
      closePaste();
    });

    // ── Share ──────────────────────────────────────────────────
    const shareBtn = document.getElementById('share-btn');
    let shareMode = false;
    let shareReady = false;

    const caretStart = document.getElementById('share-caret-start');
    const caretEnd = document.getElementById('share-caret-end');

    function positionCaretStart() {
      const center = document.getElementById('center');
      const textOut = document.getElementById('text-out');
      const centerRect = center.getBoundingClientRect();
      const spans = textOut.querySelectorAll('span[style*="color"]');

      for (const span of spans) {
        const rect = span.getBoundingClientRect();
        if (rect.top >= centerRect.top) {
          const left = rect.left - centerRect.left;
          const top = rect.top - centerRect.top + center.scrollTop;
          const height = parseFloat(getComputedStyle(span).fontSize) * 1.2;
          caretStart.style.left = left + 'px';
          caretStart.style.top = top + 'px';
          caretStart.style.height = height + 'px';
          caretStart.style.display = 'block';
          return;
        }
      }
    }

    function positionCaretEnd() {
      const sel = window.getSelection();
      if (!sel || sel.rangeCount === 0) return;
      const range = sel.getRangeAt(0);
      const rects = range.getClientRects();
      if (!rects.length) return;

      const center = document.getElementById('center');
      const centerRect = center.getBoundingClientRect();
      const lastRect = rects[rects.length - 1];
      const left = lastRect.right - centerRect.left;
      const top = lastRect.top - centerRect.top + center.scrollTop;
      const height = lastRect.height;

      caretEnd.style.left = left + 'px';
      caretEnd.style.top = top + 'px';
      caretEnd.style.height = height + 'px';
      caretEnd.style.display = 'block';
    }

    function selectFirstVisibleWord() {
      const center = document.getElementById('center');
      const textOut = document.getElementById('text-out');
      const centerRect = center.getBoundingClientRect();
      const spans = textOut.querySelectorAll('span[style*="color"]');

      for (const span of spans) {
        const rect = span.getBoundingClientRect();
        if (rect.bottom > centerRect.top && rect.top < centerRect.bottom) {
          const textNode = span.firstChild;
          if (!textNode || textNode.nodeType !== 3) continue;
          const text = textNode.textContent;
          const firstWordEnd = text.indexOf(' ');
          let end = firstWordEnd > 0 ? firstWordEnd : text.length;

          if (end < 3) {
            const nextSpace = text.indexOf(' ', end + 1);
            end = nextSpace > 0 ? nextSpace : text.length;
          }

          anchorStartNode = textNode;
          anchorStartOffset = 0;
          anchorEndNode = textNode;
          anchorEndOffset = end;

          const sel = window.getSelection();
          sel.removeAllRanges();
          const r = document.createRange();
          r.setStart(textNode, 0);
          r.setEnd(textNode, end);
          sel.addRange(r);

          updateCaretPositions();
          caretStart.style.display = 'block';
          caretEnd.style.display = 'block';
          return;
        }
      }
    }

    const sharePopup = document.getElementById('share-popup');

    function positionPopup() {
      const sel = window.getSelection();
      if (!sel || sel.rangeCount === 0) return;
      const range = sel.getRangeAt(0);
      const rects = range.getClientRects();
      if (!rects.length) return;

      const center = document.getElementById('center');
      const centerRect = center.getBoundingClientRect();
      const lastRect = rects[rects.length - 1];

      const left = lastRect.right - centerRect.left;
      const top = lastRect.bottom - centerRect.top + center.scrollTop + 12;

      sharePopup.style.left = left + 'px';
      sharePopup.style.top = top + 'px';
      sharePopup.style.display = 'block';
    }

    function enterShareMode() {
      shareMode = true;
      shareReady = true;
      anchorStartNode = null; anchorStartOffset = 0;
      anchorEndNode = null; anchorEndOffset = 0;
      document.body.classList.add('share-mode');
      shareBtn.textContent = 'Cancel';
      selectFirstVisibleWord();
      positionPopup();
    }

    function exitShareMode() {
      shareMode = false;
      shareReady = false;
      savedRange = null;
      anchorStartNode = null; anchorStartOffset = 0;
      anchorEndNode = null; anchorEndOffset = 0;
      document.body.classList.remove('share-mode');
      shareBtn.textContent = 'Share';
      caretStart.style.display = 'none';
      caretEnd.style.display = 'none';
      sharePopup.style.display = 'none';
      if (restoreTimer) { clearTimeout(restoreTimer); restoreTimer = null; }
      window.getSelection().removeAllRanges();
    }

    shareBtn.addEventListener('click', () => {
      if (shareMode) { exitShareMode(); return; }
      enterShareMode();
    });

    let savedRange = null;

    function saveSelection() {
      const sel = window.getSelection();
      if (sel && sel.rangeCount > 0 && sel.toString().trim()) {
        savedRange = sel.getRangeAt(0).cloneRange();
      }
    }

    function restoreSelection() {
      if (!savedRange) return;
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(savedRange);
    }

    let restoreTimer = null;
    document.addEventListener('selectionchange', () => {
      if (!shareMode) return;
      if (document.getElementById('share-preview-overlay').classList.contains('visible')) return;
      if (restoreTimer) { clearTimeout(restoreTimer); restoreTimer = null; }
      const sel = window.getSelection();
      if (sel && sel.toString().trim()) {
        saveSelection();
        positionPopup();
      } else if (savedRange && !isDragging) {
        restoreTimer = setTimeout(() => {
          restoreSelection();
          restoreTimer = null;
        }, 300);
      }
    });

    sharePopup.addEventListener('mousedown', (e) => { e.preventDefault(); });
    sharePopup.addEventListener('touchstart', (e) => { e.preventDefault(); });
    sharePopup.addEventListener('click', () => { generateShareCard(); });
    sharePopup.addEventListener('touchend', (e) => {
      e.preventDefault();
      generateShareCard();
    });

    let isDragging = false;
    let dragWhich = null; // 'start' or 'end'
    let anchorStartNode = null, anchorStartOffset = 0;
    let anchorEndNode = null, anchorEndOffset = 0;

    function caretFromPoint(x, y) {
      if (document.caretRangeFromPoint) {
        return document.caretRangeFromPoint(x, y);
      }
      if (document.caretPositionFromPoint) {
        const pos = document.caretPositionFromPoint(x, y);
        if (!pos) return null;
        const range = document.createRange();
        range.setStart(pos.offsetNode, pos.offset);
        range.collapse(true);
        return range;
      }
      return null;
    }

    function caretPosToNode(caretEl) {
      const center = document.getElementById('center');
      const centerRect = center.getBoundingClientRect();
      const x = parseFloat(caretEl.style.left) + centerRect.left;
      const y = parseFloat(caretEl.style.top) - center.scrollTop + centerRect.top + parseFloat(caretEl.style.height) / 2;
      return caretFromPoint(x, y);
    }

    function updateSelection() {
      if (!anchorStartNode || !anchorEndNode) return;
      const sel = window.getSelection();
      sel.removeAllRanges();
      const r = document.createRange();
      try {
        r.setStart(anchorStartNode, anchorStartOffset);
        r.setEnd(anchorEndNode, anchorEndOffset);
        if (r.collapsed) {
          r.setStart(anchorEndNode, anchorEndOffset);
          r.setEnd(anchorStartNode, anchorStartOffset);
        }
      } catch (_) { return; }
      sel.addRange(r);
    }

    function updateCaretPositions() {
      const sel = window.getSelection();
      if (!sel || sel.rangeCount === 0) return;
      const range = sel.getRangeAt(0);
      const rects = range.getClientRects();
      if (!rects.length) return;

      const center = document.getElementById('center');
      const centerRect = center.getBoundingClientRect();

      const firstRect = rects[0];
      caretStart.style.left = (firstRect.left - centerRect.left) + 'px';
      caretStart.style.top = (firstRect.top - centerRect.top + center.scrollTop) + 'px';
      caretStart.style.height = firstRect.height + 'px';

      const lastRect = rects[rects.length - 1];
      caretEnd.style.left = (lastRect.right - centerRect.left) + 'px';
      caretEnd.style.top = (lastRect.top - centerRect.top + center.scrollTop) + 'px';
      caretEnd.style.height = lastRect.height + 'px';
    }

    function beginDrag(which, e) {
      if (!shareMode) return;
      e.preventDefault();
      dragWhich = which;
      isDragging = true;
      document.body.classList.add('share-dragging');
      sharePopup.style.display = 'none';
    }

    let scrollRAF = null;
    const SCROLL_ZONE = 60;
    const SCROLL_SPEED = 8;

    function autoScroll(clientY) {
      const center = document.getElementById('center');
      const rect = center.getBoundingClientRect();
      const distTop = clientY - rect.top;
      const distBot = rect.bottom - clientY;

      if (distTop < SCROLL_ZONE && center.scrollTop > 0) {
        const rate = SCROLL_SPEED * (1 - distTop / SCROLL_ZONE);
        center.scrollTop -= rate;
        return true;
      }
      if (distBot < SCROLL_ZONE && center.scrollTop < center.scrollHeight - center.clientHeight) {
        const rate = SCROLL_SPEED * (1 - distBot / SCROLL_ZONE);
        center.scrollTop += rate;
        return true;
      }
      return false;
    }

    let lastDragX = 0, lastDragY = 0;

    function dragTick() {
      if (!isDragging) { scrollRAF = null; return; }
      autoScroll(lastDragY);

      const range = caretFromPoint(lastDragX, lastDragY);
      if (range) {
        if (dragWhich === 'start') {
          anchorStartNode = range.startContainer;
          anchorStartOffset = range.startOffset;
        } else {
          anchorEndNode = range.startContainer;
          anchorEndOffset = range.startOffset;
        }
        updateSelection();
        updateCaretPositions();
      }

      scrollRAF = requestAnimationFrame(dragTick);
    }

    function onDragMove(e) {
      if (!isDragging) return;
      e.preventDefault();
      lastDragX = e.touches ? e.touches[0].clientX : e.clientX;
      lastDragY = e.touches ? e.touches[0].clientY : e.clientY;

      if (!scrollRAF) scrollRAF = requestAnimationFrame(dragTick);
    }

    function onDragEnd() {
      if (!isDragging) return;
      isDragging = false;
      dragWhich = null;
      if (scrollRAF) { cancelAnimationFrame(scrollRAF); scrollRAF = null; }
      document.body.classList.remove('share-dragging');
      positionPopup();
    }

    document.getElementById('center').addEventListener('mousedown', (e) => {
      if (!shareMode) return;
      if (e.target.closest('.share-caret')) return;
      e.preventDefault();
    });

    caretStart.addEventListener('mousedown', (e) => beginDrag('start', e));
    caretStart.addEventListener('touchstart', (e) => beginDrag('start', e));
    caretEnd.addEventListener('mousedown', (e) => beginDrag('end', e));
    caretEnd.addEventListener('touchstart', (e) => beginDrag('end', e));
    document.addEventListener('mousemove', onDragMove);
    document.addEventListener('touchmove', onDragMove, { passive: false });
    document.addEventListener('mouseup', onDragEnd);
    document.addEventListener('touchend', onDragEnd);

    function getSelectedSpans() {
      const sel = window.getSelection();
      if (!sel || sel.rangeCount === 0) return [];
      const range = sel.getRangeAt(0);
      const cloned = range.cloneContents();
      const result = [];
      const walker = document.createTreeWalker(cloned, NodeFilter.SHOW_TEXT);
      let node;
      while ((node = walker.nextNode())) {
        const text = node.textContent.trim();
        if (!text) continue;
        const parent = node.parentElement;
        const color = parent && parent.style && parent.style.color
          ? parent.style.color : '#f5f2ec';
        if (result.length > 0 && result[result.length - 1].color === color) {
          result[result.length - 1].text += ' ' + text;
        } else {
          result.push({ text, color });
        }
      }
      return result;
    }

    function getActiveVoiceSources() {
      return voices.filter(v => v && v.active).map(v => ({
        title: v.title || 'Untitled',
        author: v.author || null,
        color: v.color,
      }));
    }

    async function generateShareCard() {
      const sel = window.getSelection();
      if (!sel || !sel.toString().trim()) return;

      const selectedText = sel.toString().trim();
      const spans = getSelectedSpans();
      const selectedColors = new Set(spans.map(s => s.color));
      const sources = voices.filter(v => v && v.active).reduce((acc, v) => {
        const vc = VOICE_COLORS[v.index];
        const matches = [...selectedColors].some(sc => {
          if (sc === vc) return true;
          const m = sc.match(/^rgb\((\d+),\s*(\d+),\s*(\d+)\)$/);
          if (!m) return false;
          const hex = '#' + [m[1],m[2],m[3]].map(n => parseInt(n).toString(16).padStart(2,'0')).join('');
          return hex === vc;
        });
        if (matches) acc.push({ title: v.title || 'Untitled', author: v.author || null, color: vc });
        return acc;
      }, []);

      const W = 1200;
      const PAD = 80;
      const maxWidth = W - PAD * 2;
      const HEADER_Y = 70;
      const TEXT_TOP = 160;
      const SRC_HEIGHT = 100;
      const MIN_FONT = 22;
      const MAX_FONT = 36;
      const MAX_PAGE_H = 1800;

      // Build tokens
      const tokens = [];
      if (spans.length > 0) {
        for (const span of spans) {
          const words = span.text.split(/\s+/).filter(w => w);
          for (const word of words) tokens.push({ word, color: span.color || '#f5f2ec' });
        }
      } else {
        const words = selectedText.split(/\s+/).filter(w => w);
        for (const word of words) tokens.push({ word, color: '#f5f2ec' });
      }

      // Measure helper: wrap tokens at a given font size, return lines
      const measure = document.createElement('canvas').getContext('2d');
      function wrapAtSize(fontSize) {
        measure.font = fontSize + 'px "Cormorant Garamond", serif';
        const lh = Math.round(fontSize * 1.6);
        const sp = measure.measureText(' ').width;
        const lines = [];
        let cur = [], cw = 0;
        for (const tok of tokens) {
          const ww = measure.measureText(tok.word).width;
          const needed = cur.length > 0 ? sp + ww : ww;
          if (cur.length > 0 && cw + needed > maxWidth) {
            lines.push(cur);
            cur = [tok]; cw = ww;
          } else {
            cur.push(tok); cw += needed;
          }
        }
        if (cur.length) lines.push(cur);
        return { lines, lineHeight: lh, spaceWidth: sp };
      }

      // Find the best font size: largest that fits one page, or min if it overflows
      let fontSize = MAX_FONT;
      let wrapped = wrapAtSize(fontSize);
      let textHeight = wrapped.lines.length * wrapped.lineHeight;
      const maxTextH = MAX_PAGE_H - TEXT_TOP - SRC_HEIGHT - 40;

      while (fontSize > MIN_FONT && textHeight > maxTextH) {
        fontSize -= 1;
        wrapped = wrapAtSize(fontSize);
        textHeight = wrapped.lines.length * wrapped.lineHeight;
      }

      // Split into pages if text still overflows at min font
      const linesPerPage = Math.floor(maxTextH / wrapped.lineHeight);
      const pages = [];
      for (let i = 0; i < wrapped.lines.length; i += linesPerPage) {
        pages.push(wrapped.lines.slice(i, i + linesPerPage));
      }

      // Render each page
      const blobs = [];
      const fixedH = pages.length > 1
        ? TEXT_TOP + linesPerPage * wrapped.lineHeight + SRC_HEIGHT + 40
        : null;
      for (let p = 0; p < pages.length; p++) {
        const pageLines = pages[p];
        const pageTextH = pageLines.length * wrapped.lineHeight;
        const H = fixedH || (TEXT_TOP + pageTextH + SRC_HEIGHT + 40);

        const canvas = document.createElement('canvas');
        canvas.width = W;
        canvas.height = H;
        const ctx = canvas.getContext('2d');

        ctx.fillStyle = '#090909';
        ctx.fillRect(0, 0, W, H);

        // Header
        ctx.font = 'italic 28px Spectral, serif';
        ctx.textAlign = 'left';
        const centoLetters = ['C','E','N','T','O'];
        const centoColors = ['#c07a2b','#8b3d6b','#2b6e8b','#4a7a46','#c07a2b'];
        let cx = PAD;
        for (let i = 0; i < centoLetters.length; i++) {
          ctx.fillStyle = centoColors[i];
          ctx.fillText(centoLetters[i], cx, HEADER_Y);
          cx += ctx.measureText(centoLetters[i]).width + 2;
        }
        ctx.font = '28px "EB Garamond", serif';
        ctx.fillStyle = '#f5f2ec';
        ctx.textAlign = 'right';
        ctx.fillText('closeupfarout.com', W - PAD, HEADER_Y);

        // Text
        ctx.textAlign = 'left';
        ctx.font = fontSize + 'px "Cormorant Garamond", serif';
        let y = TEXT_TOP;
        for (const line of pageLines) {
          let x = PAD;
          for (const tok of line) {
            ctx.fillStyle = tok.color;
            ctx.fillText(tok.word, x, y);
            x += ctx.measureText(tok.word).width + wrapped.spaceWidth;
          }
          y += wrapped.lineHeight;
        }

        // Sources
        const srcY = H - SRC_HEIGHT + 10;
        const colW = maxWidth / 2 - 20;
        function fitText(ctx, text, maxW) {
          if (ctx.measureText(text).width <= maxW) return text;
          let t = text;
          while (t.length > 1 && ctx.measureText(t + '…').width > maxW) t = t.slice(0, -1);
          return t + '…';
        }
        ctx.font = '22px "EB Garamond", serif';
        sources.forEach((src, i) => {
          const col = i % 2;
          const row = Math.floor(i / 2);
          ctx.fillStyle = src.color;
          const sx = PAD + col * (maxWidth / 2);
          const sy = srcY + row * 36;
          ctx.fillText(fitText(ctx, src.title || 'Untitled', colW), sx, sy);
        });

        if (pages.length > 1) {
          ctx.font = '20px "EB Garamond", serif';
          ctx.fillStyle = '#f5f2ec';
          ctx.textAlign = 'right';
          ctx.fillText((p + 1) + '/' + pages.length, W - PAD, H - 30);
        }

        const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
        blobs.push(blob);
      }

      showSharePreview(blobs);
    }

    let previewBlobs = [];

    function showSharePreview(blobs) {
      previewBlobs = blobs;
      sharePopup.style.display = 'none';
      const container = document.getElementById('share-preview-images');
      container.innerHTML = '';
      blobs.forEach(blob => {
        const url = URL.createObjectURL(blob);
        const img = document.createElement('img');
        img.src = url;
        container.appendChild(img);
      });
      const overlay = document.getElementById('share-preview-overlay');
      overlay.classList.add('visible');
      const canShare = navigator.canShare && navigator.canShare({
        files: [new File([blobs[0]], 'Cento.png', { type: 'image/png' })]
      });
      document.getElementById('sp-share').style.display = canShare ? '' : 'none';
    }

    function closeSharePreview() {
      const overlay = document.getElementById('share-preview-overlay');
      overlay.classList.remove('visible');
      document.querySelectorAll('#share-preview-images img').forEach(img => {
        URL.revokeObjectURL(img.src);
      });
      previewBlobs = [];
      exitShareMode();
    }

    document.getElementById('sp-close').addEventListener('click', closeSharePreview);

    // The anchor has to be in the document and the blob URL has to outlive the
    // click — revoking it synchronously cancels the download in some browsers.
    function downloadBlob(blob, name, delay) {
      setTimeout(() => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = name;
        a.style.display = 'none';
        document.body.appendChild(a);
        a.click();
        setTimeout(() => {
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        }, 1000);
      }, delay);
    }

    // ── Multi-page cards download as one PDF ───────────────────
    // Built by hand so there's no library to load. Page images go in lossless,
    // Flate-compressed via the platform's own deflate — no JPEG artefacts on
    // the coloured serif text, which is the whole point of the card.

    function zlibDeflate(bytes) {
      const cs = new CompressionStream('deflate'); // zlib-wrapped, = /FlateDecode
      const stream = new Blob([bytes]).stream().pipeThrough(cs);
      return new Response(stream).arrayBuffer().then(b => new Uint8Array(b));
    }

    async function pngBlobToRgb(blob) {
      const bmp = await createImageBitmap(blob);
      const c = document.createElement('canvas');
      c.width = bmp.width;
      c.height = bmp.height;
      const cx = c.getContext('2d');
      cx.drawImage(bmp, 0, 0);
      const { data } = cx.getImageData(0, 0, c.width, c.height);
      const rgb = new Uint8Array(c.width * c.height * 3);
      for (let i = 0, j = 0; i < data.length; i += 4) {
        rgb[j++] = data[i]; rgb[j++] = data[i + 1]; rgb[j++] = data[i + 2];
      }
      return { w: c.width, h: c.height, rgb };
    }

    function buildPdf(pages) {
      const enc = new TextEncoder();
      const chunks = [];
      const offsets = [];
      let len = 0;
      const push = u8 => { chunks.push(u8); len += u8.length; };
      const str = s => push(enc.encode(s));
      const startObj = id => { offsets[id] = len; str(id + ' 0 obj\n'); };

      str('%PDF-1.4\n');
      push(new Uint8Array([0x25, 0xE2, 0xE3, 0xCF, 0xD3, 0x0A])); // binary marker

      const total = 2 + pages.length * 3;

      startObj(1);
      str('<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');

      startObj(2);
      str('<< /Type /Pages /Kids [' +
        pages.map((_, p) => (3 + p * 3) + ' 0 R').join(' ') +
        '] /Count ' + pages.length + ' >>\nendobj\n');

      pages.forEach((pg, p) => {
        const pageId = 3 + p * 3, contId = 4 + p * 3, imgId = 5 + p * 3;
        const pw = 600, ph = Math.round(600 * pg.h / pg.w);

        startObj(pageId);
        str('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + pw + ' ' + ph +
          '] /Resources << /XObject << /Im0 ' + imgId + ' 0 R >> >> /Contents ' +
          contId + ' 0 R >>\nendobj\n');

        const content = 'q ' + pw + ' 0 0 ' + ph + ' 0 0 cm /Im0 Do Q\n';
        startObj(contId);
        str('<< /Length ' + content.length + ' >>\nstream\n' + content + 'endstream\nendobj\n');

        startObj(imgId);
        str('<< /Type /XObject /Subtype /Image /Width ' + pg.w + ' /Height ' + pg.h +
          ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /FlateDecode /Length ' +
          pg.data.length + ' >>\nstream\n');
        push(pg.data);
        str('\nendstream\nendobj\n');
      });

      const xrefPos = len;
      let xref = 'xref\n0 ' + (total + 1) + '\n0000000000 65535 f \n';
      for (let i = 1; i <= total; i++) {
        xref += String(offsets[i]).padStart(10, '0') + ' 00000 n \n';
      }
      str(xref);
      str('trailer\n<< /Size ' + (total + 1) + ' /Root 1 0 R >>\nstartxref\n' +
        xrefPos + '\n%%EOF\n');

      const out = new Uint8Array(len);
      let o = 0;
      for (const c of chunks) { out.set(c, o); o += c.length; }
      return new Blob([out], { type: 'application/pdf' });
    }

    async function blobsToPdf(blobs) {
      const pages = [];
      for (const blob of blobs) {
        const { w, h, rgb } = await pngBlobToRgb(blob);
        pages.push({ w, h, data: await zlibDeflate(rgb) });
      }
      return buildPdf(pages);
    }

    document.getElementById('sp-download').addEventListener('click', async () => {
      const blobs = previewBlobs.slice();
      closeSharePreview();
      if (blobs.length === 1) {
        downloadBlob(blobs[0], 'Cento.png', 0);
        return;
      }
      try {
        if (!window.CompressionStream) throw new Error('no CompressionStream');
        downloadBlob(await blobsToPdf(blobs), 'Cento.pdf', 0);
      } catch (e) {
        // Older browser — fall back to one PNG per page.
        console.warn('PDF build failed, falling back to PNGs:', e);
        blobs.forEach((b, i) => downloadBlob(b, 'Cento-' + (i + 1) + '.png', i * 300));
      }
    });

    document.getElementById('sp-share').addEventListener('click', async () => {
      const files = previewBlobs.map((b, i) =>
        new File([b], previewBlobs.length > 1 ? 'Cento-' + (i + 1) + '.png' : 'Cento.png', { type: 'image/png' })
      );
      try { await navigator.share({ files }); }
      catch (e) { if (e.name === 'AbortError') return; }
      closeSharePreview();
    });


    // ── Init ───────────────────────────────────────────────────
    loadPairing();
  })();
  </script>
