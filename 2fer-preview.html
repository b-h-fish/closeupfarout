<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>2fer set preview</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #090909; color: #f5f2ec; font-family: monospace; overflow: hidden; }
  canvas { display: block; }
  #info {
    position: fixed; top: 16px; left: 16px;
    font-size: 11px; line-height: 1.8;
    color: rgba(245,242,236,0.5);
    pointer-events: none;
  }
  #controls {
    position: fixed; bottom: 16px; left: 16px;
    font-size: 10px; line-height: 2;
    color: rgba(245,242,236,0.35);
  }
</style>
</head>
<body>
<div id="info">loading model…</div>
<div id="controls">
  drag to orbit · scroll to zoom · right-drag to pan<br>
  W/S — move forward/back · A/D — strafe · Q/E — up/down<br>
  R — reset camera · L — toggle lights · G — toggle grid
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x090909);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.01, 1000);
camera.position.set(0, 1.6, 5);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.target.set(0, 0.8, 0);

// Lighting rig
const ambient = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambient);

const key = new THREE.DirectionalLight(0xffffff, 1.5);
key.position.set(3, 6, 4);
key.castShadow = true;
key.shadow.mapSize.setScalar(2048);
scene.add(key);

const fill = new THREE.DirectionalLight(0xffffff, 0.4);
fill.position.set(-3, 3, 2);
scene.add(fill);

const back = new THREE.DirectionalLight(0xffffff, 0.3);
back.position.set(0, 4, -4);
scene.add(back);

// Grid helper (toggleable)
const grid = new THREE.GridHelper(20, 40, 0x333333, 0x222222);
scene.add(grid);

// Load model
const loader = new GLTFLoader();
const infoEl = document.getElementById('info');

loader.load(
  './models/2fer-set.glb',
  (gltf) => {
    const model = gltf.scene;
    scene.add(model);

    // Auto-fit camera
    const box = new THREE.Box3().setFromObject(model);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    const maxDim = Math.max(size.x, size.y, size.z);
    camera.position.set(center.x, center.y + size.y * 0.3, center.z + maxDim * 1.4);
    controls.target.copy(center);
    controls.update();

    // Log model info
    let meshCount = 0, matNames = new Set();
    model.traverse(n => {
      if (n.isMesh) {
        meshCount++;
        n.castShadow = true;
        n.receiveShadow = true;
        if (n.material) {
          const m = Array.isArray(n.material) ? n.material : [n.material];
          m.forEach(mat => matNames.add(mat.name || '(unnamed)'));
        }
      }
    });

    infoEl.innerHTML =
      `size: ${size.x.toFixed(2)} × ${size.y.toFixed(2)} × ${size.z.toFixed(2)}<br>` +
      `center: (${center.x.toFixed(2)}, ${center.y.toFixed(2)}, ${center.z.toFixed(2)})<br>` +
      `meshes: ${meshCount}<br>` +
      `materials: ${[...matNames].slice(0, 6).join(', ')}${matNames.size > 6 ? '…' : ''}`;
  },
  (xhr) => {
    const pct = Math.round(xhr.loaded / xhr.total * 100);
    infoEl.textContent = `loading… ${pct}%`;
  },
  (err) => {
    infoEl.textContent = 'error: ' + err.message;
    console.error(err);
  }
);

// WASD fly controls
const move = {};
window.addEventListener('keydown', e => {
  move[e.key.toLowerCase()] = true;
  if (e.key === 'r' || e.key === 'R') {
    controls.reset();
  }
  if (e.key === 'l' || e.key === 'L') {
    key.visible = !key.visible;
    fill.visible = !fill.visible;
    back.visible = !back.visible;
  }
  if (e.key === 'g' || e.key === 'G') {
    grid.visible = !grid.visible;
  }
});
window.addEventListener('keyup', e => { delete move[e.key.toLowerCase()]; });

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  const speed = 0.04;
  const dir = new THREE.Vector3();
  camera.getWorldDirection(dir);
  const right = new THREE.Vector3().crossVectors(dir, camera.up).normalize();
  if (move['w']) camera.position.addScaledVector(dir, speed);
  if (move['s']) camera.position.addScaledVector(dir, -speed);
  if (move['a']) camera.position.addScaledVector(right, -speed);
  if (move['d']) camera.position.addScaledVector(right, speed);
  if (move['q']) camera.position.y -= speed;
  if (move['e']) camera.position.y += speed;
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
